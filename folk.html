<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Special Elite', monospace; 
            background: url('IMG_4928.jpeg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        #chat-container {
            width: 800%;
            max-width: 800px;
            height: 85vh;
            background: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #969696;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            resize: both;
            overflow: hidden;
            min-width: 300px;
            min-height: 400px;
            max-height: 95vh;
            max-width: 95vw;
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            color: #e5e5e5;
            font-size: 1.1rem;
            line-height: 1.2;
            text-shadow: 1px 1px 2px black; 
            display: flex;            
            flex-direction: column;  
            gap: 12px;                
        }

        /* Message Styles */
        .message-row { display: flex; align-items: flex-start; gap: 10px; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #facc15; flex-shrink: 0; background: #000; }
        .message-content { display: flex; flex-direction: column; max-width: 85%; }
        .msg-username { color: #facc15; font-size: 0.8rem; margin-bottom: 2px; opacity: 0.8; }
        .msg-text { word-wrap: break-word; }

        /* Input Area */
        #chat-input-area {
            border-top: 1px dotted #999;
            padding: 10px;
            display: flex;
            gap: 8px;
            background: transparent; 
            align-items: center; 
            flex-shrink: 0; 
        }

        input[type="text"] {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            color: #facc15; 
            padding: 6px 10px;
            outline: none;
            font-size: 1rem;
            font-family: 'Special Elite', monospace; 
        }

        /* Standard Buttons */
        button {
            font-family: 'Special Elite', monospace; 
            background: none;
            border: 1px solid #facc15;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover { background: rgba(250, 204, 21, 0.2); }

        /* --- NEW: Call Button --- */
        .call-btn {
            background: #b91c1c; /* Dark Red */
            color: #fff;
            border: 2px solid #ef4444;
            padding: 5px 12px;
            font-size: 1rem;
            margin-right: 15px;
            animation: pulse-red 2s infinite;
            text-shadow: 1px 1px 0 #000;
        }
        .call-btn:hover { background: #ef4444; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* --- Header Items --- */
        .online-indicator {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4ade80;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .dot { width: 9px; height: 9px; background: #4ade80; border-radius: 100%; box-shadow: 0 0 5px #4ade80; }
        
        .user-menu { 
            position: absolute; 
            top: 8px; 
            right: 12px; 
            display: flex; 
            align-items: center; 
        }
        
        #user-display { background: none; border: none; cursor: pointer; padding: 4px; }
        .person-icon { width: 24px; height: 24px; fill: #facc15; filter: drop-shadow(1px 1px 2px black); }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #969696;
            min-width: 130px;
            z-index: 100;
        }
        .dropdown a { display: block; padding: 10px; color: #969696; text-decoration: none; border-bottom: 1px solid #333; }
        .dropdown a:hover { background: #333; color: #facc15; }
        .show { display: block; }

        /* --- INCOMING CALL MODAL --- */
        #call-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ef4444;
            padding: 20px;
            text-align: center;
            z-index: 200;
            box-shadow: 0 0 30px #ef4444;
        }
        #call-modal h3 { color: #ef4444; margin-top: 0; font-size: 1.5rem; }
        .modal-btns { display: flex; justify-content: space-around; margin-top: 20px; }
        .btn-accept { background: #22c55e; color: black; padding: 5px 15px; border: none; }
        .btn-deny { background: #333; color: #fff; padding: 5px 15px; border: 1px solid #666; }

    </style>
</head>
<body>

    <div id="chat-container">
        <div id="call-modal">
            <h3>INCOMING CALL ALERT</h3>
            <p id="caller-name" style="color: #fff;">User is calling...</p>
            <div class="modal-btns">
                <button class="btn-deny" onclick="document.getElementById('call-modal').style.display='none'">IGNORE</button>
                <button class="btn-accept" id="accept-btn">JOIN</button>
            </div>
        </div>

        <div class="online-indicator">
            <div class="dot"></div>
            <span id="user-count">0</span>
        </div>

        <div class="user-menu">
            <button id="call-all-btn" class="call-btn">
                <svg style="width:16px;height:16px;margin-right:5px;fill:currentColor" viewBox="0 0 24 24"><path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/></svg>
                call folk
            </button>

            <button id="user-display" onclick="toggleMenu()">
                <svg class="person-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </button>
            <div id="user-dropdown" class="dropdown">
                <a href="folk" id="display-name" style="color:#fff; pointer-events:none;"></a>
                <a href="index.html">Main Chat</a>
                <a href="settings">settings</a>
                <a href="#" onclick="logout()">logout</a>
            </div>
        </div>

        <div id="chat-messages"></div>

        <div id="chat-input-area">
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            <input type="text" id="msg-input" placeholder="Type..." autocomplete="off">
            <button onclick="document.getElementById('image-upload').click()" title="Upload Image" style="padding: 5px 10px;">
                <svg class="upload-icon" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <button id="send-btn" style="color: #facc15; padding: 6px 15px;">[SEND]</button>
        </div>
    </div>

    <script type="module" src="folk.js"></script>
    <script>
        function toggleMenu() { document.getElementById("user-dropdown").classList.toggle("show"); }
        window.onclick = function(event) { if (!event.target.closest('#user-display')) { document.getElementById("user-dropdown").classList.remove('show'); } }
        function logout() { localStorage.removeItem('username'); window.location.href = 'index.html'; }
        
        const fileInput = document.getElementById('image-upload');
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { if (window.sendImage) window.sendImage(e.target.result); };
                reader.readAsDataURL(this.files[0]);
                this.value = '';
            }
        });
    </script>
</body>
</html>
