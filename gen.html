<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music List Generator</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        textarea { width: 100%; height: 400px; background: #222; color: #fff; border: 1px solid #444; margin-top: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0f0; border: none; font-weight: bold; }
        .info { margin-bottom: 20px; color: #ccc; }
    </style>
</head>
<body>
    <h1>JSON Playlist Generator</h1>
    <div class="info">
        1. Click the button below.<br>
        2. Select your "music" folder (where your 700 songs are).<br>
        3. Copy the resulting code into your <b>songs.json</b> file.
    </div>
    
    <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none">
    <button onclick="document.getElementById('fileInput').click()">SELECT MUSIC FOLDER</button>
    
    <h3 id="status">Waiting...</h3>
    <textarea id="output"></textarea>

    <script>
        const input = document.getElementById('fileInput');
        const output = document.getElementById('output');
        const status = document.getElementById('status');

        input.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            const musicFiles = files.filter(f => f.name.endsWith('.mp3'));
            
            status.textContent = `Found ${musicFiles.length} songs. Generating JSON...`;

            // THE BASE URL - Change this if you aren't putting music in a 'music' subfolder
            const folderPath = "music/"; 
            // If you are putting mp3s in the ROOT folder, change above to: ""

            const songList = musicFiles.map(file => {
                let artist = "Unknown";
                let title = file.name.replace('.mp3', '');
                
                // Smart guessing: "Artist - Title.mp3"
                if (title.includes(' - ')) {
                    const parts = title.split(' - ');
                    artist = parts[0].trim();
                    title = parts.slice(1).join(' - ').trim(); // Rejoin in case title has dashes
                } else if (title.includes('-')) {
                     // Fallback for simple dash
                    const parts = title.split('-');
                    artist = parts[0].trim();
                    title = parts.slice(1).join('-').trim();
                }

                return {
                    t: title,
                    a: artist,
                    s: folderPath + file.name,
                    c: "https://placehold.co/200x200/000000/333333?text=No+Art" // Default art
                };
            });

            output.value = JSON.stringify(songList, null, 2); // Pretty print JSON
            status.textContent = `Done! Copy the code below into songs.json`;
        });
    </script>
</body>
</html>
