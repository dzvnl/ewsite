        /* --- RESET & BASE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #ccc;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.4;
            overflow-x: hidden;
        }
        a { color: #fff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* --- LAYOUT CONTAINER --- */
        .container { width: 900px; margin: 0 auto; padding-top: 50px; }

        /* --- HEADER --- */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
            padding-left: 170px;
            position: relative;
        }
        .top-links { color: #666; }
        .top-links span { margin: 0 5px; color: #444; }
        .brand-logo {
            font-family: "Times New Roman", serif;
            font-size: 32px;
            color: #fff;
            letter-spacing: 2px;
        }

        /* --- ADMIN TRIGGER (+) --- */
        #admin-trigger {
            position: absolute;
            top: -30px; right: 0;
            color: #222; font-size: 14px; cursor: pointer; padding: 5px;
            transition: color 0.2s;
        }
        #admin-trigger:hover { color: #fff; }

        /* --- MAIN GRID --- */
        .main-layout { display: flex; gap: 15px; }

        /* --- LEFT SIDEBAR --- */
        .sidebar-left { width: 150px; text-align: right; padding-right: 10px; }
        .nav-list { list-style: none; }
        .nav-list li {
            margin-bottom: 4px; font-weight: bold; color: #eee;
            display: flex; justify-content: flex-end; align-items: center;
        }
        .nav-list li a { color: #eee; }
        .nav-list li::after {
            content: ""; display: inline-block; width: 0; height: 0;
            border-top: 4px solid transparent; border-bottom: 4px solid transparent;
            border-left: 4px solid #fff; margin-left: 8px;
        }

        /* --- CENTER COLUMN --- */
        .content-center { width: 480px; }
        .section-header {
            background-color: #666; color: #fff;
            padding: 3px 5px; font-size: 12px; font-weight: bold;
            margin-bottom: 10px;
        }
        .news-item { margin-bottom: 25px; }
        .news-title-bar {
            background-color: #333; color: #fff;
            padding: 3px 5px; font-size: 12px; margin-bottom: 8px;
        }
        .news-text { color: #bbb; margin-bottom: 10px; }
        
        #splash-text { color: #facc15; font-style: italic; }

        /* Notification Area inside News */
        #system-notifications {
            color: #ff5555; margin-top: 5px; display: none;
            border-top: 1px dotted #444; padding-top: 5px;
        }

        /* --- RIGHT SIDEBAR --- */
        .sidebar-right { width: 220px; }
        
        #music-player-container {
            background-color: #222; border: 1px solid #333;
            padding: 10px; margin-bottom: 20px; text-align: center;
        }
        #player-cover-art {
            width: 100%; height: auto; border: 1px solid #444;
            margin-bottom: 8px; background-color: #000;
        }
        #player-title { color: #fff; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        #player-artist { color: #888; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-controls { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .player-btn {
            background: #444; border: none; color: #fff;
            width: 25px; height: 20px; font-size: 10px; cursor: pointer;
        }
        .player-btn:hover { background: #666; }
        #volume-slider { width: 100%; height: 5px; }

        .related-list { list-style: none; margin-top: 10px; margin-bottom: 30px; }
        .related-list li { margin-bottom: 4px; display: flex; align-items: center; }
        .related-list li::before {
            content: ""; display: inline-block; width: 4px; height: 6px;
            background: #ccc; margin-right: 8px;
            clip-path: polygon(0 0, 0% 100%, 100% 50%);
        }

        .footer {
            margin-top: 50px; border-top: 1px solid #333;
            padding: 20px 0 50px; text-align: center;
            color: #666; font-size: 10px;
        }

        /* --- ADMIN CONSOLE --- */
        #admin-console {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 400px;
            background: #000; border: 1px solid #fff; padding: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 10000;
            font-family: monospace;
        }
        #admin-input {
            width: 100%; background: #111; color: #0f0;
            border: 1px solid #333; padding: 8px; font-family: monospace; outline: none;
        }
        #admin-log {
            color: #666; font-size: 10px; margin-top: 5px;
            max-height: 100px; overflow-y: auto; white-space: pre-wrap;
        }

        /* --- BANNED SCREEN --- */
        #banned-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #f00; z-index: 99999;
            align-items: center; justify-content: center; flex-direction: column;
            font-family: monospace; font-size: 24px;
        }
        #unlock-input {
            margin-top: 20px; background: #111; border: 1px solid #333;
            color: #333; font-family: monospace; text-align: center;
            padding: 5px; font-size: 10px; width: 150px;
        }
        #unlock-input:focus { color: #fff; outline: none; border-color: #555; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- YOUR CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b",
            measurementId: "G-GTN3TL1P2K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- USER ID ---
        const currentUser = localStorage.getItem('username') || "guest";

        // --- EMERGENCY UNLOCK LOGIC ---
        const unlockInput = document.getElementById('unlock-input');
        unlockInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (unlockInput.value === "root123") { // PASSWORD
                    localStorage.setItem('admin_bypass', 'true');
                    alert("Override Active. Reloading...");
                    location.reload(); 
                } else {
                    alert("Invalid Key.");
                }
            }
        });

        // --- LIVE LISTENERS ---
        
        // Splash Listener
        onValue(ref(db, 'site/splash'), (snapshot) => {
            const val = snapshot.val();
            if(val && val.text) {
                 if (Date.now() - val.timestamp < 600000) { // 10 mins
                    document.getElementById('splash-text').textContent = val.text;
                    window.liveSplashActive = true; 
                 } else {
                    window.liveSplashActive = false;
                 }
            }
        });

        // Announcement Listener
        onValue(ref(db, 'site/news'), (snapshot) => {
            if(snapshot.val()) document.getElementById('main-news-text').textContent = snapshot.val();
        });

        // Notification Listener
        onValue(ref(db, 'site/notify'), (snapshot) => {
            const data = snapshot.val();
            if(data && data.msg) {
                const el = document.getElementById('system-notifications');
                const txt = document.getElementById('sys-notif-msg');
                if(data.target === 'all' || data.target === currentUser) {
                    if (Date.now() - data.timestamp < 60000) {
                        el.style.display = 'block';
                        txt.textContent = data.msg;
                    } else {
                        el.style.display = 'none';
                    }
                }
            }
        });

        // Ban Listener (Global & User Specific + BYPASS CHECK)
        onValue(ref(db, 'bans'), (snapshot) => {
            const bans = snapshot.val() || {};
            const globalBan = bans.global === true;
            const userBan = bans[currentUser] && bans[currentUser].site === true;

            // CHECK FOR ADMIN BYPASS
            const isBypassed = localStorage.getItem('admin_bypass') === 'true';

            if ((globalBan || userBan) && !isBypassed) {
                document.getElementById('banned-screen').style.display = 'flex';
                document.getElementById('site-container').style.display = 'none';
            } else {
                document.getElementById('banned-screen').style.display = 'none';
                document.getElementById('site-container').style.display = 'block';
            }

            window.currentUserBans = bans[currentUser] || {};
        });

        // --- ADMIN CONSOLE LOGIC ---
        const adminTrigger = document.getElementById('admin-trigger');
        const adminConsole = document.getElementById('admin-console');
        const adminInput = document.getElementById('admin-input');
        const adminLog = document.getElementById('admin-log');
        let isAuthenticated = false;

        // Auto-authenticate if bypassed
        if (localStorage.getItem('admin_bypass') === 'true') {
            isAuthenticated = true;
        }

        function toggleConsole() {
            const isHidden = adminConsole.style.display === 'none';
            adminConsole.style.display = isHidden ? 'block' : 'none';
            if(isHidden) {
                adminInput.value = '';
                adminInput.focus();
                if(!isAuthenticated) {
                    document.getElementById('auth-check').style.display = 'block';
                    adminInput.placeholder = "password required";
                } else {
                    document.getElementById('auth-check').style.display = 'none';
                    adminInput.placeholder = "enter command...";
                }
            }
        }

        adminTrigger.addEventListener('click', toggleConsole);
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== adminInput && document.activeElement !== unlockInput) {
                e.preventDefault(); toggleConsole();
            }
            if (e.key === 'Escape') adminConsole.style.display = 'none';
        });

        adminInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                const val = adminInput.value.trim();
                adminInput.value = '';

                if(!isAuthenticated) {
                    if(val === "root123") {
                        isAuthenticated = true;
                        localStorage.setItem('admin_bypass', 'true'); // AUTO BYPASS ON LOGIN
                        document.getElementById('auth-check').style.display = 'none';
                        adminInput.placeholder = "command...";
                        adminLog.textContent = "Access Granted. Bypass Active.\n" + adminLog.textContent;
                    } else {
                        adminLog.textContent = "Wrong password.\n" + adminLog.textContent;
                    }
                    return;
                }

                const parts = val.split(' ');
                const cmd = parts[0].toLowerCase();
                const args = parts.slice(1).join(' ');

                switch(cmd) {
                    // GLOBAL BANS
                    case '/ban':
                        if(args === 'off') {
                            update(ref(db, 'bans'), { global: false });
                            adminLog.textContent = "Site Unlocked (Global).\n";
                        } else {
                            update(ref(db, 'bans'), { global: true });
                            adminLog.textContent = "Site LOCKED (Global).\n";
                        }
                        break;
                    case '/unlock': // Alias for unbanning global
                        update(ref(db, 'bans'), { global: false });
                        adminLog.textContent = "Site Unlocked.\n";
                        break;
                    
                    // SITE UPDATES
                    case '/announcement': set(ref(db, 'site/news'), args); adminLog.textContent = "News updated.\n"; break;
                    case '/notify': 
                        const target = parts[1];
                        const msg = parts.slice(2).join(' ');
                        set(ref(db, 'site/notify'), { target: target, msg: msg, timestamp: Date.now() });
                        adminLog.textContent = `Notified ${target}.\n`;
                        break;
                    case '/splash': set(ref(db, 'site/splash'), { text: args, timestamp: Date.now() }); adminLog.textContent = "Splash overridden for 10m.\n"; break;

                    // FEATURE BANS
                    case '/chatban': update(ref(db, `bans/${args}`), { chat: true }); adminLog.textContent = `${args} chat banned.\n`; break;
                    case '/listban': update(ref(db, `bans/${args}`), { list: true }); adminLog.textContent = `${args} list banned.\n`; break;
                    case '/watchban': update(ref(db, `bans/${args}`), { watch: true }); adminLog.textContent = `${args} watch banned.\n`; break;
                    
                    // NEW COMMAND: FULL BAN
                    case '/fullban':
                        update(ref(db, `bans/${args}`), {
                            site: true,
                            chat: true,
                            list: true,
                            watch: true
                        });
                        adminLog.textContent = `FULL BAN applied to ${args} (Site + Features).\n`;
                        break;

                    // NEW COMMAND: FULL UNBAN
                    case '/fullunban':
                        set(ref(db, `bans/${args}`), null);
                        adminLog.textContent = `FULL UNBAN applied to ${args}. All restrictions removed.\n`;
                        break;

                    // SPECIFIC UNBANS
                    case '/unchatban': update(ref(db, `bans/${args}`), { chat: null }); adminLog.textContent = `Removed CHAT ban for ${args}.\n`; break;
                    case '/unlistban': update(ref(db, `bans/${args}`), { list: null }); adminLog.textContent = `Removed LIST ban for ${args}.\n`; break;
                    case '/unwatchban': update(ref(db, `bans/${args}`), { watch: null }); adminLog.textContent = `Removed WATCH ban for ${args}.\n`; break;
                    
                    // STANDARD UNBAN (Alias for fullunban mostly)
                    case '/unban': 
                        set(ref(db, `bans/${args}`), null); 
                        adminLog.textContent = `Unbanned ${args}.\n`; 
                        break;

                    case '/help': adminLog.textContent = "CMDS: /ban [off], /fullban, /fullunban, /chatban, /unchatban, /listban, /unlistban, /watchban, /unwatchban\n"; break;
                    default: adminLog.textContent = "Unknown command.\n";
                }
            }
        });

        // Link Handler (WITH ADMIN BYPASS)
        function checkLinkBan(e, type) {
            // Check if user is banned
            if(window.currentUserBans && window.currentUserBans[type] === true) {
                // Check if user is ADMIN (Bypassed)
                if (localStorage.getItem('admin_bypass') !== 'true') {
                    e.preventDefault();
                    alert("ACCESS DENIED: You are banned from this feature.");
                }
            }
        }
        document.getElementById('link-chat').addEventListener('click', (e) => checkLinkBan(e, 'chat'));
        document.getElementById('link-list').addEventListener('click', (e) => checkLinkBan(e, 'list'));
        document.getElementById('link-watch').addEventListener('click', (e) => checkLinkBan(e, 'watch'));
    </script>

                    "dufockle isnt evil, #freedufockletillitsbackwards", 
                    "free larry free young thug", 
                    "3 packs of craigslist kosher ham", 
                    "if you could do anything in life without restrictions, without barriers, problems, all easily done, basically given to you, not working or earning your accomplishments, would you still do it?", 
                    "oh dont hate me because im beautiful", 
                    "wtf does \"im bippin\" mean?" 
                ];

                setTimeout(() => {
                    if (!window.liveSplashActive) {
                        splashElement.textContent = splashOptions[Math.floor(Math.random() * splashOptions.length)];
                    }
                }, 500);
            }

            // MUSIC PLAYER LOGIC
            const audioPlayer = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const rewindBtn = document.getElementById('rewind-btn');
            const skipBtn = document.getElementById('skip-btn');
            const playerTitleEl = document.getElementById('player-title');
            const playerArtistEl = document.getElementById('player-artist');
            const volumeSlider = document.getElementById('volume-slider');
            const playerCoverArt = document.getElementById('player-cover-art');
            const placeholderCover = "https://placehold.co/200x200/000000/333333?text=No+Art";
            
            let currentSongIndex = 0;
            let isPlaying = false;
            const secretSong = { title: "hey, big guy said im an easter egg", artist: "secret", src: "clock.mp3", cover: "handofpeace.jpg" };

            function loadSong(songIndex) {
                const song = (songIndex === -1) ? secretSong : playlist[songIndex];
                if (!song || !song.src) { skipSong(true); return; }
                audioPlayer.src = song.src; 
                playerTitleEl.textContent = song.title;
                playerArtistEl.textContent = song.artist;
                playerCoverArt.src = song.cover || placeholderCover;
                playPauseBtn.textContent = '>';
                isPlaying = false;
            }

            function playSong() {
                if (!audioPlayer.src) { return; }
                audioPlayer.volume = volumeSlider.value; 
                const playPromise = audioPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playPauseBtn.textContent = '||';
                        isPlaying = true;
                    }).catch(error => {
                        playerTitleEl.textContent = "Click Play";
                        isPlaying = false;
                    });
                }
            }

            function pauseSong() {
                audioPlayer.pause();
                playPauseBtn.textContent = '>';
                isPlaying = false;
            }

            function togglePlayPause() { if (isPlaying) { pauseSong(); } else { playSong(); } }

            function skipSong(skipOnly = false) {
                let nextSongIndex = Math.floor(Math.random() * playlist.length);
                if (nextSongIndex === currentSongIndex && playlist.length > 1) { nextSongIndex = (nextSongIndex + 1) % playlist.length; }
                currentSongIndex = nextSongIndex;
                loadSong(currentSongIndex);
                if (audioPlayer.src && !skipOnly) { playSong(); }
            }

            function rewindSong() {
                currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
                loadSong(currentSongIndex);
                if (audioPlayer.src) { playSong(); }
            }

            window.addEventListener('beforeunload', () => {
                if (audioPlayer.currentTime > 0) {
                    const musicState = { currentSongIndex: currentSongIndex, currentTime: audioPlayer.currentTime, volume: audioPlayer.volume, isPlaying: isPlaying };
                    sessionStorage.setItem('musicPlayerState', JSON.stringify(musicState));
                }
            });

            function loadInitialState() {
                const savedStateJSON = sessionStorage.getItem('musicPlayerState');
                let savedState = null;
                try { savedState = JSON.parse(savedStateJSON); } catch (e) {}

                if (savedState) {
                    currentSongIndex = savedState.currentSongIndex;
                    loadSong(currentSongIndex);
                    volumeSlider.value = savedState.volume || 1;
                    audioPlayer.volume = savedState.volume || 1;
                    audioPlayer.addEventListener('loadedmetadata', () => {
                        audioPlayer.currentTime = savedState.currentTime || 0;
                        if (savedState.isPlaying) { playSong(); }
                    }, { once: true }); 
                } else {
                    const rareSongChance = Math.floor(Math.random() * 50);
                    currentSongIndex = (rareSongChance === 0) ? -1 : Math.floor(Math.random() * playlist.length);
                    loadSong(currentSongIndex);
                    audioPlayer.volume = volumeSlider.value;
                }
            }

            playPauseBtn.addEventListener('click', togglePlayPause);
            skipBtn.addEventListener('click', () => skipSong(false));
            rewindBtn.addEventListener('click', rewindSong);
            volumeSlider.addEventListener('input', (e) => { audioPlayer.volume = e.target.value; });
            audioPlayer.addEventListener('ended', () => skipSong(false));
            playerCoverArt.addEventListener('error', () => { playerCoverArt.src = placeholderCover; });

            loadInitialState();
        });
    </script>
</body>
</html>
