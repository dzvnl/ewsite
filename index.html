    <audio id="audio" src=""></audio>
    <script>
        // Simple logic to use your existing playlist.js
        // Assumes playlist.js has a variable named 'playlist' or 'songs'
        // If not, edit the variable name below.
        
        let trackList = [];
        // Attempt to find the array from your file
        if (typeof playlist !== 'undefined') trackList = playlist;
        else if (typeof songs !== 'undefined') trackList = songs;

        let currentIdx = 0;
        const audio = document.getElementById('audio');
        const titleDisplay = document.getElementById('song-title');
        const playBtn = document.getElementById('play-btn');

        function loadTrack(index) {
            if (trackList.length > 0) {
                const track = trackList[index];
                // Checks for 'src' or 'file' property
                audio.src = track.src || track.file || track.url; 
                // Checks for 'title' or 'name' property
                titleDisplay.innerText = (track.title || track.name) + " - " + (track.artist || "");
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "||";
            } else {
                audio.pause();
                playBtn.innerText = ">";
            }
        }

        function nextSong() {
            currentIdx = (currentIdx + 1) % trackList.length;
            loadTrack(currentIdx);
            audio.play();
            playBtn.innerText = "||";
        }

        function prevSong() {
            currentIdx = (currentIdx - 1 + trackList.length) % trackList.length;
            loadTrack(currentIdx);
            audio.play();
            playBtn.innerText = "||";
        }

        // Init
        if(trackList.length > 0) loadTrack(0);
    </script>
