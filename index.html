<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <style>
        /* --- BASE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #ccc;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.4;
            overflow-x: hidden;
        }
        a { color: #fff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* --- LAYOUT --- */
        .container { width: 900px; margin: 0 auto; padding-top: 50px; }
        
        /* --- HEADER --- */
        .top-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 10px; padding-left: 170px; position: relative;
        }
        .top-links { color: #666; }
        .top-links span { margin: 0 5px; color: #444; }
        .brand-logo { font-family: "Times New Roman", serif; font-size: 32px; color: #fff; letter-spacing: 2px; }

        /* --- ADMIN TRIGGER --- */
        #admin-trigger {
            position: absolute; top: -30px; right: 0;
            color: #222; font-size: 14px; cursor: pointer; padding: 5px;
        }
        #admin-trigger:hover { color: #fff; }

        /* --- MAIN GRID --- */
        .main-layout { display: flex; gap: 15px; }
        .sidebar-left { width: 150px; text-align: right; padding-right: 10px; }
        .nav-list { list-style: none; }
        .nav-list li { margin-bottom: 4px; font-weight: bold; color: #eee; display: flex; justify-content: flex-end; align-items: center; }
        .nav-list li a { color: #eee; cursor: pointer; }
        .nav-list li::after {
            content: ""; display: inline-block; width: 0; height: 0;
            border-top: 4px solid transparent; border-bottom: 4px solid transparent;
            border-left: 4px solid #fff; margin-left: 8px;
        }

        .content-center { width: 480px; }
        .section-header { background-color: #666; color: #fff; padding: 3px 5px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .news-item { margin-bottom: 25px; }
        .news-title-bar { background-color: #333; color: #fff; padding: 3px 5px; font-size: 12px; margin-bottom: 8px; }
        .news-text { color: #bbb; margin-bottom: 10px; }
        #splash-text { color: #facc15; font-style: italic; }

        /* --- RIGHT SIDEBAR --- */
        .sidebar-right { width: 220px; }
        #music-player-container { background-color: #222; border: 1px solid #333; padding: 10px; margin-bottom: 20px; text-align: center; }
        #player-cover-art { width: 100%; height: auto; border: 1px solid #444; margin-bottom: 8px; background-color: #000; }
        .player-controls { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .player-btn { background: #444; border: none; color: #fff; width: 25px; height: 20px; font-size: 10px; cursor: pointer; }
        #volume-slider { width: 100%; height: 5px; }
        .related-list { list-style: none; margin-top: 10px; margin-bottom: 30px; }
        .related-list li::before { content: ""; display: inline-block; width: 4px; height: 6px; background: #ccc; margin-right: 8px; clip-path: polygon(0 0, 0% 100%, 100% 50%); }

        .footer { margin-top: 50px; border-top: 1px solid #333; padding: 20px 0 50px; text-align: center; color: #666; font-size: 10px; }

        /* --- ADMIN CONSOLE UI --- */
        #admin-console {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; background: #000; border: 2px solid #fff; padding: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9); z-index: 9999; font-family: monospace;
        }
        #admin-input { width: 100%; background: #111; color: #0f0; border: 1px solid #333; padding: 8px; font-family: monospace; outline: none; margin-top: 5px;}
        #admin-log { color: #666; font-size: 10px; margin-top: 5px; min-height: 15px; }
        
        /* --- NOTIFICATION UI --- */
        #notification-overlay {
            display: none; position: fixed; top: 20px; right: 20px; background: #000; color: #fff;
            padding: 0; border: 1px solid #fff; z-index: 10000; width: 250px;
            box-shadow: 5px 5px 0px rgba(100,100,100,0.5);
        }
        #notification-msg { padding: 15px; }

        /* --- BANNED SCREEN --- */
        #banned-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #f00; z-index: 99999;
            align-items: center; justify-content: center; flex-direction: column;
            font-family: monospace; font-size: 24px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="banned-screen">
        <div>System Halted</div>
        <div style="font-size:12px; color:#555; margin-top:10px;">ID: <span id="ban-id"></span></div>
    </div>

    <div id="notification-overlay">
        <div class="section-header">system message</div>
        <p id="notification-msg">...</p>
    </div>

    <div id="admin-console">
        <div class="section-header">root terminal</div>
        <div id="auth-check" style="display:none; color:red; margin-bottom:5px;">ENTER ADMIN PASSWORD:</div>
        <input type="text" id="admin-input" placeholder="awaiting command..." autocomplete="off">
        <div id="admin-log">ready</div>
    </div>

    <div class="container" id="main-container">
        
        <div class="top-header">
            <div id="admin-trigger">+</div>
            <div class="top-links">
                <span id="welcome-message">loading...</span> 
                <span>|</span> 
                <a href="#" id="auth-link">login</a>
            </div>
            <div class="brand-logo"></div>
        </div>

        <div class="main-layout">

            <aside class="sidebar-left">
                <ul class="nav-list">
                    <li><a href="#" id="link-home">home</a></li>
                    <li><a href="#" id="link-list">list</a></li>
                    <li><a href="#" id="link-chat">chat</a></li>
                    <li><a href="#" id="link-watch">watch</a></li>
                </ul>
            </aside>

            <main class="content-center">
                <div class="news-item">
                    <p class="news-text" id="splash-text">connecting to satellite...</p>
                    <div class="section-header">status</div>
                </div>

                <div class="section-header">news</div>
                <div class="news-item">
                    <div style="width:100%; height:120px; background:#111; border:1px solid #333;"></div>
                    <div class="news-title-bar">announcement</div>
                    <p class="news-text" id="main-news-text">no signal</p>
                </div>
            </main>

            <aside class="sidebar-right">
                <div class="section-header">music</div>
                <div id="music-player-container">
                    <img id="player-cover-art" src="https://placehold.co/200x200/000000/333333?text=..." alt="Art">
                    <div id="player-title">...</div>
                    <div class="player-controls">
                        <button id="play-pause-btn" class="player-btn">&gt;</button>
                        <button id="skip-btn" class="player-btn">&gt;&gt;</button>
                    </div>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </aside>

        </div>
        <footer class="footer">running v2.0 live</footer>
    </div>

    <audio id="audio-player"></audio>

    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push, child, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ------------------------------------------------------------------
        // REPLACE THE CONFIG BELOW WITH YOURS FROM FIREBASE CONSOLE
        // ------------------------------------------------------------------
        
// --- PASTE YOUR API KEYS HERE ---
const firebaseConfig = {
     apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
    authDomain: "ewsitechat.firebaseapp.com",
    databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
    projectId: "ewsitechat",
    storageBucket: "ewsitechat.firebasestorage.app",
    messagingSenderId: "282495574514",
    appId: "1:282495574514:web:e2781da630d93fc1ce8b6b",
    measurementId: "G-GTN3TL1P2K"
        };
        // ------------------------------------------------------------------

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- USER IDENTIFICATION ---
        // We assign a random ID to this browser so we can ban specific people
        let myId = localStorage.getItem('unique_user_id');
        let myUsername = localStorage.getItem('username') || "guest";
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('unique_user_id', myId);
        }
        document.getElementById('ban-id').textContent = myId;
        document.getElementById('welcome-message').textContent = `user: ${myUsername}`;

        // --- REALTIME LISTENERS (This makes it LIVE for everyone) ---

        // 1. Listen for Splash Text
        onValue(ref(db, 'site/splash'), (snapshot) => {
            const val = snapshot.val();
            if (val) document.getElementById('splash-text').textContent = val;
        });

        // 2. Listen for News/Announcement
        onValue(ref(db, 'site/news'), (snapshot) => {
            const val = snapshot.val();
            if (val) document.getElementById('main-news-text').textContent = val;
        });

        // 3. Listen for Global Site Ban (Everyone)
        onValue(ref(db, 'site/banned'), (snapshot) => {
            if (snapshot.val() === true) {
                document.getElementById('banned-screen').style.display = 'flex';
                document.getElementById('main-container').style.display = 'none';
            } else {
                // Only unhide if not individually banned
                checkIndividualBan(); 
            }
        });

        // 4. Listen for Individual Bans & Link Bans
        function checkIndividualBan() {
            onValue(ref(db, `bans/${myUsername}`), (snapshot) => {
                const bans = snapshot.val() || {};
                
                // Full Site Ban
                if (bans.site === true) {
                    document.getElementById('banned-screen').style.display = 'flex';
                    document.getElementById('main-container').style.display = 'none';
                } else {
                    document.getElementById('banned-screen').style.display = 'none';
                    document.getElementById('main-container').style.display = 'block';
                }

                // Link Bans
                window.currentUserBans = bans; // Store for link click checks
            });
        }
        checkIndividualBan();

        // 5. Listen for Notifications
        onValue(ref(db, 'notifications/latest'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Check timestamp to ensure we don't show old notifs on reload (simple check)
            const isFresh = (Date.now() - data.timestamp) < 60000; // 1 min freshness
            
            // Check target
            if (isFresh && (data.target === 'all' || data.target === myUsername)) {
                // Prevent duplicate showing of same ID
                if (sessionStorage.getItem('last_notif_id') !== data.id) {
                    showNotification(data.msg);
                    sessionStorage.setItem('last_notif_id', data.id);
                }
            }
        });

        function showNotification(msg) {
            const el = document.getElementById('notification-overlay');
            document.getElementById('notification-msg').textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        // --- LINK CLICK HANDLERS ---
        function handleLink(e, type) {
            if (window.currentUserBans && window.currentUserBans[type] === true) {
                e.preventDefault();
                alert(`[ACCESS DENIED] You are banned from ${type}.`);
            }
        }
        document.getElementById('link-chat').addEventListener('click', (e) => handleLink(e, 'chat'));
        document.getElementById('link-list').addEventListener('click', (e) => handleLink(e, 'list'));
        document.getElementById('link-watch').addEventListener('click', (e) => handleLink(e, 'watch'));


        // --- ADMIN CONSOLE LOGIC ---
        const adminConsole = document.getElementById('admin-console');
        const adminInput = document.getElementById('admin-input');
        const adminLog = document.getElementById('admin-log');
        let isAdminAuthenticated = false;

        // Toggle Console
        const toggleConsole = () => {
            const isHidden = adminConsole.style.display === 'none';
            adminConsole.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                adminInput.value = '';
                adminInput.focus();
                if(!isAdminAuthenticated) {
                    document.getElementById('auth-check').style.display = 'block';
                    adminInput.placeholder = "enter admin password";
                } else {
                    document.getElementById('auth-check').style.display = 'none';
                    adminInput.placeholder = "enter command...";
                }
            }
        };

        // Hotkey / Button
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== adminInput) {
                e.preventDefault(); toggleConsole();
            }
            if (e.key === 'Escape') adminConsole.style.display = 'none';
        });
        document.getElementById('admin-trigger').addEventListener('click', toggleConsole);

        // Command Processing
        adminInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = adminInput.value.trim();
                adminInput.value = '';

                // 1. Password Check (Simple)
                if (!isAdminAuthenticated) {
                    if (val === "6ix7even") { // CHANGE THIS PASSWORD
                        isAdminAuthenticated = true;
                        document.getElementById('auth-check').style.display = 'none';
                        adminInput.placeholder = "access granted. enter command.";
                        adminLog.textContent = "Logged in as root.";
                    } else {
                        adminLog.textContent = "Incorrect password.";
                    }
                    return;
                }

                // 2. Command Parsing
                const parts = val.split(' ');
                const cmd = parts[0].toLowerCase();
                const args = parts.slice(1).join(' ');

                runCommand(cmd, args, parts);
            }
        });

        function runCommand(cmd, args, parts) {
            switch(cmd) {
                case '/splash':
                    // Update splash for everyone
                    set(ref(db, 'site/splash'), args);
                    adminLog.textContent = `Splash updated: "${args}"`;
                    break;
                
                case '/announcement':
                    set(ref(db, 'site/news'), args);
                    adminLog.textContent = "News updated.";
                    break;

                case '/notify':
                    // Usage: /notify all hello world OR /notify username hello world
                    const target = parts[1];
                    const msg = parts.slice(2).join(' ');
                    if (!target || !msg) { adminLog.textContent = "Usage: /notify [all/user] [msg]"; return; }
                    
                    set(ref(db, 'notifications/latest'), {
                        target: target,
                        msg: msg,
                        timestamp: Date.now(),
                        id: Math.random().toString()
                    });
                    adminLog.textContent = `Sent notification to ${target}`;
                    break;

                case '/ban':
                    // Bans EVERYONE from the site (Maintenance mode)
                    if (args === 'off') {
                        set(ref(db, 'site/banned'), false);
                        adminLog.textContent = "Site unlocked.";
                    } else {
                        set(ref(db, 'site/banned'), true);
                        adminLog.textContent = "Site LOCKED (Global Ban). Type '/ban off' to undo.";
                    }
                    break;

                case '/chatban':
                    if (!args) { adminLog.textContent = "Usage: /chatban [user]"; return; }
                    update(ref(db, `bans/${args}`), { chat: true });
                    adminLog.textContent = `Banned ${args} from chat.`;
                    break;

                case '/listban':
                    if (!args) { adminLog.textContent = "Usage: /listban [user]"; return; }
                    update(ref(db, `bans/${args}`), { list: true });
                    adminLog.textContent = `Banned ${args} from list.`;
                    break;
                
                case '/watchban':
                    if (!args) { adminLog.textContent = "Usage: /watchban [user]"; return; }
                    update(ref(db, `bans/${args}`), { watch: true });
                    adminLog.textContent = `Banned ${args} from watch.`;
                    break;
                
                case '/siteban': 
                    // Ban specific user from whole site
                    if (!args) { adminLog.textContent = "Usage: /siteban [user]"; return; }
                    update(ref(db, `bans/${args}`), { site: true });
                    adminLog.textContent = `Banned ${args} from website completely.`;
                    break;

                case '/unban':
                    // Usage: /unban user type (or all)
                    const user = parts[1];
                    if (!user) { adminLog.textContent = "Usage: /unban [user]"; return; }
                    set(ref(db, `bans/${user}`), null);
                    adminLog.textContent = `Unbanned ${user}.`;
                    break;

                default:
                    adminLog.textContent = "Unknown command.";
            }
        }
        
        // --- MUSIC PLAYER (Visual Placeholder for this code) ---
        // (Add your existing music array logic here inside a standard script tag if needed, 
        // or just keep the visual shell for now)
        const playBtn = document.getElementById('play-pause-btn');
        playBtn.addEventListener('click', () => {
            playBtn.textContent = playBtn.textContent === '>' ? '||' : '>';
        });

    </script>
</body>
</html>
