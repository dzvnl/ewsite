<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #e5e5e5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-image: url('IMG_4928.jpeg'); 
            background-size: cover;
            background-position: center;
        }

        .register-card {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #444;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        h1 { color: #facc15; font-size: 2.5rem; margin-bottom: 5px; letter-spacing: 2px; }
        p { color: #666; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { color: #888; font-size: 1.1rem; }

        input {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #facc15; background: #000; }

        button {
            width: 100%;
            background: #facc15;
            color: #000;
            border: none;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover { background: #fff; }

        .error-msg {
            color: #ef4444;
            border: 1px solid #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .login-link {
            margin-top: 20px;
            display: block;
            color: #666;
            text-decoration: none;
            font-size: 1.1rem;
        }
        .login-link:hover { color: #facc15; }
    </style>
</head>
<body>

    <div class="register-card">
        <h1>register.</h1>
        <p>start</p>

        <div id="error-display" class="error-msg"></div>

        <div class="input-group">
            <label>username</label>
            <input type="text" id="reg-username" placeholder="Enter alias..." autocomplete="off">
        </div>

        <div class="input-group">
            <label>password</label>
            <input type="password" id="reg-password" placeholder="Set password...">
        </div>

        <div class="input-group">
            <label>confirm</label>
            <input type="password" id="reg-confirm" placeholder="Repeat password...">
        </div>

        <button onclick="handleRegister()">continue</button>

        <a href="login.html" class="login-link">return to login >></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.handleRegister = async () => {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const errorBox = document.getElementById('error-display');

            const showError = (msg) => {
                errorBox.innerText = "error. " + msg;
                errorBox.style.display = 'block';
            };

            // 1. Local Validation
            if (!username || !password) return showError("whats ur name?");
            if (password !== confirm) return showError("confirm it");
            if (username.length < 3) return showError("its only 3 dude");
            
            // 2. Character Safety (Firebase doesn't like paths with . # $ [ ] )
            const invalidChars = /[.#$/\[\]]/;
            if (invalidChars.test(username)) return showError("invalid characters.");

            try {
                // 3. DATABASE CHECK: Does this name exist?
                const userRef = ref(db, 'users/' + username);
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    // CRITICAL: Prevent overwrite
                    showError("taken.");
                    return;
                }

                // 4. Create User
                await set(userRef, {
                    username: username,
                    password: password, 
                    joined: Date.now(),
                    bio: "new user.",
                    color: "#facc15",
                    pfp: "" 
                });

                // 5. Success
                localStorage.setItem('username', username);
                window.location.href = 'index.html';

            } catch (err) {
                console.error(err);
                showError("error.");
            }
        };
    </script>
</body>
</html>
