<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        /* --- EXACT VISUAL STYLE FROM INDEX --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000;
            color: #ccc;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #fff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* --- LAYOUT CONTAINER --- */
        .container {
            width: 900px;
            margin: 0 auto;
            padding-top: 20px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- HEADER --- */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .top-links span { margin: 0 5px; color: #444; }
        .brand-logo {
            font-family: "Times New Roman", serif;
            font-size: 24px;
            color: #fff;
            letter-spacing: 2px;
        }

        /* --- CHAT INTERFACE LAYOUT --- */
        .chat-wrapper {
            display: flex;
            flex: 1; /* Fills remaining height */
            gap: 10px;
            min-height: 0; /* Firefox flex fix */
        }

        /* Main Chat Window */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            background-color: #111;
        }

        .chat-header-bar {
            background-color: #666;
            color: #fff;
            padding: 3px 5px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
            background-color: #000;
        }

        /* Message Styles */
        .message { margin-bottom: 6px; line-height: 1.5; }
        .msg-time { color: #555; font-size: 10px; margin-right: 5px; }
        .msg-user { color: #fff; font-weight: bold; margin-right: 2px; }
        .msg-text { color: #ccc; }
        .msg-system { color: #facc15; font-style: italic; }

        /* Sidebar (User List) */
        .chat-sidebar {
            width: 180px;
            border: 1px solid #333;
            background-color: #111;
            display: flex;
            flex-direction: column;
        }
        
        .user-list {
            list-style: none;
            padding: 5px;
            overflow-y: auto;
        }
        .user-list li {
            padding: 2px 0;
            color: #888;
            display: flex;
            align-items: center;
        }
        /* GREENDOT VISUALS */
        .user-list li::before {
            content: ""; display: inline-block; width: 6px; height: 6px;
            background-color: #444; margin-right: 6px; border-radius: 50%;
        }
        .user-list li.online::before { background-color: #fff; box-shadow: 0 0 4px #fff; }
        .user-list li span { color: #bbb; }

        /* Input Area */
        .chat-input-area {
            margin-top: 10px;
            background-color: #222;
            padding: 5px;
            border: 1px solid #333;
            display: flex;
            gap: 5px;
        }
        
        .chat-input {
            flex: 1;
            background-color: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
        .chat-input:focus { outline: 1px solid #666; }

        .send-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 0 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .send-btn:hover { background-color: #666; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="top-header">
            <div class="brand-logo"></div>
            <div class="top-links">
                <a href="index.html">Index</a> <span>|</span>
                <a href="list.html">List</a> <span>|</span> 
                <a href="settings.html">Settings</a>
            </div>
        </div>

        <div class="chat-wrapper">
            
            <main class="chat-main">
                <div class="chat-header-bar">
                    <span>#general</span>
                    <span id="user-count">Users: 0</span>
                </div>
                
                <div class="chat-log" id="chat-log">
                    <div class="message"><span class="msg-time">[SYSTEM]</span> <span class="msg-system">Connecting to database...</span></div>
                </div>

                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button class="send-btn" id="send-btn">SEND</button>
                </div>
            </main>

            <aside class="chat-sidebar">
                <div class="chat-header-bar">Users</div>
                <ul class="user-list" id="user-list">
                    </ul>
            </aside>

        </div>

        <div style="text-align: center; color: #444; font-size: 10px; margin-top: 10px;">
            Connection Established. 
        </div>

    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
    apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
    authDomain: "ewsitechat.firebaseapp.com",
    databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
    projectId: "ewsitechat",
    storageBucket: "ewsitechat.firebasestorage.app",
    messagingSenderId: "282495574514",
    appId: "1:282495574514:web:e2781da630d93fc1ce8b6b",
    measurementId: "G-GTN3TL1P2K"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        // --- 2. DOM ELEMENTS ---
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatLog = document.getElementById('chat-log');
        const userListEl = document.getElementById('user-list');
        const userCountEl = document.getElementById('user-count');

        // --- 3. AUTH & USERNAME ---
        let myUsername = localStorage.getItem('username') || "Guest_" + Math.floor(Math.random() * 9999);
        let myUid = null;

        auth.signInAnonymously().catch((error) => {
            console.error("Auth Error:", error);
            addLogMessage("System", "Authentication failed.", false);
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                myUid = user.uid;
                initPresence(); // Start Green Dot Logic
                initChat();     // Start Chat Logic
                
                // Clear the "Connecting..." placeholder
                chatLog.innerHTML = '';
                addLogMessage("System", "Welcome to the server.", false, true);
            }
        });

        // --- 4. GREENDOT.JS LOGIC (Presence) ---
        function initPresence() {
            const userStatusDatabaseRef = db.ref('/status/' + myUid);
            const isOfflineForDatabase = {
                state: 'offline',
                last_changed: firebase.database.ServerValue.TIMESTAMP,
                username: myUsername
            };
            const isOnlineForDatabase = {
                state: 'online',
                last_changed: firebase.database.ServerValue.TIMESTAMP,
                username: myUsername
            };

            // Manage connection state
            db.ref('.info/connected').on('value', (snapshot) => {
                if (snapshot.val() === false) return;

                userStatusDatabaseRef.onDisconnect().set(isOfflineForDatabase).then(() => {
                    userStatusDatabaseRef.set(isOnlineForDatabase);
                });
            });

            // Listen for other users online
            db.ref('/status').on('value', (snapshot) => {
                userListEl.innerHTML = ''; // Clear list to rebuild
                let onlineCount = 0;
                
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    if (data.state === 'online') {
                        onlineCount++;
                        const li = document.createElement('li');
                        li.className = 'online'; // Adds the glowing dot CSS
                        
                        const span = document.createElement('span');
                        span.textContent = data.username || "Anonymous";
                        
                        // Highlight yourself
                        if (data.username === myUsername) {
                            span.textContent += " (You)";
                            span.style.color = "#fff";
                        }

                        li.appendChild(span);
                        userListEl.appendChild(li);
                    }
                });
                userCountEl.textContent = `Users: ${onlineCount}`;
            });
        }

        // --- 5. CHAT.JS LOGIC (Messages & 48h Cleanup) ---
        function initChat() {
            const messagesRef = db.ref('messages');
            
            // Limit to last 100 messages to prevent browser lag, but filter strictly by time below
            messagesRef.limitToLast(100).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // --- 48 HOUR LOGIC ---
                // 48 hours in milliseconds = 48 * 60 * 60 * 1000 = 172,800,000
                const messageAge = Date.now() - data.timestamp;
                const fortyEightHours = 172800000;

                if (messageAge > fortyEightHours) {
                    // Message is too old. 
                    // Optional: Clean it up from DB so it doesn't load next time
                    // snapshot.ref.remove(); 
                    return; // Do NOT display it
                }

                // Display message
                const isMe = (data.username === myUsername);
                addLogMessage(data.username, data.text, isMe, false, data.timestamp);
            });
        }

        // --- 6. SENDING MESSAGES ---
        function sendMessage() {
            const text = input.value.trim();
            if (text === "") return;

            const messagesRef = db.ref('messages');
            const newMessageRef = messagesRef.push();
            
            newMessageRef.set({
                username: myUsername,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
        }

        // --- 7. UI HELPERS ---
        function addLogMessage(user, text, isMe, isSystem = false, timestamp = Date.now()) {
            const div = document.createElement('div');
            div.className = 'message';
            
            // Convert timestamp to time string
            const dateObj = new Date(timestamp);
            const timeStr = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            const userClass = isMe ? "msg-user" : (isSystem ? "msg-system" : "msg-user");
            
            // Apply different color if it's not you and not system
            let userStyle = "";
            if (!isMe && !isSystem) {
                userStyle = "color: #888;"; // Grey for others
            }

            // HTML Structure matches your CSS
            if (isSystem) {
                div.innerHTML = `<span class="msg-time">[${timeStr}]</span> <span class="msg-system">${text}</span>`;
            } else {
                div.innerHTML = `<span class="msg-time">[${timeStr}]</span> <span class="${userClass}" style="${userStyle}">${user}:</span> <span class="msg-text">${text}</span>`;
            }
            
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight; // Auto-scroll
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        input.focus();

    </script>
</body>
</html>
