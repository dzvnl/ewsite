<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <style>
        /* --- EXACT VISUAL STYLE FROM INDEX --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000;
            color: #ccc;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            line-height: 1.4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #fff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* --- LAYOUT CONTAINER --- */
        .container {
            width: 900px;
            margin: 0 auto;
            padding-top: 20px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- HEADER --- */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .top-links span { margin: 0 5px; color: #444; }
        .brand-logo {
            font-family: "Times New Roman", serif;
            font-size: 24px;
            color: #fff;
            letter-spacing: 2px;
        }

        /* --- CHAT INTERFACE LAYOUT --- */
        .chat-wrapper {
            display: flex;
            flex: 1; /* Fills remaining height */
            gap: 10px;
            min-height: 0; /* Firefox flex fix */
        }

        /* Main Chat Window */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            background-color: #111;
        }

        .chat-header-bar {
            background-color: #666;
            color: #fff;
            padding: 3px 5px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
            background-color: #000;
        }

        /* Message Styles */
        .message { margin-bottom: 6px; line-height: 1.5; }
        .msg-time { color: #555; font-size: 10px; margin-right: 5px; }
        .msg-user { color: #fff; font-weight: bold; margin-right: 2px; }
        .msg-text { color: #ccc; }
        .msg-system { color: #facc15; font-style: italic; }

        /* Sidebar (User List) */
        .chat-sidebar {
            width: 180px;
            border: 1px solid #333;
            background-color: #111;
            display: flex;
            flex-direction: column;
        }
        
        .user-list {
            list-style: none;
            padding: 5px;
            overflow-y: auto;
        }
        .user-list li {
            padding: 2px 0;
            color: #888;
            display: flex;
            align-items: center;
        }
        .user-list li::before {
            content: ""; display: inline-block; width: 6px; height: 6px;
            background-color: #444; margin-right: 6px; border-radius: 50%;
        }
        .user-list li.online::before { background-color: #fff; box-shadow: 0 0 4px #fff; }
        .user-list li span { color: #bbb; }

        /* Input Area */
        .chat-input-area {
            margin-top: 10px;
            background-color: #222;
            padding: 5px;
            border: 1px solid #333;
            display: flex;
            gap: 5px;
        }
        
        .chat-input {
            flex: 1;
            background-color: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
        .chat-input:focus { outline: 1px solid #666; }

        .send-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid #555;
            padding: 0 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .send-btn:hover { background-color: #666; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="top-header">
            <div class="brand-logo">CHAT_NET</div>
            <div class="top-links">
                <a href="index.html">Index</a> <span>|</span>
                <a href="list.html">List</a> <span>|</span> 
                <a href="settings.html">Settings</a>
            </div>
        </div>

        <div class="chat-wrapper">
            
            <main class="chat-main">
                <div class="chat-header-bar">
                    <span>#general</span>
                    <span id="user-count">Users: 4</span>
                </div>
                
                <div class="chat-log" id="chat-log">
                </div>

                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button class="send-btn" id="send-btn">SEND</button>
                </div>
            </main>

            <aside class="chat-sidebar">
                <div class="chat-header-bar">Users</div>
                <ul class="user-list">

                </ul>
            </aside>

        </div>

        <div style="text-align: center; color: #444; font-size: 10px; margin-top: 10px;">
            Connection Established. 
        </div>

    </div>

    <script>
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatLog = document.getElementById('chat-log');

        function addMessage(text, isUser = true) {
            const div = document.createElement('div');
            div.className = 'message';
            
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const user = isUser ? "You" : "System";
            const userClass = isUser ? "msg-user" : "msg-system";

            div.innerHTML = `<span class="msg-time">[${time}]</span> <span class="${userClass}">${user}:</span> <span class="msg-text">${text}</span>`;
            
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight; 
        }

        function handleSend() {
            const text = input.value.trim();
            if (text) {
                addMessage(text, true);
                input.value = '';
            }
        }

        sendBtn.addEventListener('click', handleSend);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
        
        input.focus();
    </script>
</body>
</html>
