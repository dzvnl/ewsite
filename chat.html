<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Special Elite', monospace; 
            background: url('IMG_4928.jpeg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        #chat-container {
            width: 800%;
            max-width: 800px;
            height: 85vh;
            background: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #969696;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            resize: both;        
            overflow: hidden;    
            min-width: 300px;    
            min-height: 400px;   
            max-height: 95vh;    
            max-width: 95vw;     
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            color: #e5e5e5;
            font-size: 1.1rem;
            line-height: 1.2;
            text-shadow: 1px 1px 2px black; 
            display: flex;             
            flex-direction: column;  
            gap: 12px;                
        }

        /* --- Message & Avatar Styles --- */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;        
            object-fit: cover;        
            border: 2px solid #facc15; 
            flex-shrink: 0;            
            background: #000;         
        }
        
        /* Added Founder Style from Users.html */
        .msg-avatar.founder {
            border-color: #c084fc;
            box-shadow: 0 0 8px rgba(192, 132, 252, 0.5);
        }

        .message-content {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .msg-username {
            color: #facc15;
            font-size: 0.8rem;
            margin-bottom: 2px;
            opacity: 0.8;
        }
        .msg-username.founder {
            color: #c084fc;
        }

        .msg-text {
            word-wrap: break-word;
        }
        
        /* Ban Screen Style */
        #ban-screen {
            display: none;
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; color: #ef4444;
            z-index: 9999;
            flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 3rem; text-align: center;
        }
        /* ------------------------------------ */

        #chat-input-area {
            border-top: 1px dotted #999;
            padding: 10px;
            display: flex;
            gap: 8px;
            background: transparent; 
            align-items: center; 
            flex-shrink: 0; 
        }

        input[type="text"] {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            color: #facc15; 
            padding: 6px 10px;
            outline: none;
            font-size: 1rem;
            font-family: 'Special Elite', monospace; 
        }

        button {
            font-family: 'Special Elite', monospace; 
            background: none;
            border: 1px solid #facc15;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover {
            background: rgba(250, 204, 21, 0.2);
        }

        .upload-icon {
            width: 20px;
            height: 20px;
            fill: #facc15;
            filter: drop-shadow(1px 1px 1px black);
        }

        .online-indicator {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4ade80;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .dot { width: 9px; height: 9px; background: #4ade80; border-radius: 100%; box-shadow: 0 0 5px #4ade80; }
        
        .user-menu { position: absolute; top: 8px; right: 12px; z-index: 50; }
        #user-display { background: none; border: none; cursor: pointer; padding: 4px; }
        .person-icon { width: 24px; height: 24px; fill: #facc15; filter: drop-shadow(1px 1px 2px black); }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #969696;
            min-width: 130px;
            z-index: 100;
        }
        .dropdown a {
            display: block;
            padding: 10px;
            color: #969696;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px solid #333;
        }
        .dropdown a:last-child { border-bottom: none; }
        .dropdown a:hover { background: #333; color: #facc15; }
        .show { display: block; }
    </style>
</head>
<body>

    <div id="ban-screen">
        <div>ACCESS DENIED</div>
        <div style="font-size: 1.5rem; color: #fff; margin-top:20px;">You have been banned from this server.</div>
    </div>

    <div id="chat-container">
        <div class="online-indicator">
            <div class="dot"></div>
            <span id="user-count">0</span>
        </div>

        <div class="user-menu">
            <button id="user-display" onclick="toggleMenu()">
                <svg class="person-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </button>
            <div id="user-dropdown" class="dropdown">
                <a href="folk" id="display-name" style="color:#fff; pointer-events:none;"></a>
                <a href="settings.html">settings</a>
                <a href="users.html">users</a>
                <a href="#" onclick="logout()">logout</a>
            </div>
        </div>

        <div id="chat-messages"></div>

        <div id="chat-input-area">
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            
            <input type="text" id="msg-input" placeholder="Type..." autocomplete="off">
            
            <button onclick="document.getElementById('image-upload').click()" title="Upload Image" style="padding: 5px 10px;">
                <svg class="upload-icon" viewBox="0 0 24 24">
                    <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                </svg>
            </button>

            <button id="send-btn" style="color: #facc15; padding: 6px 15px;">[SEND]</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, get, query, orderByChild, equalTo, update, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        // --- CONFIG FROM USERS.HTML ---
        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // --- GLOBAL VARIABLES ---
        let myIdentity = null;
        let myUid = null;
        let myPfp = 'https://placehold.co/40x40/000/fff?text=U';
        
        // ADMIN/BAN LIST
        const FOUNDERS = ['root', '-nl', 'futtbucker67'];
        
        // DOM ELEMENTS
        const messagesDiv = document.getElementById('chat-messages');
        const inputField = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const displayNameLink = document.getElementById('display-name');
        const banScreen = document.getElementById('ban-screen');

        // --- 1. AUTH & BAN CHECK ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                myUid = user.uid;
                
                // Real-time listener for BAN status
                // If an admin bans you while you are chatting, this triggers immediately.
                const myUserRef = ref(db, 'users/' + myUid);
                onValue(myUserRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        // Check Ban
                        if (data.banned === true) {
                            showBanScreen();
                            return;
                        }
                        
                        // Set Identity
                        myIdentity = data.username || "Guest";
                        myPfp = data.pfp || myPfp;
                        displayNameLink.textContent = myIdentity;

                        // Check if I am Founder (for UI adjustments)
                        if(FOUNDERS.includes(myIdentity)) {
                           inputField.placeholder = "Type... (Admin Access)";
                        }
                    } else {
                        // Fallback if DB entry missing
                        myIdentity = user.email ? user.email.split('@')[0] : "Anon";
                        displayNameLink.textContent = myIdentity;
                    }
                });

                // Load Messages only if logged in
                loadMessages();

            } else {
                window.location.href = 'index.html';
            }
        });

        function showBanScreen() {
            banScreen.style.display = 'flex';
            document.getElementById('chat-container').style.display = 'none';
            signOut(auth); // Log them out
        }

        // --- 2. SEND MESSAGE & ADMIN COMMANDS ---
        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // --- BAN COMMAND (Admins Only) ---
            // Usage: /ban [username]
            if (text.startsWith('/ban ')) {
                if (FOUNDERS.includes(myIdentity)) {
                    const targetName = text.substring(5).trim();
                    banUser(targetName);
                    inputField.value = '';
                    return;
                } else {
                    alert("You do not have permission to ban users.");
                    inputField.value = '';
                    return;
                }
            }

            // Normal Message Send
            const messagesRef = ref(db, 'messages');
            await push(messagesRef, {
                username: myIdentity,
                text: text,
                pfp: myPfp,
                timestamp: Date.now()
            });
            inputField.value = '';
        }

        // Admin Function to Find & Ban User
        async function banUser(targetUsername) {
            const usersRef = ref(db, 'users');
            try {
                // We have to search for the UID associated with the username
                const snapshot = await get(usersRef);
                if (snapshot.exists()) {
                    const users = snapshot.val();
                    let targetUid = null;
                    
                    // Iterate to find matching username
                    for (const [key, user] of Object.entries(users)) {
                        if (user.username === targetUsername) {
                            targetUid = user.uid; // Assuming UID is stored, or key is UID
                            if(!targetUid) targetUid = key; // Fallback if key is UID
                            break;
                        }
                    }

                    if (targetUid) {
                        // Determine if key was username or uid structure. 
                        // Based on standard firebase, usually 'users/UID'.
                        // Let's try to update the exact path found.
                        
                        await update(ref(db, `users/${targetUid}`), { banned: true });
                        
                        // Send system message
                        push(ref(db, 'messages'), {
                            username: "SYSTEM",
                            text: `USER [${targetUsername}] HAS BEEN BANNED.`,
                            timestamp: Date.now(),
                            isSystem: true
                        });
                        alert(`User ${targetUsername} banned successfully.`);
                    } else {
                        alert("User not found.");
                    }
                }
            } catch (error) {
                console.error("Ban failed:", error);
                alert("Error executing ban.");
            }
        }

        // --- 3. DISPLAY MESSAGES ---
        function loadMessages() {
            const messagesRef = ref(db, 'messages');
            onChildAdded(messagesRef, (snapshot) => {
                const msg = snapshot.val();
                renderMessage(msg);
            });
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message-row';

            // Check if sender is founder for styling
            const isFounder = FOUNDERS.includes(msg.username);
            const founderClass = isFounder ? 'founder' : '';
            
            // System message styling
            if (msg.isSystem) {
                div.innerHTML = `
                    <div style="color: #ef4444; width:100%; text-align:center; border-top:1px dashed #333; border-bottom:1px dashed #333; padding:5px;">
                        ${msg.text}
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <img src="${msg.pfp || 'https://placehold.co/40x40'}" class="msg-avatar ${founderClass}">
                    <div class="message-content">
                        <span class="msg-username ${founderClass}">${msg.username}</span>
                        <span class="msg-text">${escapeHtml(msg.text)}</span>
                    </div>
                `;
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // --- 4. IMAGE UPLOAD LOGIC ---
        window.sendImage = function(base64Data) {
             const messagesRef = ref(db, 'messages');
             push(messagesRef, {
                username: myIdentity,
                text: `<img src="${base64Data}" style="max-width: 200px; border: 1px solid #666; border-radius: 4px;">`, // Simple embedding
                pfp: myPfp,
                timestamp: Date.now()
            });
        };

        // --- LISTENERS ---
        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Logout Global
        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>
    
    <script>
        // UI Helpers
        function toggleMenu() { document.getElementById("user-dropdown").classList.toggle("show"); }
        window.onclick = function(event) { if (!event.target.closest('#user-display')) { document.getElementById("user-dropdown").classList.remove('show'); } }
        
        const fileInput = document.getElementById('image-upload');
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (window.sendImage) window.sendImage(e.target.result);
                };
                reader.readAsDataURL(file);
                this.value = '';
            }
        });
    </script>
</body>
</html>
