<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        /* --- OPTIMIZED CSS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background:#000; color:#ccc; font-family:Arial, sans-serif; font-size:11px; line-height:1.4; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        a { color:#fff; text-decoration:none; } a:hover { text-decoration:underline; }
        
        .container { width:900px; margin:0 auto; padding:20px 0; display:flex; flex-direction:column; height:100%; }
        .top-header { display:flex; justify-content:flex-end; align-items:center; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #333; height:40px; }
        .top-links span { margin:0 5px; color:#444; }

        .chat-wrapper { display:flex; flex:1; gap:10px; min-height:0; }
        .chat-main { flex:1; display:flex; flex-direction:column; border:1px solid #333; background:#111; }
        .chat-sidebar { width:180px; border:1px solid #333; background:#111; display:flex; flex-direction:column; }
        
        .chat-header-bar { background:#666; color:#fff; padding:3px 5px; font-size:12px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
        .filler-pattern { letter-spacing:2px; color:#ccc; font-family:monospace; }
        
        .chat-log { flex:1; overflow-y:auto; padding:10px; background:#000; scroll-behavior: smooth; }
        .message { margin-bottom:8px; position:relative; word-wrap:break-word; }
        .message:hover .delete-btn { display:inline; } 
        
        .msg-time { color:#555; font-size:10px; margin-right:5px; }
        .msg-user { color:#fff; font-weight:bold; margin-right:2px; }
        .msg-text { color:#ccc; }
        .msg-system { color:#facc15; font-style:italic; }
        .msg-alert { color:#f00; font-weight:bold; }
        .msg-notification { color:#0ff; font-weight:bold; border:1px dashed #0ff; padding:2px 5px; display:inline-block; margin-top:5px; cursor:pointer;}
        .delete-btn { display:none; color:#f00; cursor:pointer; font-size:10px; margin-right:5px; font-weight:bold; }
        .chat-media { display:block; max-width:300px; max-height:200px; margin-top:5px; border:1px solid #333; }

        /* Sidebar & Search */
        .sidebar-search { padding:5px; background:#000; border-bottom:1px solid #333; }
        .search-input { width:100%; background:#222; border:1px solid #444; color:#fff; padding:3px 5px; font-size:10px; }
        .search-input:focus { outline:none; border-color:#666; }
        .user-list { list-style:none; padding:5px; overflow-y:auto; flex:1; }
        .user-list li { padding:2px 0; color:#888; display:flex; align-items:center; }
        
        /* Dots */
        .user-list li::before { content:""; display:inline-block; width:8px; height:8px; background:#444; margin-right:8px; border-radius:50%; transition:background .3s; }
        .user-list li.online::before { background:#2ecc71; box-shadow:0 0 6px #2ecc71; }
        
        .user-link { color:#bbb; cursor:pointer; } .user-link:hover { color:#fff; text-decoration:underline; }
        .user-link.is-me { color:#fff; font-weight:bold; pointer-events:none; }

        /* Player & Inputs */
        .mini-player { border-top:1px solid #333; background:#000; padding:8px; text-align:center; }
        .player-cover-art { width:100%; aspect-ratio:1/1; object-fit:cover; border:1px solid #444; margin-bottom:8px; background:#111; display:block; }
        .mini-track-info { font-size:10px; color:#fff; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mini-controls { display:flex; justify-content:center; gap:5px; }
        .mini-btn { background:#333; border:1px solid #444; color:#fff; width:20px; height:18px; font-size:9px; cursor:pointer; }
        .mini-btn:hover { background:#555; }

        .chat-input-area { margin-top:10px; background:#222; padding:5px; border:1px solid #333; display:flex; gap:5px; align-items:center; }
        .chat-input { flex:1; background:#000; border:1px solid #444; color:#fff; padding:5px; font-size:12px; }
        .chat-input:focus { outline:1px solid #666; }
        .chat-input:disabled { background:#220000; cursor:not-allowed; }
        .action-btn, .send-btn { background:#333; color:#fff; border:1px solid #444; height:26px; font-weight:bold; cursor:pointer; }
        .action-btn:hover, .send-btn:hover { background:#555; }
        .send-btn { background:#444; padding:0 15px; font-size:11px; }

        ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-track { background:#111; } ::-webkit-scrollbar-thumb { background:#333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-header">
            <div class="top-links"><a href="index.html">home</a> <span>|</span> <a href="list.html">list</a> <span>|</span> <a href="settings.html">settings</a></div>
        </div>
        <div class="chat-wrapper">
            <main class="chat-main">
                <div class="chat-header-bar"><span class="filler-pattern">[>::<] [>::<] [>::<]</span><span id="user-count">Online: 0</span></div>
                <div class="chat-log" id="chat-log"><div class="message"><span class="msg-time">[SYSTEM]</span> <span class="msg-system">connecting...</span></div></div>
                <div class="chat-input-area">
                    <input type="file" id="media-input" accept="image/*,video/*" style="display: none;">
                    <button class="action-btn" id="upload-trigger" title="Upload">[+]</button>
                    <input type="text" class="chat-input" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button class="send-btn" id="send-btn">SEND</button>
                </div>
            </main>
            <aside class="chat-sidebar">
                <div class="chat-header-bar">Users</div>
                <div class="sidebar-search"><input type="text" id="user-search" class="search-input" placeholder="Search..."></div>
                <ul class="user-list" id="user-list"></ul>
                <div class="mini-player">
                    <img id="player-cover-art" class="player-cover-art" src="" alt="cover">
                    <div id="mini-track-info" class="mini-track-info">stopped</div>
                    <div class="mini-controls"><button id="mini-prev" class="mini-btn">&lt;</button><button id="mini-play" class="mini-btn">&gt;</button><button id="mini-next" class="mini-btn">&gt;&gt;</button></div>
                </div>
            </aside>
        </div>
        <div style="text-align:center;color:#444;font-size:10px;margin-top:10px;">Connection Established.</div>
    </div>
    <audio id="audio-player"></audio>

    <script>
        // --- CONFIG & UTILS ---
        const firebaseConfig={apiKey:"AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",authDomain:"ewsitechat.firebaseapp.com",databaseURL:"https://ewsitechat-default-rtdb.firebaseio.com",projectId:"ewsitechat",storageBucket:"ewsitechat.firebasestorage.app",messagingSenderId:"282495574514",appId:"1:282495574514:web:e2781da630d93fc1ce8b6b",measurementId:"G-GTN3TL1P2K"};
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db=firebase.database(), auth=firebase.auth(), ADMINS=["root","futtbucker67"];
        
        // Short selector helper
        const $ = (id) => document.getElementById(id);
        const els = { input: $('message-input'), send: $('send-btn'), log: $('chat-log'), list: $('user-list'), count: $('user-count'), media: $('media-input'), upBtn: $('upload-trigger'), search: $('user-search') };
        
        let myName = localStorage.getItem('username'), myUid = null;
        let allUsers = {}; // Holds full user list from 'users' node
        let onlineStatus = {}; // Holds connectivity from 'status' node

        // Force Username
        while(!myName || !myName.trim()) {
            myName = prompt("Enter a username to join:");
            if(myName && myName.trim()) localStorage.setItem('username', myName);
        }

        // --- AUTH & INIT ---
        auth.signInAnonymously().catch(e => console.error(e));
        auth.onAuthStateChanged(u => {
            if(u) {
                myUid = u.uid;
                // Register into permanent 'users' node
                db.ref('users/' + myUid).update({ username: myName });
                
                initPresence(); initChat(); initMods(); initNotifs();
                els.log.innerHTML = '';
                addMsg("System", "welcome " + myName, false, true);
            }
        });

        // --- PRESENCE & USER LIST SYSTEM ---
        function initPresence() {
            // 1. Manage my online status
            const ref = db.ref('/status/' + myUid);
            const online = { state:'online', last_changed: firebase.database.ServerValue.TIMESTAMP, username: myName };
            const offline = { state:'offline', last_changed: firebase.database.ServerValue.TIMESTAMP, username: myName };
            db.ref('.info/connected').on('value', s => {
                if(s.val()) ref.onDisconnect().set(offline).then(() => ref.set(online));
            });

            // 2. Fetch all users (Permanent Directory)
            db.ref('users').on('value', s => {
                allUsers = s.val() || {};
                updateUserList();
            });

            // 3. Fetch online status (Realtime Connectivity)
            db.ref('status').on('value', s => {
                onlineStatus = s.val() || {};
                updateUserList();
            });
        }

        function updateUserList() {
            const term = els.search.value.toLowerCase();
            const frag = document.createDocumentFragment();
            let onlineCount = 0;
            let displayList = [];

            // Merge 'users' and 'status' data
            Object.keys(allUsers).forEach(uid => {
                const uData = allUsers[uid];
                if(!uData.username || uData.username.startsWith("Guest_")) return;

                // Check online status
                const isOnline = (onlineStatus[uid] && onlineStatus[uid].state === 'online');
                if(isOnline) onlineCount++;

                displayList.push({ uid, username: uData.username, isOnline });
            });

            // Sort: Online first, then alphabetical
            displayList.sort((a,b) => (a.isOnline === b.isOnline) ? a.username.localeCompare(b.username) : (a.isOnline?-1:1));
            
            // Render
            displayList.forEach(u => {
                if(term && !u.username.toLowerCase().includes(term)) return;
                
                const li = document.createElement('li');
                li.className = u.isOnline ? 'online' : 'offline';
                
                const a = document.createElement('a');
                a.textContent = u.username;
                a.className = "user-link" + (u.username === myName ? " is-me" : "");
                a.href = (u.username === myName) ? "#" : `profile.html?user=${u.username}`;
                
                li.appendChild(a);
                frag.appendChild(li);
            });

            els.list.innerHTML = '';
            els.list.appendChild(frag);
            els.count.textContent = `Online: ${onlineCount}`;
        }

        els.search.addEventListener('input', updateUserList);

        // --- CHAT LOGIC ---
        function initChat() {
            db.ref('messages').limitToLast(100).on('child_added', s => {
                const d = s.val();
                if(d && d.timestamp) addMsg(d.username, d.text, d.username===myName, false, d.timestamp, s.key, d.mediaType, d.mediaData);
            });
            db.ref('messages').on('child_removed', s => {
                const el = document.getElementById(`msg-${s.key}`);
                if(el) el.remove();
            });
        }

        function sendMsg() {
            const txt = els.input.value.trim();
            if(!txt) return;
            if(txt.startsWith('/') && ADMINS.includes(myName)) { handleCmd(txt); els.input.value=''; return; }
            db.ref('messages').push({ username: myName, text: txt, timestamp: firebase.database.ServerValue.TIMESTAMP });
            els.input.value = '';
        }

        // --- MEDIA & HELPERS ---
        els.upBtn.onclick = () => els.media.click();
        els.media.onchange = (e) => {
            const f = e.target.files[0];
            if(!f || f.size > 2097152) return alert("Max 2MB");
            const r = new FileReader();
            r.onload = (ev) => db.ref('messages').push({ username:myName, text:"", mediaType:(f.type.startsWith('image')?'image':'video'), mediaData:ev.target.result, timestamp:firebase.database.ServerValue.TIMESTAMP });
            r.readAsDataURL(f); els.media.value="";
        };

        function addMsg(user, text, isMe, isSys, time=Date.now(), id=null, mType=null, mData=null) {
            const div = document.createElement('div'); div.className='message'; if(id) div.id=`msg-${id}`;
            const ts = new Date(time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            
            if(text && text.startsWith('***')) {
                div.innerHTML = `<span class="msg-time">[${ts}]</span> <span class="msg-alert">${text}</span>`;
            } else if(isSys) {
                div.innerHTML = `<span class="msg-time">[${ts}]</span> <span class="msg-system">${text}</span>`;
            } else {
                let content = text ? `<span class="msg-text">${text}</span>` : "";
                if(mType && mData) content += (mType==='image' ? `<img src="${mData}" class="chat-media">` : `<video src="${mData}" class="chat-media" controls></video>`);
                const del = (ADMINS.includes(myName) && id) ? `<span class="delete-btn" onclick="delMsg('${id}')">[x]</span>` : "";
                const style = (!isMe) ? "color:#888;" : "";
                div.innerHTML = `${del}<span class="msg-time">[${ts}]</span> <span class="msg-user" style="${style}">${user}:</span> ${content}`;
            }
            els.log.appendChild(div); els.log.scrollTop = els.log.scrollHeight;
        }

        // --- MODS & NOTIFS ---
        function handleCmd(str) {
            const [c, dur, tgt] = str.split(' ');
            if(!tgt) return;
            const tid = Object.keys(allUsers).find(k => allUsers[k].username===tgt);
            if(!tid) return addMsg("System", "User not found", false, true);
            
            let ms = 30000;
            if(dur==='inf') ms=3153600000000;
            else if(dur.endsWith('s')) ms=parseInt(dur)*1000;
            else if(dur.endsWith('m')) ms=parseInt(dur)*60000;
            else if(dur.endsWith('h')) ms=parseInt(dur)*3600000;

            const type = (c==='/ban') ? 'ban' : 'mute';
            db.ref('moderation/'+tid).set({ type, until: Date.now()+ms, reason:"Admin" });
            db.ref('messages').push({ username:"System", text:`*** ${tgt} was ${type==='ban'?'banned':'muted'} for ${dur} ***`, timestamp:firebase.database.ServerValue.TIMESTAMP });
        }

        function initMods() {
            db.ref('moderation/'+myUid).on('value', s => {
                const d = s.val();
                if(d && d.until > Date.now()) {
                    els.input.disabled = els.upBtn.disabled = true;
                    els.input.placeholder = `You are ${d.type}ed until ${new Date(d.until).toLocaleTimeString()}`;
                } else {
                    els.input.disabled = els.upBtn.disabled = false;
                    els.input.placeholder = "Type a message...";
                }
            });
        }

        function initNotifs() {
            db.ref('notifications/'+myName).on('child_added', s => {
                const n = s.val();
                if(n) {
                    const d = document.createElement('div'); d.className='message';
                    d.innerHTML = `<span class="msg-time">[ALERT]</span> <span class="msg-notification">New PM from ${n.from}</span>`;
                    d.onclick = () => { if(confirm("Go to PMs?")) window.location.href=`pm.html?with=${n.from}`; };
                    els.log.appendChild(d); els.log.scrollTop = els.log.scrollHeight;
                    db.ref(`notifications/${myName}/${s.key}`).remove();
                }
            });
        }
        window.delMsg = (id) => { if(confirm("Delete?")) db.ref('messages/'+id).remove(); };
        els.send.onclick = sendMsg;
        els.input.onkeypress = (e) => { if(e.key==='Enter') sendMsg(); };

        // --- MUSIC PLAYER ---
        const B = "https://ewsmusic1.netlify.app/";
        const pl = [
            {t:"Xtal",a:"Aphex Twin",s:"xtal.mp3",c:"aphex.jpg"}, {t:"I Don't Wanna Be Me",a:"Type O Negative",s:"idontwannabeme.mp3",c:"ton.jpg"},
            {t:"Life Is Killing Me",a:"Type O Negative",s:"lifeiskilling.mp3",c:"ton.jpg"}, {t:"Exit Music",a:"Radiohead",s:"exitmusic.mp3",c:"radiohead.jpg"},
            {t:"Alternative Outro",a:"LUCKI",s:"alternativeoutro.mp3",c:"lucki.jpg"}, {t:"Bite My Lip",a:"fakemink",s:"bitemylip.mp3",c:"fakemink.jpg"},
            {t:"Ambilux",a:"fakemink",s:"ambilux.mp3",c:"fakemink3.jpg"}, {t:"I'm Like Why",a:"xaviersobased",s:"imlikewhy.mp3",c:"xav.jpg"},
            {t:"Love Hate",a:"xaviersobased",s:"lovehate.mp3",c:"xav2.jpg"}, {t:"Foamposite",a:"smokedope2016",s:"foamposite.mp3",c:"smokedope2016.jpg"},
            {t:"Abysmal Depths",a:"Xasthur",s:"abysmaldepthsareflooded.mp3",c:"xasthur.jpg"}, {t:"Diamonds",a:"Chris Travis",s:"diamonds.mp3",c:"christravis.jpg"},
            {t:"Black Magic",a:"Ethel Wulf",s:"blackmagic.mp3",c:"ethel.jpg"}, {t:"4 Raws",a:"EsDeeKid",s:"4raws.mp3",c:"esdee.jpg"},
            {t:"Fever",a:"fakemink",s:"fever.mp3",c:"buckshot.jpg"}, {t:"Stalks",a:"Ghost Mountain",s:"stalks.mp3",c:"ghostmountain.jpg"},
            {t:"MIA",a:"feng",s:"mia.mp3",c:"feng.jpg"}, {t:"Ceiling Fan",a:"Title Fight",s:"titlefight.mp3",c:"title-fih.jpg"},
            {t:"Turn Me Loose",a:"LB/Eminem",s:"turnmeloose.mp3",c:"limp.jpg"}, {t:"Black Beetles",a:"EsDeeKid",s:"bbr.mp3",c:"esdee2.jpg"},
            {t:"Apathy",a:"EsDeeKid",s:"apathy.mp3",c:"esdee3.jpg"}, {t:"Bring it Back",a:"Chris Travis",s:"bib.mp3",c:"chris2.jpg"},
            {t:"Die Til You Live",a:"fakemink",s:"dtyl.mp3",c:"fakemink5.jpg"}, {t:"Worth It",a:"xaviersobased",s:"worthit.mp3",c:"81853ABB-FB87-4A20-9303-9624B777245B.jpeg"},
            {t:"In Da Party",a:"smokedope2016",s:"indaparty.mp3",c:"smokedope4.jpg"}, {t:"Say It Aint Dro",a:"smokedope2016",s:"dro.mp3",c:"smokedope3.jpg"},
            {t:"Blunts On Mind",a:"Ethel Wulf",s:"bluntsomm.mp3",c:"ethel2.jpg"}, {t:"Luper",a:"Earl",s:"luper.mp3",c:"earl.jpg"},
            {t:"Frat",a:"smokedope2016",s:"frat.mp3",c:"smokedope2.jpg"}, {t:"Hit The Home",a:"Peace",s:"clock.mp3",c:"handofpeace.jpg"},
            {t:"Blow Me",a:"fakemink",s:"blowme.mp3",c:"fakeminkk.jpg"}, {t:"Minerva",a:"Deftones",s:"minerva.mp3",c:"deftones.jpg"},
            {t:"Hold On",a:"Limp Bizkit",s:"holdon.mp3",c:"limpbizkit.jpg"}, {t:"My Way",a:"Limp Bizkit",s:"myway.mp3",c:"limpbizkit.jpg"}
        ];
        
        const audio = $('audio-player'), mTit = $('mini-track-info'), mPlay = $('mini-play'), mArt = $('player-cover-art');
        let cIdx = 0;

        function loadSong(i) {
            const s = pl[i]; audio.src = B + s.s; mTit.textContent = s.t; mArt.src = B + s.c;
        }
        loadSong(0);

        mPlay.onclick = () => { if(audio.paused){ if(!audio.src) loadSong(cIdx); audio.play(); mPlay.textContent="||"; } else { audio.pause(); mPlay.textContent=">"; } };
        $('mini-next').onclick = () => { cIdx=(cIdx+1)%pl.length; loadSong(cIdx); audio.play(); mPlay.textContent="||"; };
        $('mini-prev').onclick = () => { cIdx=(cIdx-1+pl.length)%pl.length; loadSong(cIdx); audio.play(); mPlay.textContent="||"; };
    </script>
</body>
</html>
