<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>canvas</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #000; color: #ccc; font-family: Arial, sans-serif; font-size: 12px; line-height: 1.4;
            height: 100dvh; width: 100vw; overflow: hidden; position: fixed;
            display: flex; flex-direction: column;
        }
        a { color: #fff; text-decoration: none; }
        
        /* --- LAYOUT --- */
        .container { width: 100%; height: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; }
        .top-header { display: flex; justify-content: flex-end; align-items: center; padding: 10px; border-bottom: 1px solid #333; height: 40px; background: #000; flex-shrink: 0; }
        .top-links span { margin: 0 5px; color: #444; }

        .chat-wrapper { display: flex; flex: 1; min-height: 0; overflow: hidden; }
        
        /* --- MAIN CHAT --- */
        .chat-main { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; background: #111; min-width: 0; position: relative; }
        .chat-header-bar { background: #666; color: #fff; padding: 5px 10px; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        /* UPDATED: Added transition for the secret button */
        .filler-pattern { letter-spacing: 2px; color: #ccc; font-family: monospace; transition: color 0.3s, text-shadow 0.3s; }
        
        .chat-log { flex: 1; overflow-y: auto; padding: 10px; background: #000; scroll-behavior: smooth; }
        
        /* MESSAGES */
        .message { margin-bottom: 12px; word-wrap: break-word; position: relative; }
        
        /* NEW: Founder Badge */
        .founder-badge { 
            display: block; 
            font-size: 9px; 
            color: #fff; 
            font-weight: 900; 
            letter-spacing: 1px; 
            margin-bottom: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 2px rgba(255,255,255,0.5);
        }

        /* NEW: Reply Context inside messages */
        .reply-context-display {
            border-left: 2px solid #555;
            padding-left: 6px;
            margin-bottom: 4px;
            color: #777;
            font-size: 10px;
            font-style: italic;
        }

        .msg-time { color: #555; font-size: 10px; margin-right: 5px; }
        
        /* UPDATED: User Pointer */
        .msg-user { color: #fff; font-weight: bold; margin-right: 2px; cursor: pointer; }
        .msg-user:hover { text-decoration: underline; color: #ddd; }

        .msg-text { color: #ccc; }
        .msg-system { color: #facc15; font-style: italic; }
        .msg-alert { color: #f00; font-weight: bold; }
        .msg-notification { color: #0ff; font-weight: bold; border: 1px dashed #0ff; padding: 2px; cursor: pointer; }
        .chat-media { display: block; max-width: 100%; max-height: 200px; margin-top: 5px; border: 1px solid #333; }
        
        /* ACTION BUTTONS (Delete & Reply) */
        .msg-actions { display: none; float: right; margin-left: 5px; }
        .message:hover .msg-actions { display: inline-block; }
        .action-icon { cursor: pointer; margin-left: 5px; font-size: 10px; }
        .delete-btn { color: #f00; }
        .reply-btn { color: #0af; font-weight: bold; font-size: 14px; line-height: 10px;}

        /* INPUT AREA */
        .input-wrapper { flex-shrink: 0; background: #222; border-top: 1px solid #333; }
        
        /* NEW: Reply Bar above input */
        .reply-bar { 
            background: #1a1a1a; 
            color: #aaa; 
            padding: 6px 10px; 
            font-size: 11px; 
            border-bottom: 1px solid #333; 
            display: none; /* Hidden by default */
            justify-content: space-between; 
            align-items: center;
        }
        .reply-info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
        .reply-close { color: #f00; cursor: pointer; font-weight: bold; padding: 0 5px; }

        .chat-input-area { padding: 8px; display: flex; gap: 8px; align-items: center; }
        .chat-input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; }
        .action-btn, .send-btn { background: #333; color: #fff; border: 1px solid #444; height: 34px; font-weight: bold; cursor: pointer; padding: 0 15px; border-radius: 4px; }

        /* --- SIDEBAR --- */
        .chat-sidebar { 
            width: 200px; 
            background: #111; 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid #333; 
            flex-shrink: 0; 
            overflow: hidden; 
        }
        .sidebar-search { padding: 5px; background: #000; border-bottom: 1px solid #333; }
        .search-input { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 4px; font-size: 12px; }
        
        .user-list { 
            list-style: none; 
            padding: 5px; 
            overflow-y: auto; 
            flex: 1; 
            min-height: 50px;
        }
        .user-list li { padding: 4px 0; color: #888; display: flex; align-items: center; }
        .user-list li.online::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #2ecc71; margin-right: 8px; border-radius: 50%; box-shadow: 0 0 5px #2ecc71; }
        .user-list li.offline::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #444; margin-right: 8px; border-radius: 50%; }
        .user-link { color: #bbb; cursor: pointer; } 
        .user-link:hover { color: #fff; }

        /* --- PLAYER STYLES --- */
        .mini-player { border-top: 1px solid #333; background: #000; padding: 8px; text-align: center; flex-shrink: 0; }
        
        .player-visual-container { 
            width: 100px; height: 80px; margin: 0 auto 5px auto; 
            background: #111; border: 1px solid #444; position: relative; overflow: hidden; 
        }
        #player-cover-art { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index: 2; }
        #yt-player-placeholder { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        .mini-track-info { font-size: 10px; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-controls { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .mini-btn { background: #333; border: 1px solid #444; color: #fff; width: 30px; height: 25px; cursor: pointer; }
        
        /* CUSTOM MUSIC FORM */
        .custom-music-controls { 
            display: none; 
            padding: 10px; border-top: 1px solid #333; background: #000; 
            flex-shrink: 0; 
        }
        .custom-input { width: 100%; background: #222; border: 1px solid #444; color: #fff; margin-bottom: 3px; font-size: 10px; padding: 3px; }
        
        /* --- MOBILE FIXES --- */
        @media (max-width: 768px) {
            .chat-wrapper { flex-direction: column; }
            .chat-main { height: 60%; flex: none; }
            .chat-sidebar { 
                width: 100%; 
                flex: 1; 
                border-left: none; 
                border-top: 1px solid #333; 
                overflow-y: auto; 
                display: block;
            }
            .user-list { max-height: 120px; overflow-y: auto; border-bottom: 1px solid #333; }
            .player-visual-container { display: none; }
        }

        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-track { background: #111; } 
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-header">
            <div class="top-links"><a href="index.html">home</a> <span>|</span> <a href="list.html">list</a> <span>|</span> <a href="settings.html">settings</a></div>
        </div>
        
        <div class="chat-wrapper">
            <main class="chat-main">
                <div class="chat-header-bar">
                    <span class="filler-pattern" id="secret-btn">[>::<]</span>
                    <span id="user-count">Online: 0</span>
                </div>
                <div class="chat-log" id="chat-log">
                    <div class="message"><span class="msg-time">[SYSTEM]</span> <span class="msg-system">connecting...</span></div>
                </div>
                
                <div class="input-wrapper">
                    <div id="reply-bar" class="reply-bar">
                        <span id="reply-info" class="reply-info">Replying...</span>
                        <span id="reply-close" class="reply-close">[x]</span>
                    </div>

                    <div class="chat-input-area">
                        <input type="file" id="media-input" accept="image/*,video/*" style="display: none;">
                        <button class="action-btn" id="upload-trigger" title="Upload">[+]</button>
                        <input type="text" class="chat-input" id="message-input" placeholder="Message..." autocomplete="off">
                        <button class="send-btn" id="send-btn">SEND</button>
                    </div>
                </div>
            </main>

            <aside class="chat-sidebar">
                <div class="chat-header-bar">users</div>
                <div class="sidebar-search">
                    <input type="text" id="user-search" class="search-input" placeholder="Search...">
                </div>
                <ul class="user-list" id="user-list"></ul>
                
                <div class="mini-player">
                    <div class="player-visual-container">
                        <img id="player-cover-art" src="" alt="art">
                        <div id="yt-player-placeholder"></div>
                    </div>
                    <div id="mini-track-info" class="mini-track-info">stopped</div>
                    <div class="mini-controls">
                        <button id="mini-prev" class="mini-btn">&lt;</button>
                        <button id="mini-play" class="mini-btn">&gt;</button>
                        <button id="mini-next" class="mini-btn">&gt;&gt;</button>
                        <button id="toggle-custom-btn" class="mini-btn" style="color: #4ade80;" title="Add Song">+</button>
                    </div>
                </div>

                <div class="custom-music-controls" id="custom-music-box">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span style="color: #666; font-size: 10px;">ADD SONG</span>
                        <span id="close-custom-btn" style="color: #f00; cursor: pointer; font-size: 10px; font-weight: bold;">[X]</span>
                    </div>
                    <input type="text" id="custom-title" class="custom-input" placeholder="Song Title">
                    <input type="text" id="custom-url" class="custom-input" placeholder="URL (mp3/youtube)">
                    <button id="add-song-btn" style="width: 100%; background: #333; color: #fff; border: 1px solid #444; cursor: pointer; font-size: 10px; padding: 4px;">+ SAVE</button>
                    <div id="custom-msg" style="color: green; font-size: 9px; display:none; margin-top:3px;">Saved!</div>
                </div>
            </aside>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        // --- CONFIG & UTILS ---
        const firebaseConfig={apiKey:"AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",authDomain:"ewsitechat.firebaseapp.com",databaseURL:"https://ewsitechat-default-rtdb.firebaseio.com",projectId:"ewsitechat",storageBucket:"ewsitechat.firebasestorage.app",messagingSenderId:"282495574514",appId:"1:282495574514:web:e2781da630d93fc1ce8b6b",measurementId:"G-GTN3TL1P2K"};
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db=firebase.database(), auth=firebase.auth();
        const ADMINS=["root","futtbucker67"];
        const FOUNDERS=["root","futtbucker67"]; // Founder List

        const $ = (id) => document.getElementById(id);
        const els = { input: $('message-input'), send: $('send-btn'), log: $('chat-log'), list: $('user-list'), count: $('user-count'), media: $('media-input'), upBtn: $('upload-trigger'), search: $('user-search'), replyBar: $('reply-bar'), replyInfo: $('reply-info'), replyClose: $('reply-close') };
        
        let myName = localStorage.getItem('username'), myUid = null;
        let allUsers = {}, onlineStatus = {};
        
        // --- REPLY STATE ---
        let currentReplyData = null; // { user: string, text: string, id: string }

        // --- CHECK LOGIN STATUS ---
        if(!myName || !myName.trim()) window.location.href = "register.html";

        // --- AUTH & INIT ---
        auth.signInAnonymously().catch(e => console.error(e));
        auth.onAuthStateChanged(u => {
            if(u) {
                myUid = u.uid;
                db.ref('users/' + myUid).update({ username: myName });
                initPresence(); initChat(); initMods(); initNotifs(); initMusic();
                initSecret(); // <--- ADDED SECRET INIT HERE
                els.log.innerHTML = '';
                addMsg("System", "welcome " + myName, false, true);
            }
        });

        // --- SECRET BUTTON LOGIC ---
        function initSecret() {
            const btn = $('secret-btn');
            if(ADMINS.includes(myName)) {
                // Visual Indicator for Admins
                btn.style.cursor = 'pointer';
                btn.title = "ADMIN: Clear Chat & Fix Lag";
                btn.style.textShadow = "0 0 5px rgba(255, 0, 0, 0.5)"; // Subtle red glow

                btn.onclick = () => {
                    if(confirm("⚠️ ADMIN ACTION ⚠️\n\nClear entire chat history to fix lag? This cannot be undone.")) {
                        // 1. Clear Database
                        db.ref('messages').remove()
                        .then(() => {
                            // 2. Clear Local Screen immediately
                            els.log.innerHTML = '';
                            addMsg("System", "*** Chat memory cleared by Admin ***", false, true);
                        })
                        .catch(err => alert("Error: " + err));
                    }
                };
            }
        }

        // --- CHAT & PRESENCE LOGIC ---
        function initPresence() {
            const ref = db.ref('/status/' + myUid);
            const online = { state:'online', last_changed: firebase.database.ServerValue.TIMESTAMP };
            const offline = { state:'offline', last_changed: firebase.database.ServerValue.TIMESTAMP };
            db.ref('.info/connected').on('value', s => { if(s.val()) ref.onDisconnect().set(offline).then(() => ref.set(online)); });
            db.ref('users').on('value', s => { allUsers = s.val() || {}; updateList(); });
            db.ref('status').on('value', s => { onlineStatus = s.val() || {}; updateList(); });
        }
        function updateList() {
            const term = els.search.value.toLowerCase();
            const frag = document.createDocumentFragment();
            let onCount = 0;
            let displayList = [];
            Object.keys(allUsers).forEach(uid => {
                const uData = allUsers[uid];
                if(!uData.username || uData.username.startsWith("Guest_")) return;
                const isOnline = (onlineStatus[uid] && onlineStatus[uid].state === 'online');
                if(isOnline) onCount++;
                displayList.push({ uid, username: uData.username, isOnline });
            });
            displayList.sort((a,b) => (a.isOnline === b.isOnline) ? a.username.localeCompare(b.username) : (a.isOnline?-1:1));
            displayList.forEach(u => {
                if(term && !u.username.toLowerCase().includes(term)) return;
                const li = document.createElement('li'); li.className = u.isOnline ? 'online' : 'offline';
                const a = document.createElement('a'); a.textContent = u.username;
                a.className = "user-link" + (u.username === myName ? " is-me" : "");
                // FEATURE 1: Click to Profile
                a.href = `profile.html?user=${u.username}`; 
                li.appendChild(a); frag.appendChild(li);
            });
            els.list.innerHTML = ''; els.list.appendChild(frag);
            els.count.textContent = `online: ${onCount}`;
        }
        els.search.addEventListener('input', updateList);

        function initChat() {
            db.ref('messages').limitToLast(100).on('child_added', s => {
                const d = s.val();
                if(d && d.timestamp) {
                    // Added: Pass replyTo info to addMsg
                    addMsg(d.username, d.text, d.username===myName, false, d.timestamp, s.key, d.mediaType, d.mediaData, d.replyTo);
                }
            });
            db.ref('messages').on('child_removed', s => { 
                const el = document.getElementById(`msg-${s.key}`); 
                if(el) el.remove(); 
                // If all messages are removed (like clear chat), this listener handles individual removal, 
                // but the manual innerHTML clear in initSecret handles the bulk clear visual instantly.
            });
        }

        // --- REPLY FUNCTIONS ---
        window.triggerReply = (user, text) => {
            currentReplyData = { user: user, text: text || "[Media]" };
            els.replyInfo.textContent = `Replying to ${user}: ${currentReplyData.text}`;
            els.replyBar.style.display = 'flex';
            els.input.focus();
        };
        
        els.replyClose.onclick = () => {
            currentReplyData = null;
            els.replyBar.style.display = 'none';
        };

        function sendMsg() {
            const txt = els.input.value.trim(); if(!txt) return;
            if(txt.startsWith('/') && ADMINS.includes(myName)) { handleCmd(txt); els.input.value=''; return; }
            
            const msgData = { 
                username: myName, 
                text: txt, 
                timestamp: firebase.database.ServerValue.TIMESTAMP 
            };
            
            // Add reply data if active
            if(currentReplyData) {
                msgData.replyTo = currentReplyData;
                els.replyClose.click(); // Reset reply state
            }

            db.ref('messages').push(msgData);
            els.input.value = '';
        }

        els.upBtn.onclick = () => els.media.click();
        els.media.onchange = (e) => {
            const f = e.target.files[0]; if(!f || f.size > 2097152) return alert("Max 2MB");
            const r = new FileReader();
            r.onload = (ev) => db.ref('messages').push({ username:myName, text:"", mediaType:(f.type.startsWith('image')?'image':'video'), mediaData:ev.target.result, timestamp:firebase.database.ServerValue.TIMESTAMP });
            r.readAsDataURL(f); els.media.value="";
        };

        function addMsg(user, text, isMe, isSys, time=Date.now(), id=null, mType=null, mData=null, replyTo=null) {
            const div = document.createElement('div'); div.className='message'; if(id) div.id=`msg-${id}`;
            const ts = new Date(time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            
            if(text && text.startsWith('***')) { 
                div.innerHTML = `<span class="msg-time">[${ts}]</span> <span class="msg-alert">${text}</span>`; 
            } else if(isSys) { 
                div.innerHTML = `<span class="msg-time">[${ts}]</span> <span class="msg-system">${text}</span>`; 
            } else {
                // FEATURE 3: Founder Badge
                let founderHtml = "";
                if(FOUNDERS.includes(user)) {
                    founderHtml = `<div class="founder-badge">FOUNDER</div>`;
                }

                // FEATURE 2a: Reply Context Display
                let replyHtml = "";
                if(replyTo) {
                    replyHtml = `<div class="reply-context-display">Replying to ${replyTo.user}: ${replyTo.text}</div>`;
                }

                let content = text ? `<span class="msg-text">${text}</span>` : "";
                if(mType && mData) content += (mType==='image' ? `<img src="${mData}" class="chat-media">` : `<video src="${mData}" class="chat-media" controls></video>`);
                
                // Actions container (Delete & Reply)
                const delBtn = (ADMINS.includes(myName) && id) ? `<span class="action-icon delete-btn" onclick="delMsg('${id}')">[x]</span>` : "";
                
                // Escape text for JS function safely
                const safeText = text ? text.replace(/'/g, "\\'").replace(/"/g, '&quot;') : "";
                // FEATURE 2b: Reply Button
                const replyBtn = `<span class="action-icon reply-btn" onclick="triggerReply('${user}', '${safeText}')" title="Reply">↰</span>`;
                
                const style = (!isMe) ? "color:#888;" : "";
                
                // FEATURE 1: Clickable User
                const userHtml = `<span class="msg-user" style="${style}" onclick="window.location.href='profile.html?user=${user}'">${user}:</span>`;

                div.innerHTML = `
                    ${founderHtml}
                    ${replyHtml}
                    <span class="msg-time">[${ts}]</span> 
                    ${userHtml} 
                    ${content}
                    <div class="msg-actions">${replyBtn}${delBtn}</div>
                `;
            }
            els.log.appendChild(div); els.log.scrollTop = els.log.scrollHeight;
        }

        function handleCmd(str) {
            const [c, dur, tgt] = str.split(' '); if(!tgt) return;
            const tid = Object.keys(allUsers).find(k => allUsers[k].username===tgt);
            if(!tid) return addMsg("System", "User not found", false, true);
            let ms = 30000; if(dur==='inf') ms=3153600000000;
            const type = (c==='/ban') ? 'ban' : 'mute';
            db.ref('moderation/'+tid).set({ type, until: Date.now()+ms });
            db.ref('messages').push({ username:"System", text:`*** ${tgt} was ${type}ed for ${dur} ***`, timestamp:firebase.database.ServerValue.TIMESTAMP });
        }
        function initMods() {
            db.ref('moderation/'+myUid).on('value', s => {
                const d = s.val();
                if(d && d.until > Date.now()) { els.input.disabled = els.upBtn.disabled = true; els.input.placeholder = `${d.type}ed...`; }
                else { els.input.disabled = els.upBtn.disabled = false; els.input.placeholder = "Message..."; }
            });
        }
        function initNotifs() {
            db.ref('notifications/'+myName).on('child_added', s => {
                const n = s.val(); if(!n) return;
                const d = document.createElement('div'); d.className='message';
                d.innerHTML = `<span class="msg-time">[ALERT]</span> <span class="msg-notification">PM from ${n.from}</span>`;
                d.onclick = () => { if(confirm("Go to PMs?")) window.location.href=`pm.html?with=${n.from}`; };
                els.log.appendChild(d); els.log.scrollTop = els.log.scrollHeight;
                db.ref(`notifications/${myName}/${s.key}`).remove();
            });
        }
        window.delMsg = (id) => { if(confirm("Delete?")) db.ref('messages/'+id).remove(); };
        els.send.onclick = sendMsg; els.input.onkeypress = (e) => { if(e.key==='Enter') sendMsg(); };

        /* =========================================
           HYBRID PLAYER LOGIC (MP3 + YOUTUBE)
           ========================================= */
        let ytPlayer = null;
        let isYoutubeReady = false;
        
        // YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('yt-player-placeholder', {
                height: '100%', width: '100%',
                playerVars: { 'playsinline': 1, 'controls': 0, 'disablekb': 1 },
                events: { 'onReady': () => { isYoutubeReady = true; }, 'onStateChange': onPlayerStateChange }
            });
        };

        function onPlayerStateChange(event) { if (event.data === YT.PlayerState.ENDED) playNext(); }
        function playNext() { $('mini-next').click(); }

        function initMusic() {
            const BASE_MUSIC_URL = "https://ewsmusic1.netlify.app/";
            const defaultPlaylist = [
                {t:"Xtal",s:"xtal.mp3",c:"aphex.jpg"}, 
                {t:"I Don't Wanna Be Me",s:"idontwannabeme.mp3",c:"ton.jpg"},
                {t:"Life Is Killing Me",s:"lifeiskilling.mp3",c:"ton.jpg"}, 
                {t:"Exit Music",s:"exitmusic.mp3",c:"radiohead.jpg"},
                {t:"Alternative Outro",s:"alternativeoutro.mp3",c:"lucki.jpg"},
                {t:"My Way",s:"myway.mp3",c:"limpbizkit.jpg"}
            ];

            let activePlaylist = [...defaultPlaylist];
            let cIdx = 0;
            let currentMode = 'mp3';

            // UI Refs
            const audio = $('audio-player');
            const mTit = $('mini-track-info');
            const mPlay = $('mini-play');
            const mArt = $('player-cover-art');
            const inpTitle = $('custom-title');
            const inpUrl = $('custom-url');
            const btnAdd = $('add-song-btn');
            const msgCustom = $('custom-msg');
            
            // Toggle UI Refs
            const btnToggle = $('toggle-custom-btn');
            const btnClose = $('close-custom-btn');
            const divCustom = $('custom-music-box');

            // --- TOGGLE HANDLERS ---
            btnToggle.onclick = () => {
                const isHidden = (window.getComputedStyle(divCustom).display === 'none');
                divCustom.style.display = isHidden ? 'block' : 'none';
                if(isHidden) setTimeout(() => divCustom.scrollIntoView({ behavior: 'smooth' }), 100);
            };
            
            btnClose.onclick = () => { divCustom.style.display = 'none'; };

            // --- PLAYER LOGIC ---
            function getLinkData(url) {
                const ytReg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const ytMatch = url.match(ytReg);
                const listReg = /[?&]list=([^#\&\?]+)/;
                const listMatch = url.match(listReg);
                if (ytMatch && ytMatch[2].length === 11) {
                    return { type: 'youtube', id: ytMatch[2], list: listMatch ? listMatch[1] : null };
                } else {
                    const finalUrl = url.startsWith('http') ? url : BASE_MUSIC_URL + url;
                    return { type: 'mp3', src: finalUrl };
                }
            }

            function loadSong(i) {
                if (i < 0) i = activePlaylist.length - 1;
                if (i >= activePlaylist.length) i = 0;
                cIdx = i;

                const s = activePlaylist[cIdx];
                const linkData = getLinkData(s.s);
                currentMode = linkData.type;

                mTit.textContent = s.t;
                if(s.isCustom) mTit.style.color = "#4ade80"; else mTit.style.color = "#fff";

                if (currentMode === 'mp3') {
                    if(ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
                    $('yt-player-placeholder').style.zIndex = "-1"; 
                    mArt.style.zIndex = "2"; mArt.style.display = "block";
                    audio.src = linkData.src;
                    mArt.src = s.c ? (s.c.startsWith('http') ? s.c : BASE_MUSIC_URL + s.c) : "https://placehold.co/60x60/000/fff?text=MP3";
                } else if (currentMode === 'youtube') {
                    audio.pause();
                    mArt.style.display = "none";
                    $('yt-player-placeholder').style.zIndex = "2";
                    if (isYoutubeReady) {
                        if (linkData.list) ytPlayer.loadPlaylist({ list: linkData.list, listType: 'playlist', index: 0 });
                        else ytPlayer.loadVideoById(linkData.id);
                    }
                }
                mPlay.textContent = "||"; 
            }

            mPlay.onclick = () => {
                if (currentMode === 'mp3') {
                    if (audio.paused) { if(!audio.src) loadSong(cIdx); audio.play(); mPlay.textContent = "||"; }
                    else { audio.pause(); mPlay.textContent = ">"; }
                } else if (currentMode === 'youtube' && isYoutubeReady) {
                    const state = ytPlayer.getPlayerState();
                    if (state === 1) { ytPlayer.pauseVideo(); mPlay.textContent = ">"; }
                    else { ytPlayer.playVideo(); mPlay.textContent = "||"; }
                }
            };
            $('mini-next').onclick = () => { loadSong(cIdx + 1); if(currentMode === 'mp3') audio.play(); };
            $('mini-prev').onclick = () => { loadSong(cIdx - 1); if(currentMode === 'mp3') audio.play(); };
            
            audio.onended = () => $('mini-next').click();

            if (myUid) {
                db.ref('users/' + myUid + '/playlist').on('value', (snapshot) => {
                    const data = snapshot.val();
                    activePlaylist = [...defaultPlaylist];
                    if (data) {
                        const userSongs = Object.values(data).map(item => ({ t: item.title, s: item.url, c: null, isCustom: true }));
                        activePlaylist = activePlaylist.concat(userSongs);
                    }
                });
            }

            btnAdd.onclick = () => {
                const t = inpTitle.value.trim();
                const u = inpUrl.value.trim();
                if (!t || !u) return alert("Enter title and URL");
                db.ref('users/' + myUid + '/playlist').push({
                    title: t, url: u, addedAt: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    inpTitle.value = ''; inpUrl.value = '';
                    msgCustom.style.display = 'block';
                    setTimeout(() => msgCustom.style.display = 'none', 2000);
                });
            };

            loadSong(0);
            if(currentMode==='mp3') audio.pause();
            if(currentMode==='youtube' && isYoutubeReady) ytPlayer.pauseVideo();
            mPlay.textContent = ">";
        }
    </script>
</body>
</html>
