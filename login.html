<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uplink // login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
    html, body { 
        height: 100%; 
        margin: 0; 
        overflow: hidden;
    }
    body {
        font-family: 'VT323', monospace;
        color: #e5e5e5;
        background-color: #000000;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .login-container {
        background-color: rgba(10, 10, 10, 0.9);
        border: 1px solid #444;
        padding: 2.5rem;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    
    .input-field {
        background-color: rgba(20, 20, 20, 0.9);
        border: 1px solid #444;
        color: #e5e5e5;
        padding: 0.75rem;
        width: 100%;
        font-family: 'VT323', monospace;
        font-size: 1.25rem;
        margin-bottom: 1rem;
        outline: none;
    }
    
    .input-field:focus { border-color: #facc15; }
    
    .btn {
        background-color: rgba(250, 204, 21, 0.1);
        border: 2px solid #facc15;
        color: #facc15;
        padding: 0.75rem;
        font-family: 'VT323', monospace;
        font-size: 1.5rem;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        transition: all 0.2s;
    }
    
    .btn:hover { background-color: #facc15; color: #000; }
    
    .error-message {
        color: #ef4444;
        font-size: 1.125rem;
        margin-bottom: 1rem;
        display: none;
        border-left: 3px solid #ef4444;
        padding-left: 10px;
    }
    
    .success-message {
        color: #10b981;
        font-size: 1.125rem;
        margin-bottom: 1rem;
        display: none;
    }
    
    .link-text {
        color: #666;
        font-size: 1.1rem;
        text-decoration: underline;
        cursor: pointer;
    }
    .link-text:hover { color: #facc15; }
</style>
</head>
<body>

<div class="login-container">
    <h1 class="text-4xl text-yellow-400 mb-6 text-center">ACCESS_CONTROL</h1>
    
    <div class="error-message" id="error-message"></div>
    <div class="success-message" id="success-message"></div>
    
    <form id="auth-form">
        <input type="text" id="username" class="input-field" placeholder="username" required autocomplete="username">
        <input type="password" id="password" class="input-field" placeholder="password" required autocomplete="current-password">
        
        <button type="submit" class="btn">LOGIN</button>
    </form>
    
    <div class="text-center mt-6">
        <a href="register.html" class="link-text">create new node >></a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
        authDomain: "ewsitechat.firebaseapp.com",
        databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
        projectId: "ewsitechat",
        storageBucket: "ewsitechat.firebasestorage.app",
        messagingSenderId: "282495574514",
        appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Random Background Logic
    const bgs = ['IMG_4928.jpeg', 'IMG_4946.jpeg', 'IMG_4944.jpeg', 'IMG_5262.jpeg'];
    // Default to a dark color if image fails, or pick random
    const chosenBg = bgs[Math.floor(Math.random() * bgs.length)];
    document.body.style.backgroundImage = `url('${chosenBg}')`;

    // Check if already logged in
    if (localStorage.getItem('username')) {
        window.location.href = 'index.html';
    }

    const authForm = document.getElementById('auth-form');
    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        errorMsg.style.display = 'none';
        successMsg.innerText = ">> ESTABLISHING CONNECTION...";
        successMsg.style.display = 'block';

        try {
            const snapshot = await get(ref(db, 'users/' + username));

            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // CHECK PASSWORD
                if (data.password === password) {
                    successMsg.innerText = ">> ACCESS GRANTED.";
                    localStorage.setItem('username', username);
                    // Add a small delay so user sees "Access Granted"
                    setTimeout(() => window.location.href = 'index.html', 800);
                } else {
                    successMsg.style.display = 'none';
                    errorMsg.innerText = ">> ACCESS DENIED: INVALID PASSWORD";
                    errorMsg.style.display = 'block';
                }
            } else {
                successMsg.style.display = 'none';
                errorMsg.innerText = ">> USER NOT FOUND";
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            console.error(error);
            successMsg.style.display = 'none';
            errorMsg.innerText = ">> NETWORK ERROR";
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
