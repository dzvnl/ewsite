<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #111;
            min-height: 100vh;
            margin: 0;
            padding: 80px 20px 20px 20px; /* Padding for top fixed bar */
        }

        /* --- X-RAY DIAGNOSTIC BAR --- */
        #diagnosticBar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: #000; border-bottom: 2px solid #facc15;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 10000; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .diag-info { font-size: 1.2rem; color: #fff; }
        .diag-highlight { color: #facc15; font-weight: bold; }
        .diag-status { color: #4ade80; }

        /* --- GRID --- */
        .user-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; max-width: 1000px; margin: 0 auto;
        }
        .user-card {
            background: #222; border: 1px solid #444; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .card-name { font-size: 1.8rem; margin: 10px 0; color: #fff; }
        .call-btn {
            background: #166534; color: #fff; width: 100%; padding: 10px;
            font-size: 1.3rem; border: 1px solid #22c55e; cursor: pointer;
        }
        .call-btn:hover { background: #22c55e; color: #000; }

        /* --- CALL UI --- */
        #callModal, #incomingPopup {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .hidden { display: none !important; }
        
        video { background: #000; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="diagnosticBar">
        <div>
            <div class="diag-info">I AM: <span id="myIdentity" class="diag-highlight">...</span></div>
            <div class="diag-info text-sm text-gray-400">Listening at: <span id="myPath">...</span> <span id="dbStatus" class="diag-status">(Connecting...)</span></div>
        </div>
        <button onclick="checkPermissions()" class="bg-gray-700 text-white px-3 py-1 border border-gray-500 hover:bg-gray-600">TEST DB WRITE</button>
    </div>

    <div id="incomingPopup" class="hidden">
        <div class="bg-gray-800 p-8 border-2 border-green-500 rounded text-center">
            <h1 class="text-4xl text-white mb-4 animate-bounce">📞 INCOMING CALL!</h1>
            <p class="text-xl text-yellow-400 mb-8">name: <span id="incomingName">...</span></p>
            <button onclick="answerCall()" class="bg-green-600 text-white px-8 py-4 text-2xl w-full mb-4 hover:bg-green-500">ANSWER VIDEO</button>
            <button onclick="rejectCall()" class="bg-red-600 text-white px-8 py-2 w-full hover:bg-red-500">Ignore</button>
        </div>
    </div>

    <div id="callModal" class="hidden">
        <div class="absolute top-5 left-5 text-xl text-yellow-400">
            STATUS: <span id="connectionState" class="text-white">Connecting...</span>
        </div>
        
        <video id="remoteVideo" class="w-full h-full max-w-4xl max-h-[80vh] object-cover" autoplay playsinline></video>
        
        <div class="absolute bottom-5 right-5 w-48 h-36 bg-black border-2 border-white">
            <video id="localVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
        </div>

        <button onclick="endCall()" class="absolute bottom-10 bg-red-600 text-white px-10 py-4 text-xl rounded-full border-2 border-red-400 hover:bg-red-500">HANG UP</button>
    </div>

    <div id="userGrid" class="user-grid">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- IDENTITY SETUP ---
        let myUsername = localStorage.getItem('chat_username');
        if (!myUsername) {
            myUsername = prompt("Enter your username exactly as it appears in the database:");
            if(myUsername) localStorage.setItem('chat_username', myUsername);
            else myUsername = "guest_" + Math.floor(Math.random()*100);
        }
        
        // Normalize: We remove spaces to avoid path errors
        myUsername = myUsername.trim(); 

        // DISPLAY DEBUG INFO
        document.getElementById('myIdentity').innerText = myUsername;
        document.getElementById('myPath').innerText = `calls/${myUsername}`;

        // --- GLOBAL VARS ---
        let localStream = null;
        let peerConnection = null;
        let currentCallPath = null;
        
        const servers = {
            iceServers: [
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        // --- 1. LISTENER (Are you there?) ---
        const myRef = ref(db, `calls/${myUsername}`);
        onValue(myRef, (snapshot) => {
            document.getElementById('dbStatus').innerText = "(ONLINE & READY)";
            const data = snapshot.val();
            
            if (data && data.offer && !data.answer) {
                console.log("Incoming detected!", data);
                document.getElementById('incomingName').innerText = data.from;
                currentCallPath = `calls/${myUsername}`;
                document.getElementById('incomingPopup').classList.remove('hidden');
            } else if (!data) {
                document.getElementById('incomingPopup').classList.add('hidden');
            }
        }, (err) => {
            document.getElementById('dbStatus').innerText = "(PERMISSION DENIED - CHECK RULES)";
            document.getElementById('dbStatus').style.color = "red";
            alert("Firebase Error: " + err.message + "\n\nDid you add the Rules?");
        });

        // --- 2. START CALL ---
        window.startCall = async (targetUser) => {
            targetUser = targetUser.trim();
            if(targetUser === myUsername) return alert("You cannot call yourself!");

            // X-RAY CONFIRMATION
            const confirmCall = confirm(`X-RAY DIAGNOSTIC:\n\nMy ID: ${myUsername}\nCalling Path: calls/${targetUser}\n\nDoes "calls/${targetUser}" match the other screen?\n\nClick OK to send the signal.`);
            if(!confirmCall) return;

            document.getElementById('callModal').classList.remove('hidden');
            document.getElementById('connectionState').innerText = "Accessing Camera...";

            currentCallPath = `calls/${targetUser}`;

            // Setup Video
            try {
                localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('localVideo').srcObject = localStream;
            } catch(e) {
                return alert("Camera Error: " + e.message);
            }

            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
            
            peerConnection.onicecandidate = e => {
                if(!e.candidate) {
                    document.getElementById('connectionState').innerText = "Signal Ready. Sending...";
                    set(ref(db, currentCallPath), {
                        offer: JSON.stringify(peerConnection.localDescription),
                        from: myUsername
                    }).then(() => {
                        document.getElementById('connectionState').innerText = "Ringing... Waiting for answer.";
                    }).catch(err => alert("WRITE FAILED: " + err.message));
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // Listen for answer
            onValue(ref(db, currentCallPath), async (snapshot) => {
                const data = snapshot.val();
                if(data && data.answer && !peerConnection.currentRemoteDescription) {
                    document.getElementById('connectionState').innerText = "Connecting...";
                    const desc = new RTCSessionDescription(JSON.parse(data.answer));
                    await peerConnection.setRemoteDescription(desc);
                }
            });
        };

        // --- 3. ANSWER CALL ---
        window.answerCall = async () => {
            document.getElementById('incomingPopup').classList.add('hidden');
            document.getElementById('callModal').classList.remove('hidden');

            const snapshot = await get(ref(db, currentCallPath));
            const data = snapshot.val();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('localVideo').srcObject = localStream;
            } catch(e) { return alert("Camera Error: " + e.message); }

            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            
            peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];

            peerConnection.onicecandidate = e => {
                if(!e.candidate) {
                    update(ref(db, currentCallPath), {
                        answer: JSON.stringify(peerConnection.localDescription)
                    });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
        };

        window.endCall = () => {
            if(currentCallPath) remove(ref(db, currentCallPath));
            window.location.reload();
        };
        
        window.checkPermissions = () => {
            set(ref(db, 'test_write'), { time: Date.now() })
                .then(() => alert("WRITE SUCCESS! Database is working."))
                .catch((e) => alert("WRITE FAILED! " + e.message));
        };

        // --- FETCH USERS ---
        async function fetchUsers() {
            const usersRef = ref(db, 'users');
            const snap = await get(usersRef);
            const grid = document.getElementById('userGrid');
            
            if(snap.exists()) {
                const data = snap.val();
                Object.keys(data).forEach(key => {
                    const div = document.createElement('div');
                    div.className = 'user-card';
                    div.innerHTML = `
                        <div class="card-name">${key}</div>
                        <button class="call-btn" onclick="window.startCall('${key}')">CALL</button>
                    `;
                    grid.appendChild(div);
                });
            } else {
                grid.innerHTML = "<div class='text-white text-center'>No users found in database.</div>";
            }
        }
        
        fetchUsers();
    </script>
</body>
</html>
