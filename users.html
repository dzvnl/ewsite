<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 30px auto;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        h1 { font-size: 3rem; color: #facc15; margin: 0; line-height: 1; text-shadow: 0 0 10px rgba(250, 204, 21, 0.3); }

        .status-bar {
            font-size: 1.5rem;
            color: #22c55e;
            text-shadow: 0 0 5px #22c55e;
            margin-bottom: 10px;
            text-align: right;
        }

        .filter-input {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            font-family: 'VT323';
            font-size: 1.5rem;
            padding: 5px 10px;
            width: 250px;
        }
        .filter-input:focus { outline: none; border-color: #facc15; }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .user-card {
            background: rgba(0,0,0,0.8);
            border: 1px solid #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
            position: relative; 
            overflow: hidden;
        }
        .user-card:hover { border-color: #facc15; transform: translateY(-2px); }
        .user-card.is-founder { border-color: #c084fc; }
        .user-card.is-admin { border-color: #ef4444; }

        .card-pfp { width: 80px; height: 80px; object-fit: cover; border: 1px solid #555; margin-bottom: 10px; background: #000; }
        .card-name { font-size: 1.5rem; color: #fff; margin-bottom: 5px; }
        .card-role { font-size: 1rem; text-transform: uppercase; padding: 0 5px; margin-bottom: 5px; }
        .role-founder { color: #c084fc; border: 1px solid #c084fc; }
        .role-admin { color: #ef4444; border: 1px solid #ef4444; }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            justify-content: center;
        }
        
        .action-btn {
            font-family: 'VT323';
            font-size: 1rem;
            padding: 5px 10px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }

        .btn-call { background: #22c55e; color: #000; width: 100%; }
        .btn-call:hover { background: #4ade80; }

        .nav-back { display: block; width: 100%; max-width: 900px; margin: 20px auto; color: #666; text-decoration: none; font-size: 1.2rem; }
        .nav-back:hover { color: #facc15; }

        /* --- INCOMING CALL MODAL --- */
        #incomingModal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .incoming-box {
            background: #111;
            border: 2px solid #22c55e;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.2);
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }
        .accept-btn {
            background: #22c55e; color: #000;
            font-family: 'VT323'; font-size: 2rem;
            padding: 10px 40px; border: none; cursor: pointer; margin-top: 20px;
        }
        .accept-btn:hover { background: #fff; }

    </style>
</head>
<body>

    <a href="index.html" class="nav-back"><< RETURN_HOME</a>

    <div class="header-container">
        <div>
            <h1>users</h1>
            <div id="who-am-i" class="status-bar">CONNECTING...</div>
        </div>
        <input type="text" id="filterInput" class="filter-input" placeholder="Filter users...">
    </div>

    <div id="userGrid" class="user-grid">
        <div style="font-size: 1.5rem; color: #666;">fetching...</div>
    </div>

    <div id="incomingModal">
        <div class="incoming-box">
            <div style="font-size: 3rem; color: #22c55e;">INCOMING CALL</div>
            <div id="incomingCaller" style="font-size: 1.5rem; color: #fff;">UNKNOWN</div>
            <button id="acceptBtn" class="accept-btn">ACCEPT</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, push, set, onChildAdded, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // --- GLOBAL STATE ---
        let myIdentity = null;
        let myUid = null;
        let allUsers = [];
        
        const FOUNDERS = ['root', '-nl', 'futtbucker67'];
        const grid = document.getElementById('userGrid');
        const statusLabel = document.getElementById('who-am-i');
        const modal = document.getElementById('incomingModal');

        // --- 1. AUTH CHECK ---
        // This replaces the 'Guest' login. 
        // Logic: Check if user is logged in. If not, kick them out.
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is authenticated
                console.log("Authenticated as UID:", user.uid);
                myUid = user.uid;
                
                // Now fetch users to find match
                fetchUsers();
            } else {
                // User is NOT authenticated. Redirect to login/home.
                console.log("No user found. Redirecting...");
                window.location.href = "";
            }
        });

        // --- 2. LISTEN FOR CALLS ---
        let listenerActive = false;
        function listenForCalls() {
            if(listenerActive) return; 
            listenerActive = true;

            const callsRef = ref(db, 'calls');
            onChildAdded(callsRef, (snapshot) => {
                const call = snapshot.val();
                const callId = snapshot.key;

                // Check if call is for ME, is DIALING, and is NEW ( < 30 secs old)
                if (call.recipient === myIdentity && call.status === 'dialing') {
                    if (Date.now() - call.timestamp < 30000) {
                        
                        // RING!
                        document.getElementById('incomingCaller').innerText = `FROM: ${call.callerName || 'UNKNOWN'}`;
                        modal.style.display = 'flex';

                        document.getElementById('acceptBtn').onclick = () => {
                            update(ref(db, `calls/${callId}`), { status: 'active' });
                            window.location.href = `call.html?room=${callId}&recipient=${myIdentity}`;
                        };
                    }
                }
            });
        }

        // --- 3. MAKE CALL ---
        window.initiateCall = (targetUser) => {
            if (!myIdentity) {
                alert("Loading identity... please wait.");
                return;
            }
            if (targetUser === myIdentity) {
                alert("You cannot call yourself.");
                return;
            }

            const callRef = push(ref(db, 'calls'));
            const callId = callRef.key;

            set(callRef, {
                caller: myUid,
                callerName: myIdentity,
                recipient: targetUser,
                status: 'dialing',
                timestamp: Date.now()
            }).then(() => {
                window.location.href = `call.html?room=${callId}&recipient=${targetUser}`;
            });
        };

        // --- 4. RENDER UI ---
        async function fetchUsers() {
            const usersRef = ref(db, 'users');
            try {
                const snapshot = await get(usersRef);
                grid.innerHTML = '';
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    allUsers = Object.keys(data).map(key => ({ username: key, ...data[key] }));

                    // Determine My Identity
                    // We look for a user in the DB whose 'uid' field matches auth.currentUser.uid
                    // If your DB doesn't have UIDs inside the user object yet, this part might need adjustment.
                    const me = allUsers.find(u => u.uid === myUid);
                    
                    if (me) {
                        myIdentity = me.username;
                        statusLabel.innerText = `LOGGED IN AS: ${myIdentity}`;
                        listenForCalls();
                    } else {
                        // Fallback if user is in Auth but not in DB structure yet
                        myIdentity = auth.currentUser.email || "Unknown"; 
                        statusLabel.innerText = `LOGGED IN AS: ${myIdentity}`;
                    }

                    renderList(allUsers);
                } else {
                    grid.innerHTML = 'NO USERS FOUND';
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderList(users) {
            grid.innerHTML = '';
            
            // Sorting Logic
            users.sort((a, b) => {
                const aFounder = FOUNDERS.includes(a.username);
                const bFounder = FOUNDERS.includes(b.username);
                return (aFounder === bFounder) ? 0 : aFounder ? -1 : 1;
            });

            users.forEach(user => {
                // Don't show myself in the list? (Optional, currently showing everyone)
                
                const card = document.createElement('div');
                let roleHTML = '';
                let borderClass = '';

                if (FOUNDERS.includes(user.username)) {
                    roleHTML = '<div class="card-role role-founder">founder</div>';
                    borderClass = 'is-founder';
                }

                card.className = `user-card ${borderClass}`;
                
                const pfpSrc = user.pfp || 'https://placehold.co/100x100/111/444?text=?';
                const bioText = user.bio || 'No bio established.';

                // Removed Login As Button
                // Added check: Disable call button if it's me
                const isMe = user.username === myIdentity;
                const btnState = isMe ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : `onclick="initiateCall('${user.username}')"`;

                card.innerHTML = `
                    <img src="${pfpSrc}" class="card-pfp">
                    ${roleHTML}
                    <div class="card-name">${user.username}</div>
                    <div class="card-bio">${bioText}</div>
                    
                    <div class="btn-group">
                        <button class="action-btn btn-call" ${btnState}>CALL</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        // Filter Logic
        document.getElementById('filterInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => u.username.toLowerCase().includes(term));
            renderList(filtered);
        });
        
        // Background
        const bgs = ['IMG_4928.jpeg', 'IMG_4946.jpeg', 'IMG_4944.jpeg'];
        document.body.style.backgroundImage = `url('${bgs[Math.floor(Math.random()*bgs.length)]}')`;

    </script>
</body>
</html>
