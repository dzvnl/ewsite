<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, push, set, onChildAdded, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // --- GLOBAL STATE ---
        let myIdentity = null;
        let myUid = null;
        let allUsers = [];
        
        const FOUNDERS = ['root', '-nl', 'futtbucker67'];
        const grid = document.getElementById('userGrid');
        const statusLabel = document.getElementById('who-am-i');
        const modal = document.getElementById('incomingModal');

        // --- 1. AUTH CHECK (This was missing!) ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Authenticated as UID:", user.uid);
                myUid = user.uid;
                fetchUsers(); // <--- This starts the app!
            } else {
                console.log("No user found.");
                statusLabel.innerText = "NOT LOGGED IN";
                statusLabel.classList.add('error');
                // Uncomment the next line ONLY when you are ready to force redirects
                // window.location.href = 'index.html';
            }
        });

        // --- 2. LISTEN FOR CALLS ---
        let listenerActive = false;
        function listenForCalls() {
            if(listenerActive) return; 
            listenerActive = true;
            console.log("Call listener activated for:", myIdentity);

            const callsRef = ref(db, 'calls');
            onChildAdded(callsRef, (snapshot) => {
                const call = snapshot.val();
                const callId = snapshot.key;

                if (call.recipient === myIdentity && call.status === 'dialing') {
                    if (Date.now() - call.timestamp < 30000) {
                        document.getElementById('incomingCaller').innerText = `FROM: ${call.callerName || 'UNKNOWN'}`;
                        modal.style.display = 'flex';

                        document.getElementById('acceptBtn').onclick = () => {
                            update(ref(db, `calls/${callId}`), { status: 'active' });
                            window.location.href = `call.html?room=${callId}&recipient=${myIdentity}`;
                        };
                    }
                }
            });
        }

        // --- 3. MAKE CALL ---
        window.initiateCall = (targetUser) => {
            console.log(`Attempting to call: ${targetUser} from ${myIdentity}`);

            if (!myIdentity) {
                alert("Loading identity... please wait.");
                return;
            }
            if (targetUser === myIdentity) {
                alert("You cannot call yourself.");
                return;
            }

            const callRef = push(ref(db, 'calls'));
            const callId = callRef.key;

            set(callRef, {
                caller: myUid,
                callerName: myIdentity,
                recipient: targetUser,
                status: 'dialing',
                timestamp: Date.now()
            }).then(() => {
                window.location.href = `call.html?room=${callId}&recipient=${targetUser}`;
            });
        };

        // --- 4. FETCH USERS ---
        async function fetchUsers() {
            const usersRef = ref(db, 'users');
            
            try {
                const snapshot = await get(usersRef);
                grid.innerHTML = '';
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    allUsers = Object.keys(data).map(key => ({ username: key, ...data[key] }));
                    
                    // Identify myself
                    const me = allUsers.find(u => u.uid === myUid);
                    if (me) {
                        myIdentity = me.username;
                        statusLabel.innerText = `LOGGED IN AS: ${myIdentity}`;
                        listenForCalls();
                    } else {
                        statusLabel.innerText = "ERROR: UID NOT IN DB";
                        statusLabel.classList.add('error');
                    }
                    
                    renderList(allUsers);
                } else {
                    grid.innerHTML = '<div style="font-size: 1.5rem; color: #facc15;">DATABASE IS EMPTY</div>';
                }
            } catch (e) {
                console.error(e);
                grid.innerHTML = `
                    <div style="color: #ef4444; font-size: 1.5rem; text-align: center;">
                        PERMISSION DENIED<br>
                        <span style="font-size: 1rem; color: #fff;">Check Firebase Rules</span>
                    </div>
                `;
            }
        }

        function renderList(users) {
            grid.innerHTML = '';
            
            users.sort((a, b) => {
                const aFounder = FOUNDERS.includes(a.username);
                const bFounder = FOUNDERS.includes(b.username);
                return (aFounder === bFounder) ? 0 : aFounder ? -1 : 1;
            });

            users.forEach(user => {
                const card = document.createElement('div');
                let roleHTML = '';
                let borderClass = '';

                if (FOUNDERS.includes(user.username)) {
                    roleHTML = '<div class="card-role role-founder">founder</div>';
                    borderClass = 'is-founder';
                }

                card.className = `user-card ${borderClass}`;
                
                const pfpSrc = user.pfp ? user.pfp : 'https://placehold.co/100x100/111/444?text=?';
                const bioText = user.bio || 'No bio established.';
                const isMe = user.username === myIdentity;
                const btnState = isMe ? 'disabled' : `onclick="initiateCall('${user.username}')"`;

                card.innerHTML = `
                    <img src="${pfpSrc}" class="card-pfp" onerror="this.src='https://placehold.co/100x100/111/444?text=ERROR'">
                    ${roleHTML}
                    <div class="card-name">${user.username}</div>
                    <div class="card-bio">${bioText}</div>
                    <div class="btn-group">
                        <button class="action-btn btn-call" ${btnState}>
                            ${isMe ? 'YOU' : 'CALL'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        // Filter Logic
        document.getElementById('filterInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => u.username.toLowerCase().includes(term));
            renderList(filtered);
        });
        
        // Background
        const bgs = ['IMG_4928.jpeg', 'IMG_4946.jpeg', 'IMG_4944.jpeg'];
        document.body.style.backgroundImage = `url('${bgs[Math.floor(Math.random()*bgs.length)]}')`;

    </script>
