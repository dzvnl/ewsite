<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* --- DEBUG PANEL (visible for troubleshooting) --- */
        #debugPanel {
            position: fixed; top: 0; left: 0; width: 100%;
            background: #222; border-bottom: 1px solid #444;
            color: #0f0; font-size: 1rem; padding: 5px; z-index: 10000;
            display: flex; gap: 20px; font-family: monospace;
        }

        /* --- HEADER --- */
        .header-container {
            width: 100%; max-width: 900px; margin: 40px auto 30px auto;
            border-bottom: 2px solid #333; padding-bottom: 10px;
            display: flex; justify-content: space-between; align-items: end;
        }
        h1 { font-size: 3rem; color: #facc15; margin: 0; line-height: 1; }

        /* --- GRID --- */
        .user-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; width: 100%; max-width: 900px; margin: 0 auto;
        }
        .user-card {
            background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 15px;
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        .user-card:hover { border-color: #facc15; transform: translateY(-2px); }
        .card-pfp { width: 80px; height: 80px; object-fit: cover; border: 1px solid #555; background: #000; margin-bottom: 10px; }
        .card-name { font-size: 1.5rem; color: #fff; margin-bottom: 5px; }

        .call-btn {
            background: #166534; border: 1px solid #22c55e; color: #fff;
            padding: 5px 15px; font-size: 1.2rem; cursor: pointer; margin-top: auto;
            display: flex; align-items: center; gap: 5px;
        }
        .call-btn:hover { background: #22c55e; color: #000; }

        /* --- CALL MODAL --- */
        #callModal { z-index: 9999; }
        
        /* --- INCOMING CALL POPUP --- */
        #incomingCallPopup { z-index: 9998; }
        .popup-box {
            background: #1f2937; border: 2px solid #facc15; padding: 30px;
            text-align: center; border-radius: 10px; box-shadow: 0 0 50px rgba(250, 204, 21, 0.5);
        }
    </style>
</head>
<body>

    <div id="debugPanel">
        <span>MY ID: <b id="debugId" class="text-white">...</b></span>
        <span>STATUS: <b id="debugStatus">Connecting...</b></span>
        <button onclick="window.testSelfCall()" class="ml-auto bg-gray-700 px-2 text-white border border-gray-500 hover:bg-gray-600">TEST ALERT</button>
    </div>

    <div id="callModal" class="hidden fixed inset-0 bg-black flex flex-col items-center justify-center">
        <div class="absolute top-10 left-10 z-20">
            <h2 class="text-3xl text-yellow-400">CALLING: <span id="callingName" class="text-white">...</span></h2>
            <div id="connectionStatus" class="text-xl text-gray-400">Initializing...</div>
        </div>
        
        <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline></video>
        
        <div class="absolute bottom-5 right-5 z-20 w-48 h-64 bg-black border-2 border-yellow-400">
            <video id="localVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
        </div>

        <button onclick="endCall()" class="absolute bottom-10 z-30 bg-red-600 text-white rounded-full p-6 shadow-xl border-2 border-red-400">
            HANG UP
        </button>
    </div>

    <div id="incomingCallPopup" class="hidden fixed inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center">
        <div class="popup-box">
            <h2 class="text-3xl text-white mb-2">INCOMING CALL</h2>
            <p class="text-xl text-yellow-400 mb-8">From: <span id="incomingCallerName">...</span></p>
            <div class="flex justify-center gap-4">
                <button onclick="answerCall()" class="bg-green-600 text-white px-8 py-3 text-xl rounded border border-green-400 hover:bg-green-500">ANSWER</button>
                <button onclick="rejectCall()" class="bg-red-600 text-white px-8 py-3 text-xl rounded border border-red-400 hover:bg-red-500">REJECT</button>
            </div>
        </div>
    </div>

    <a href="index.html" class="block w-full max-w-[900px] mx-auto mt-12 text-gray-500 hover:text-yellow-400"><< RETURN_HOME</a>

    <div class="header-container">
        <h1>users</h1>
    </div>

    <div id="userGrid" class="user-grid">
        <div class="text-center text-gray-500">Loading users...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GLOBAL VARIABLES ---
        let myUsername = localStorage.getItem('chat_username');
        let localStream = null;
        let peerConnection = null;
        let currentCallPath = null;

        // Force lowercase to prevent matching errors
        if(myUsername) myUsername = myUsername.toLowerCase().trim();

        // 1. LOGIN & SETUP
        if (!myUsername) {
            let rawUser = prompt("Enter your username to receive calls:");
            if (rawUser) {
                myUsername = rawUser.toLowerCase().trim();
                localStorage.setItem('chat_username', myUsername);
            } else {
                myUsername = "guest_" + Math.floor(Math.random() * 1000);
            }
        }

        // Update Debug Panel
        document.getElementById('debugId').innerText = myUsername;
        document.getElementById('debugStatus').innerText = "Connecting to DB...";

        // 2. LISTEN FOR CALLS (The Critical Part)
        const myCallRef = ref(db, 'calls/' + myUsername);
        
        onValue(myCallRef, (snapshot) => {
            document.getElementById('debugStatus').innerText = "Online & Listening";
            const data = snapshot.val();

            if (data && data.offer && !data.answer) {
                // We have a new call!
                console.log("INCOMING CALL DATA:", data);
                document.getElementById('incomingCallerName').innerText = data.from;
                currentCallPath = 'calls/' + myUsername; 
                document.getElementById('incomingCallPopup').classList.remove('hidden');
            } else if (!data) {
                // Call ended or reset
                document.getElementById('incomingCallPopup').classList.add('hidden');
            }
        }, (error) => {
            console.error("FIREBASE ERROR:", error);
            document.getElementById('debugStatus').innerText = "DB ERROR (Check Console)";
            document.getElementById('debugStatus').style.color = "red";
        });

        // 3. WEBRTC SETUP (STUN SERVERS)
        const servers = {
            iceServers: [
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        async function createPeerConnection() {
            peerConnection = new RTCPeerConnection(servers);

            // Debug Connection State
            peerConnection.onconnectionstatechange = () => {
                document.getElementById('connectionStatus').innerText = "State: " + peerConnection.connectionState;
            };

            // Get Media
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            } catch(e) {
                alert("Could not access camera. Ensure HTTPS is used.");
            }

            // Handle Remote Stream
            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            return peerConnection;
        }

        // 4. START CALL (Caller)
        window.startCall = async (targetUser) => {
            targetUser = targetUser.toLowerCase().trim(); // Normalize target
            if (targetUser === myUsername) return alert("Cannot call yourself.");

            document.getElementById('callingName').innerText = targetUser;
            document.getElementById('callModal').classList.remove('hidden');
            
            currentCallPath = 'calls/' + targetUser;

            await createPeerConnection();

            // Wait for ALL ICE candidates (simplest way to ensure connection works)
            peerConnection.onicecandidate = (event) => {
                if (event.candidate === null) {
                    // Send Offer to Firebase
                    set(ref(db, currentCallPath), {
                        offer: JSON.stringify(peerConnection.localDescription),
                        from: myUsername
                    });
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // Listen for Answer
            onValue(ref(db, currentCallPath), async (snapshot) => {
                const data = snapshot.val();
                if (data && data.answer && !peerConnection.currentRemoteDescription) {
                    const answerDesc = new RTCSessionDescription(JSON.parse(data.answer));
                    await peerConnection.setRemoteDescription(answerDesc);
                }
            });
        };

        // 5. ANSWER CALL (Receiver)
        window.answerCall = async () => {
            document.getElementById('incomingCallPopup').classList.add('hidden');
            document.getElementById('callModal').classList.remove('hidden');
            document.getElementById('callingName').innerText = document.getElementById('incomingCallerName').innerText;

            const snapshot = await get(ref(db, currentCallPath));
            const data = snapshot.val();

            await createPeerConnection();

            peerConnection.onicecandidate = (event) => {
                if (event.candidate === null) {
                    // Send Answer
                    update(ref(db, currentCallPath), {
                        answer: JSON.stringify(peerConnection.localDescription)
                    });
                }
            };

            const offerDesc = new RTCSessionDescription(JSON.parse(data.offer));
            await peerConnection.setRemoteDescription(offerDesc);

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
        };

        window.rejectCall = () => {
            document.getElementById('incomingCallPopup').classList.add('hidden');
            if(currentCallPath) remove(ref(db, currentCallPath));
        };

        window.endCall = () => {
            document.getElementById('callModal').classList.add('hidden');
            if(localStream) localStream.getTracks().forEach(track => track.stop());
            if(peerConnection) peerConnection.close();
            if(currentCallPath) remove(ref(db, currentCallPath));
            window.location.reload();
        };

        // DEBUG TOOL
        window.testSelfCall = () => {
            document.getElementById('incomingCallerName').innerText = "TEST_SYSTEM";
            document.getElementById('incomingCallPopup').classList.remove('hidden');
        };

        // --- FETCH USERS ---
        async function fetchUsers() {
            const usersRef = ref(db, 'users');
            try {
                const snapshot = await get(usersRef);
                const grid = document.getElementById('userGrid');
                grid.innerHTML = ''; 
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const users = Object.keys(data).map(key => ({ username: key, ...data[key] }));
                    
                    users.forEach(user => {
                        const card = document.createElement('div');
                        card.className = "user-card";
                        card.innerHTML = `
                            <img src="${user.pfp || 'https://placehold.co/100'}" class="card-pfp">
                            <div class="card-name">${user.username}</div>
                            <button class="call-btn" onclick="window.startCall('${user.username}')">CALL</button>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (error) {
                console.error(error);
            }
        }
        fetchUsers();
    </script>
</body>
</html>
