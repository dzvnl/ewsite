<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #22c55e;
            --neon-yellow: #facc15;
            --neon-red: #ef4444;
            --neon-purple: #c084fc;
            --bg-overlay: rgba(10, 10, 10, 0.95);
        }

        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000; /* Pure black background */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Scanline effect */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .header-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 30px auto;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { font-size: 3rem; color: var(--neon-yellow); margin: 0; line-height: 1; text-shadow: 0 0 10px rgba(250, 204, 21, 0.3); }

        .status-bar {
            font-size: 1.5rem;
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
            margin-top: 5px;
        }
        .status-bar.error { color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }

        .filter-input {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            font-family: 'VT323';
            font-size: 1.5rem;
            padding: 5px 10px;
            width: 100%;
            max-width: 250px;
        }
        .filter-input:focus { outline: none; border-color: var(--neon-yellow); box-shadow: 0 0 8px var(--neon-yellow); }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .user-card {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
            position: relative; 
            overflow: hidden;
        }
        .user-card:hover { border-color: var(--neon-yellow); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(250, 204, 21, 0.1); }
        .user-card.is-founder { border-color: var(--neon-purple); box-shadow: 0 0 5px rgba(192, 132, 252, 0.2); }
        .user-card.is-me { border-color: var(--neon-green); }

        .card-pfp { width: 80px; height: 80px; object-fit: cover; border: 1px solid #555; margin-bottom: 10px; background: #000; }
        .card-name { font-size: 1.5rem; color: #fff; margin-bottom: 5px; text-align: center; word-break: break-all; }
        .card-bio { font-size: 1rem; color: #aaa; text-align: center; margin-bottom: 10px; min-height: 1.2em; }
        
        .card-role { font-size: 1rem; text-transform: uppercase; padding: 0 5px; margin-bottom: 5px; }
        .role-founder { color: var(--neon-purple); border: 1px solid var(--neon-purple); }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: auto;
            width: 100%;
            justify-content: center;
        }
        
        .action-btn {
            font-family: 'VT323';
            font-size: 1.2rem;
            padding: 5px 10px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            width: 100%;
            transition: 0.2s;
        }

        .btn-call { background: var(--neon-green); color: #000; }
        .btn-call:hover { background: #4ade80; box-shadow: 0 0 10px var(--neon-green); }
        
        .btn-call.disabled { 
            background: #333; 
            color: #666; 
            cursor: not-allowed; 
            box-shadow: none;
        }

        .nav-back { display: block; width: 100%; max-width: 900px; margin: 20px auto; color: #666; text-decoration: none; font-size: 1.2rem; }
        .nav-back:hover { color: var(--neon-yellow); }

        #resetIdentity {
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.8em;
            color: #666;
            margin-left: 10px;
        }
        #resetIdentity:hover { color: #fff; }

        /* --- INCOMING CALL MODAL --- */
        #incomingModal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .incoming-box {
            background: #111;
            border: 2px solid var(--neon-green);
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.2);
            animation: shake 0.5s infinite;
            max-width: 90%;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }
        .accept-btn {
            background: var(--neon-green); color: #000;
            font-family: 'VT323'; font-size: 2rem;
            padding: 10px 40px; border: none; cursor: pointer; margin-top: 20px;
        }
        .accept-btn:hover { background: #fff; box-shadow: 0 0 20px #fff; }

    </style>
</head>
<body>

    <a href="index.html" class="nav-back"><< RETURN_HOME</a>

    <div class="header-container">
        <div>
            <h1>users_directory</h1>
            <div class="status-bar">
                <span id="who-am-i">INITIALIZING...</span>
                <span id="resetIdentity">[CHANGE]</span>
            </div>
        </div>
        <input type="text" id="filterInput" class="filter-input" placeholder="> Search users...">
    </div>

    <div id="userGrid" class="user-grid">
        <div style="font-size: 1.5rem; color: #666;">> Fetching database...</div>
    </div>

    <div id="incomingModal">
        <div class="incoming-box">
            <div style="font-size: 3rem; color: #22c55e;">INCOMING SIGNAL</div>
            <div id="incomingCaller" style="font-size: 1.5rem; color: #fff; margin-top: 10px;">UNKNOWN</div>
            <button id="acceptBtn" class="accept-btn">ACCEPT CONNECTION</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, push, set, onChildAdded, update, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
        // Removed Auth imports as requested

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GLOBAL STATE ---
        let myIdentity = null;
        let myUid = null;
        let allUsers = [];
        const FOUNDERS = ['root', '-nl', 'futtbucker67'];
        
        // Grab elements
        const grid = document.getElementById('userGrid');
        const statusLabel = document.getElementById('who-am-i');
        const resetBtn = document.getElementById('resetIdentity');
        const filterInput = document.getElementById('filterInput');
        const modal = document.getElementById('incomingModal');

        // --- 1. IDENTITY SETUP (NO AUTH) ---
        function setupIdentity() {
            // Check if we have a stored name
            let storedName = localStorage.getItem('chat_identity');
            
            if (!storedName) {
                // Ask user for name since they aren't logging in
                storedName = prompt("ENTER YOUR HANDLE / USERNAME:") || `Guest_${Math.floor(Math.random() * 1000)}`;
                // Remove spaces and special chars to avoid logic issues
                storedName = storedName.replace(/[^a-zA-Z0-9_-]/g, "");
                if(storedName.length === 0) storedName = `Guest_${Math.floor(Math.random() * 1000)}`;
                localStorage.setItem('chat_identity', storedName);
            }

            myIdentity = storedName;
            // Generate a fake UID for this session
            myUid = `anon_${myIdentity}`;

            statusLabel.innerText = `ID: ${myIdentity}`;
            console.log(`Operating as: ${myIdentity}`);
            
            // Start App
            fetchUsers();
            listenForCalls();
        }

        // Allow changing name
        resetBtn.addEventListener('click', () => {
            localStorage.removeItem('chat_identity');
            location.reload();
        });

        // --- 2. LISTEN FOR CALLS ---
        let listenerActive = false;
        function listenForCalls() {
            if(listenerActive) return; 
            listenerActive = true;

            // Listen to last 10 calls
            const callsRef = query(ref(db, 'calls'), limitToLast(10));

            onChildAdded(callsRef, (snapshot) => {
                const call = snapshot.val();
                const callId = snapshot.key;

                // Check if call is for me
                if (call.recipient === myIdentity && call.status === 'dialing') {
                    const timeDiff = Date.now() - call.timestamp;
                    if (timeDiff < 30000) { // 30 sec timeout
                        document.getElementById('incomingCaller').innerText = `FROM: ${call.callerName || 'UNKNOWN'}`;
                        modal.style.display = 'flex';

                        // Handle Acceptance
                        const acceptBtn = document.getElementById('acceptBtn');
                        acceptBtn.onclick = () => {
                            update(ref(db, `calls/${callId}`), { status: 'active' });
                            window.location.href = `call.html?room=${callId}&recipient=${myIdentity}`;
                        };
                    }
                }
            });
        }

        // --- 3. MAKE CALL LOGIC ---
        async function initiateCall(targetUser) {
            console.log(`Calling ${targetUser} as ${myIdentity}`);

            if (targetUser === myIdentity) return;

            const callRef = push(ref(db, 'calls'));
            const callId = callRef.key;

            try {
                await set(callRef, {
                    caller: myUid,
                    callerName: myIdentity,
                    recipient: targetUser,
                    status: 'dialing',
                    timestamp: Date.now()
                });
                window.location.href = `call.html?room=${callId}&recipient=${targetUser}`;
            } catch (error) {
                console.error("Call failed:", error);
                alert("Connection failed. (Check Firebase Rules: Must allow write without auth)");
            }
        };

        // --- 4. FETCH USERS ---
        async function fetchUsers() {
            const usersRef = ref(db, 'users');
            
            try {
                const snapshot = await get(usersRef);
                grid.innerHTML = '';
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    allUsers = Object.keys(data).map(key => ({ username: key, ...data[key] }));
                    renderList(allUsers);
                } else {
                    grid.innerHTML = '<div style="font-size: 1.5rem; color: #facc15;">DATABASE EMPTY</div>';
                }
            } catch (e) {
                console.error(e);
                grid.innerHTML = `
                    <div style="color: #ef4444; font-size: 1.5rem; text-align: center; grid-column: 1/-1;">
                        READ ERROR<br>
                        <span style="font-size: 1rem; color: #fff;">Firebase Rules must allow Public Read</span>
                    </div>
                `;
            }
        }

        // Security: Prevent XSS
        function sanitize(str) {
            if(!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderList(users) {
            if(!grid) return;
            grid.innerHTML = '';
            
            users.sort((a, b) => {
                const aFounder = FOUNDERS.includes(a.username);
                const bFounder = FOUNDERS.includes(b.username);
                return (aFounder === bFounder) ? 0 : aFounder ? -1 : 1;
            });

            users.forEach(user => {
                const card = document.createElement('div');
                let roleHTML = '';
                let borderClass = '';

                if (FOUNDERS.includes(user.username)) {
                    roleHTML = '<div class="card-role role-founder">founder</div>';
                    borderClass += ' is-founder';
                }
                if (user.username === myIdentity) {
                    borderClass += ' is-me';
                }

                card.className = `user-card ${borderClass}`;
                
                const pfpSrc = user.pfp ? sanitize(user.pfp) : 'https://placehold.co/100x100/111/444?text=?';
                const bioText = user.bio ? sanitize(user.bio) : 'No bio established.';
                const safeName = sanitize(user.username);
                const isMe = user.username === myIdentity;
                
                // Button Logic
                const btnClass = isMe ? 'action-btn btn-call disabled' : 'action-btn btn-call call-trigger';
                const btnText = isMe ? 'YOU' : 'INITIATE CALL';
                const dataAttr = isMe ? '' : `data-user="${safeName}"`;

                card.innerHTML = `
                    <img src="${pfpSrc}" class="card-pfp" onerror="this.src='https://placehold.co/100x100/111/444?text=ERR'">
                    ${roleHTML}
                    <div class="card-name">${safeName}</div>
                    <div class="card-bio">${bioText}</div>
                    <div class="btn-group">
                        <button class="${btnClass}" ${dataAttr}>
                            ${btnText}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        // Event Delegation
        grid.addEventListener('click', (e) => {
            if (e.target.classList.contains('call-trigger')) {
                const targetUser = e.target.getAttribute('data-user');
                if (targetUser) {
                    initiateCall(targetUser);
                }
            }
        });
        
        // Filter Logic
        if(filterInput) {
            filterInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allUsers.filter(u => u.username.toLowerCase().includes(term));
                renderList(filtered);
            });
        }

        // Initialize
        setupIdentity();

    </script>
</body>
</html>
