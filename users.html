<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* --- HEADER --- */
        .header-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 30px auto;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        h1 {
            font-size: 3rem;
            color: #facc15;
            line-height: 1;
            margin: 0;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
        }

        /* --- SEARCH --- */
        .filter-input {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            font-family: 'VT323';
            font-size: 1.5rem;
            padding: 5px 10px;
            width: 250px;
        }
        .filter-input:focus { outline: none; border-color: #facc15; }

        /* --- GRID LAYOUT --- */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* --- USER CARD --- */
        .user-card {
            background: rgba(0,0,0,0.8);
            border: 1px solid #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            border-color: #facc15;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        /* Special borders for roles */
        .user-card.is-founder { border-color: #c084fc; }
        .user-card.is-founder:hover { box-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }
        
        .user-card.is-admin { border-color: #ef4444; }

        .card-pfp {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid #555;
            margin-bottom: 10px;
            background: #000;
        }

        .card-name {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 5px;
            word-break: break-all;
            text-align: center;
        }

        .card-role {
            font-size: 1rem;
            text-transform: uppercase;
            padding: 0 5px;
            margin-bottom: 5px;
        }
        .role-founder { color: #c084fc; border: 1px solid #c084fc; }
        .role-admin { color: #ef4444; border: 1px solid #ef4444; }

        .card-bio {
            color: #888;
            font-size: 1rem;
            text-align: center;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Limit to 2 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        /* Call Button Style */
        .call-btn {
            background: #166534; /* Green */
            border: 1px solid #22c55e;
            color: #fff;
            padding: 5px 15px;
            font-family: 'VT323';
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: auto; /* Push to bottom */
            transition: 0.2s;
        }
        .call-btn:hover { background: #22c55e; color: #000; box-shadow: 0 0 10px #22c55e; }

        .nav-back {
            display: block;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            color: #666;
            text-decoration: none;
            font-size: 1.2rem;
        }
        .nav-back:hover { color: #facc15; }
        
        #loading-text { font-size: 1.5rem; color: #666; text-align: center; width: 100%; }

        /* Video Call Modal Styles */
        #callModal {
            /* Tailwind handles most logic, but we ensure z-index here */
            z-index: 9999;
        }
        
        .video-overlay-text {
            text-shadow: 2px 2px 0px #000;
        }

    </style>
</head>
<body>

    <div id="callModal" class="hidden fixed inset-0 bg-black flex flex-col items-center justify-center">
        
        <div class="absolute top-5 left-5 z-20">
            <h2 class="text-3xl text-yellow-400 video-overlay-text">CALLING: <span id="callingName" class="text-white">...</span></h2>
            <div class="text-xl text-gray-400 video-overlay-text animate-pulse">Connecting...</div>
        </div>

        <div class="relative w-full h-full bg-gray-900 flex items-center justify-center">
            <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline></video>
            <div id="remotePlaceholder" class="absolute text-gray-600 text-2xl">WAITING FOR ANSWER...</div>
        </div>

        <div class="absolute bottom-5 right-5 z-20 w-48 h-64 bg-black border-2 border-yellow-400 shadow-2xl">
            <video id="localVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
            <div class="absolute bottom-0 left-0 w-full bg-black bg-opacity-50 text-center text-white text-sm">YOU</div>
        </div>

        <button onclick="endCall()" class="absolute bottom-10 z-30 bg-red-600 hover:bg-red-500 text-white rounded-full p-6 shadow-xl border-2 border-red-400 transition transform hover:scale-110">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L9.91 8.09"/></svg>
        </button>
    </div>

    <a href="index.html" class="nav-back"><< RETURN_HOME</a>

    <div class="header-container">
        <h1>users</h1>
        <input type="text" id="filterInput" class="filter-input" placeholder="Filter users..." onkeyup="filterUsers()">
    </div>

    <div id="userGrid" class="user-grid">
        <div id="loading-text">fetching...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- ROLES ---
        const FOUNDERS = ['root', '-nl', 'futtbucker67']; 
        const ADMINS = ['root', 'fb67', '-nl'];

        const grid = document.getElementById('userGrid');
        let allUsers = []; 

        // Set background randomly
        const bgs = ['IMG_4928.jpeg', 'IMG_4946.jpeg', 'IMG_4944.jpeg'];
        document.body.style.backgroundImage = `url('${bgs[Math.floor(Math.random()*bgs.length)]}')`;

        // --- CALL FUNCTIONS ---
        let localStream = null;

        window.startCall = async (username) => {
            const modal = document.getElementById('callModal');
            const nameLabel = document.getElementById('callingName');
            const localVideo = document.getElementById('localVideo');
            
            nameLabel.innerText = username;
            modal.classList.remove('hidden'); // Show Overlay

            try {
                // Request Camera & Mic
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                
                // Note: Since this is a client-only file, we cannot actually "Connect" to the other user 
                // without a WebRTC signaling server. The "Remote" screen will remain waiting.
                
            } catch (err) {
                console.error("Error accessing media devices.", err);
                alert("Could not access camera/microphone. Please allow permissions.");
                window.endCall();
            }
        };

        window.endCall = () => {
            const modal = document.getElementById('callModal');
            modal.classList.add('hidden'); // Hide Overlay

            // Stop Camera
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('localVideo').srcObject = null;
        };


        // --- FETCH USERS ---
        async function fetchUsers() {
            const usersRef = ref(db, 'users');
            try {
                const snapshot = await get(usersRef);
                grid.innerHTML = ''; 

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    allUsers = Object.keys(data).map(key => {
                        return { username: key, ...data[key] };
                    });

                    renderList(allUsers);
                } else {
                    grid.innerHTML = '<div style="color:#ef4444">NO DATA FOUND</div>';
                }
            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div style="color:#ef4444">CONNECTION ERROR</div>';
            }
        }

        function renderList(users) {
            grid.innerHTML = '';
            
            users.sort((a, b) => {
                const aFounder = FOUNDERS.includes(a.username);
                const bFounder = FOUNDERS.includes(b.username);
                if (aFounder && !bFounder) return -1;
                if (!aFounder && bFounder) return 1;
                return 0;
            });

            users.forEach(user => {
                const card = document.createElement('div');
                
                let roleHTML = '';
                let borderClass = '';

                if (FOUNDERS.includes(user.username)) {
                    roleHTML = '<div class="card-role role-founder">founder</div>';
                    borderClass = 'is-founder';
                } else if (ADMINS.includes(user.username)) {
                    roleHTML = '<div class="card-role role-admin">admin</div>';
                    borderClass = 'is-admin';
                }

                card.className = `user-card ${borderClass}`;
                
                // NAVIGATE ONLY IF CLICKING THE CARD BG, NOT BUTTONS
                card.onclick = (e) => {
                    // If we clicked the call button, do nothing (handled by button onclick)
                    if(e.target.closest('.call-btn')) return;
                    window.location.href = `account.html?user=${user.username}`;
                };

                const pfpSrc = user.pfp ? user.pfp : 'https://placehold.co/100x100/111/444?text=?';
                const bioText = user.bio ? user.bio : 'No bio established.';

                card.innerHTML = `
                    <img src="${pfpSrc}" class="card-pfp" alt="${user.username}">
                    ${roleHTML}
                    <div class="card-name">${user.username}</div>
                    <div class="card-bio">${bioText}</div>
                    
                    <button class="call-btn" onclick="window.startCall('${user.username}')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        CALL
                    </button>
                `;

                grid.appendChild(card);
            });
        }

        window.filterUsers = () => {
            const input = document.getElementById('filterInput').value.toLowerCase();
            const filtered = allUsers.filter(user => user.username.toLowerCase().includes(input));
            renderList(filtered);
        };

        fetchUsers();

    </script>
</body>
</html>
