<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settings // system</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #e5e5e5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fallback dark gray + Image */
            background: #111 url('IMG_4928.jpeg') no-repeat center center fixed; 
            background-size: cover;
            overflow: hidden;
            margin: 0;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: -1;
        }

        .settings-panel {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #444;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden; 
            border-radius: 4px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        h2 { font-size: 2rem; margin: 0; color: #facc15; text-shadow: 0 0 5px #facc15; }

        /* --- ADMIN TOGGLE BUTTON (+) --- */
        .admin-toggle {
            cursor: pointer; 
            font-size: 1.5rem; 
            color: #333; 
            user-select: none;
            transition: color 0.3s;
            display: none; /* Hidden by default */
        }
        /* JS adds this class if isAdmin is true */
        .admin-toggle.visible { display: block; }
        .admin-toggle:hover { color: #f87171; text-shadow: 0 0 5px red; }

        .preview-container { text-align: center; margin-bottom: 20px; }
        .pfp-preview {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid #444; object-fit: cover;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; color: #888; margin-bottom: 5px; font-size: 1.1rem; }
        
        input[type="text"], textarea {
            width: 100%; background: #000; border: 1px solid #333;
            color: #fff; padding: 8px; font-family: 'VT323', monospace;
            font-size: 1.2rem; outline: none;
        }
        input[type="text"]:focus, textarea:focus { border-color: #facc15; }

        input[type="file"] { display: none; }
        .file-upload-btn {
            display: block; width: 100%; text-align: center;
            border: 1px dashed #444; padding: 10px; cursor: pointer;
            color: #666; transition: 0.2s;
        }
        .file-upload-btn:hover { border-color: #888; color: #aaa; }

        .btn-row { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        button {
            flex: 1; padding: 10px; font-family: 'VT323', monospace;
            font-size: 1.3rem; border: none; cursor: pointer;
            text-transform: uppercase;
        }
        .btn-cancel { background: #222; color: #888; }
        .btn-cancel:hover { background: #333; color: #fff; }
        
        #btn-save { background: #facc15; color: #000; font-weight: bold; }
        #btn-save:hover { background: #eab308; box-shadow: 0 0 10px #eab308; }

        .status-msg { text-align: center; margin-top: 15px; font-size: 1.2rem; height: 1.5rem; }
        .status-msg.success { color: #4ade80; }
        .status-msg.error { color: #f87171; }

        /* --- ADMIN PANEL SLIDER --- */
        .admin-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 50; padding: 30px;
            transform: translateY(100%); transition: transform 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        .admin-panel.open { transform: translateY(0); }
        
        .admin-title { color: #f87171; text-shadow: 0 0 5px red; margin-bottom: 10px; }
        
        .user-list {
            flex-grow: 1; overflow-y: auto; border: 1px solid #333;
            margin-bottom: 15px; padding: 5px;
        }
        .user-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; border-bottom: 1px solid #222;
        }
        
        /* Ban/Unban Buttons */
        .action-btn {
            padding: 2px 8px; font-size: 1rem; flex: 0;
            border: 1px solid; cursor: pointer;
        }
        .btn-ban {
            background: #440000; color: #f87171; border-color: #660000;
        }
        .btn-ban:hover { background: red; color: white; }

        .btn-unban {
            background: #004400; color: #4ade80; border-color: #006600;
        }
        .btn-unban:hover { background: #00aa00; color: white; }

        /* --- BAN SCREEN OVERLAY --- */
        #ban-screen {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: red;
        }
        .ban-glitch { font-size: 4rem; text-shadow: 2px 2px 0px white; animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="ban-screen">
        <h1 class="ban-glitch">CRITICAL ERROR</h1>
        <p>ACCESS PERMANENTLY REVOKED</p>
    </div>

    <div class="settings-panel">
        
        <div class="title-row">
            <h2>settings</h2>
            <div id="btn-admin-open" class="admin-toggle" title="Admin Control">+</div>
        </div>

        <div class="preview-container">
            <img id="img-preview" src="https://via.placeholder.com/100" class="pfp-preview">
        </div>

        <div class="form-group">
            <label>username</label>
            <input type="text" id="inp-username" maxlength="15">
        </div>

        <div class="form-group">
            <label>bio</label>
            <textarea id="inp-bio" rows="2" maxlength="100"></textarea>
        </div>

        <div class="form-group">
            <label>profile picture</label>
            <label for="inp-file" class="file-upload-btn">
                [ click to upload photo ]
            </label>
            <input type="file" id="inp-file" accept="image/*">
        </div>

        <div class="btn-row">
            <button class="btn-cancel" id="btn-back">back</button>
            <button id="btn-save">save</button>
        </div>

        <div id="status" class="status-msg">connecting...</div>

        <div id="admin-panel" class="admin-panel">
            <h2 class="admin-title">ADMIN CONTROL</h2>
            <p style="color:#666; margin-bottom:10px;">Select user to manage:</p>
            
            <div id="user-list-container" class="user-list">
                <div style="text-align:center; color:#555">loading...</div>
            </div>

            <div class="btn-row">
                <button class="btn-cancel" id="btn-admin-close">close</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // --- DOM Elements ---
        const statusDiv = document.getElementById('status');
        const inpUsername = document.getElementById('inp-username');
        const inpBio = document.getElementById('inp-bio');
        const imgPreview = document.getElementById('img-preview');
        const inpFile = document.getElementById('inp-file');

        let currentName = localStorage.getItem('username');
        let finalPfpString = "";
        
        if(!currentName) {
            currentName = "Guest"; 
            // window.location.href = 'login.html'; // Uncomment to lock
        }

        // --- 1. LOAD CURRENT USER ---
        statusDiv.innerText = "loading user...";
        
        onValue(ref(db, 'users/' + currentName), (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                statusDiv.innerText = "ready (new user)";
                return;
            }

            // 1a. Check if *YOU* are banned
            if (data.banned === true) {
                document.getElementById('ban-screen').style.display = 'flex';
                return;
            }

            // 1b. Check if *YOU* are Admin (Shows the + Button)
            if (data.isAdmin === true) {
                document.getElementById('btn-admin-open').classList.add('visible');
            }

            // 1c. Populate Settings Form
            if(inpUsername.value === "") {
                inpUsername.value = data.username || currentName;
                inpBio.value = data.bio || "";
                if (data.pfp) {
                    finalPfpString = data.pfp;
                    imgPreview.src = data.pfp;
                }
            }
            statusDiv.innerText = "";
        }, (error) => {
            console.error(error);
            statusDiv.innerText = "connection error";
            statusDiv.className = "status-msg error";
        });

        // --- 2. SETTINGS BUTTON LISTENERS ---
        
        document.getElementById('btn-back').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        document.getElementById('btn-save').addEventListener('click', async () => {
            const newName = inpUsername.value.trim();
            const newBio = inpBio.value;
            const newPfp = finalPfpString;

            if(!newName) return;
            statusDiv.innerText = "SAVING...";
            statusDiv.className = "status-msg";

            try {
                // Name Update Logic
                if(newName === currentName) {
                    await update(ref(db, 'users/' + currentName), { bio: newBio, pfp: newPfp });
                    statusDiv.innerText = "UPDATED.";
                    statusDiv.className = "status-msg success";
                    setTimeout(() => window.location.href = 'index.html', 1000);
                    return;
                }

                // Name Change Logic
                const newNameRef = ref(db, 'users/' + newName);
                if((await get(newNameRef)).exists()) {
                    statusDiv.innerText = "NAME TAKEN";
                    statusDiv.className = "status-msg error";
                    return;
                }

                const oldSnap = await get(ref(db, 'users/' + currentName));
                const newData = { ...oldSnap.val(), username: newName, bio: newBio, pfp: newPfp };
                
                const updates = {};
                updates['users/' + newName] = newData;
                updates['users/' + currentName] = null;

                await update(ref(db), updates);
                localStorage.setItem('username', newName);
                
                statusDiv.innerText = "NAME CHANGED!";
                statusDiv.className = "status-msg success";
                setTimeout(() => window.location.href = 'index.html', 1500);

            } catch(e) {
                statusDiv.innerText = "ERROR: " + e.message;
                statusDiv.className = "status-msg error";
            }
        });

        inpFile.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                if(file.size > 200000) { 
                    alert("Image too big! Max 200KB."); 
                    return; 
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    finalPfpString = e.target.result;
                    imgPreview.src = finalPfpString;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- 3. ADMIN PANEL LOGIC (Ban/Unban) ---

        document.getElementById('btn-admin-open').addEventListener('click', () => {
            document.getElementById('admin-panel').classList.add('open');
            loadAllUsers();
        });

        document.getElementById('btn-admin-close').addEventListener('click', () => {
            document.getElementById('admin-panel').classList.remove('open');
        });

        async function loadAllUsers() {
            const listDiv = document.getElementById('user-list-container');
            listDiv.innerHTML = '<div style="text-align:center; color:#555">fetching...</div>';

            const snapshot = await get(ref(db, 'users'));
            listDiv.innerHTML = ''; 

            if(snapshot.exists()) {
                const users = snapshot.val();
                
                Object.values(users).forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'user-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.innerText = user.username;
                    if(user.isAdmin) nameSpan.style.color = "#facc15"; 

                    const actionBtn = document.createElement('button');
                    actionBtn.className = 'action-btn';

                    // Self-Protection
                    if(user.username === currentName) {
                        actionBtn.innerText = "ME";
                        actionBtn.disabled = true;
                        actionBtn.style.opacity = "0.3";
                        actionBtn.style.border = "none";
                    } else {
                        // Check if they are ALREADY banned
                        if (user.banned === true) {
                            // SHOW UNBAN BUTTON
                            actionBtn.innerText = "UNBAN";
                            actionBtn.classList.add('btn-unban');
                            actionBtn.addEventListener('click', async () => {
                                if(confirm(`Restore access for ${user.username}?`)) {
                                    await update(ref(db, 'users/' + user.username), { banned: false });
                                    loadAllUsers(); // Refresh
                                }
                            });
                        } else {
                            // SHOW BAN BUTTON
                            actionBtn.innerText = "BAN";
                            actionBtn.classList.add('btn-ban');
                            actionBtn.addEventListener('click', async () => {
                                if(confirm(`BAN ${user.username}? They will lose access immediately.`)) {
                                    await update(ref(db, 'users/' + user.username), { banned: true });
                                    loadAllUsers(); // Refresh
                                }
                            });
                        }
                    }

                    div.appendChild(nameSpan);
                    div.appendChild(actionBtn);
                    listDiv.appendChild(div);
                });
            }
        }

    </script>
</body>
</html>
