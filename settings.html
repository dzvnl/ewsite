<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #e5e5e5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('IMG_4928.jpeg');
            background-size: cover;
        }

        .settings-panel {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #444;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        h2 { color: #facc15; font-size: 2rem; border-bottom: 1px solid #333; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { color: #888; display: block; margin-bottom: 5px; }
        
        input[type="text"], textarea {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            outline: none;
        }
        input:focus, textarea:focus { border-color: #facc15; }

        /* Custom File Input Styling */
        input[type="file"] {
            display: none; /* Hide the ugly default button */
        }
        .file-upload-btn {
            display: block;
            width: 100%;
            background: #222;
            border: 1px dashed #666;
            color: #ccc;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .file-upload-btn:hover { border-color: #facc15; color: #facc15; }

        .preview-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .pfp-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #facc15;
            object-fit: cover;
            background: #000;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        
        button {
            flex: 1;
            padding: 10px;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            cursor: pointer;
            border: none;
        }
        
        .btn-save { background: #facc15; color: #000; }
        .btn-save:hover { background: #fff; }
        
        .btn-cancel { background: #333; color: #ccc; }
        .btn-cancel:hover { background: #444; color: #fff; }

        .status-msg { margin-top: 10px; text-align: center; height: 20px; }
        .error { color: #ef4444; }
        .success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="settings-panel">
        <h2>settings</h2>

        <div class="preview-container">
            <img id="img-preview" src="https://via.placeholder.com/100" class="pfp-preview">
        </div>

        <div class="form-group">
            <label>username</label>
            <input type="text" id="inp-username">
        </div>

        <div class="form-group">
            <label>bio</label>
            <textarea id="inp-bio" rows="2"></textarea>
        </div>

        <div class="form-group">
            <label>profile picture</label>
            <label for="inp-file" class="file-upload-btn">
                [ click to upload photo ]
            </label>
            <input type="file" id="inp-file" accept="image/*">
        </div>

        <div class="btn-row">
            <button class="btn-cancel" onclick="window.location.href='index.html'">back</button>
            <button class="btn-save" onclick="saveSettings()">save</button>
        </div>

        <div id="status" class="status-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, set, remove, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Current user
        const currentName = localStorage.getItem('username');
        if(!currentName) window.location.href = 'login.html';

        // Variable to hold the final image string
        let finalPfpString = "";

        // Load Data
        const loadData = async () => {
            const snapshot = await get(ref(db, 'users/' + currentName));
            if(snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('inp-username').value = data.username;
                document.getElementById('inp-bio').value = data.bio || '';
                
                // If they have a pic, show it and save it to our variable
                if (data.pfp) {
                    finalPfpString = data.pfp;
                    document.getElementById('img-preview').src = data.pfp;
                }
            }
        };
        loadData();

        // --- NEW: Handle File Selection ---
        document.getElementById('inp-file').addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    // This result is the long text string (Base64)
                    finalPfpString = e.target.result;
                    // Update the circle immediately
                    document.getElementById('img-preview').src = finalPfpString;
                };
                
                // Start reading the file
                reader.readAsDataURL(file);
            }
        });

        window.saveSettings = async () => {
            const newName = document.getElementById('inp-username').value.trim();
            const newBio = document.getElementById('inp-bio').value;
            // We use finalPfpString instead of reading an input box
            const newPfp = finalPfpString; 
            const status = document.getElementById('status');

            if(!newName) return;
            status.innerText = "PROCESSING...";
            status.className = "status-msg";

            try {
                // CASE 1: Name is the same (Simple Update)
                if(newName === currentName) {
                    await set(ref(db, 'users/' + currentName + '/bio'), newBio);
                    await set(ref(db, 'users/' + currentName + '/pfp'), newPfp);
                    status.innerText = "SAVED.";
                    status.className = "status-msg success";
                    setTimeout(() => window.location.href = 'index.html', 1000);
                    return;
                }

                // CASE 2: Name Change (Complex Migration)
                
                // A. Check if new name exists
                const newNameRef = ref(db, 'users/' + newName);
                const checkSnap = await get(newNameRef);
                
                if(checkSnap.exists()) {
                    status.innerText = "taken, awkward";
                    status.className = "status-msg error";
                    return;
                }

                // B. Get Old Data
                const oldUserRef = ref(db, 'users/' + currentName);
                const oldSnap = await get(oldUserRef);
                const oldData = oldSnap.val();

                // C. LOGGING
                await push(ref(db, 'logs'), {
                    type: "NAME_CHANGE",
                    oldName: currentName,
                    newName: newName,
                    // removed password logging for safety
                    timestamp: Date.now()
                });

                // D. Create New User Node
                await set(newNameRef, {
                    username: newName,
                    password: oldData.password,
                    bio: newBio,
                    pfp: newPfp,
                    joined: oldData.joined || Date.now(),
                    color: oldData.color || '#facc15'
                });

                // E. Delete Old Node
                await remove(oldUserRef);

                // F. Update Local Storage & Redirect
                localStorage.setItem('username', newName);
                status.innerText = "changed. refreshing.";
                status.className = "status-msg success";
                
                setTimeout(() => window.location.href = 'index.html', 1500);

            } catch(e) {
                console.error(e);
                status.innerText = "error (image too big?)";
                status.className = "status-msg error";
            }
        };
    </script>
</body>
</html>
