<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #e5e5e5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('IMG_4928.jpeg');
            background-size: cover;
            overflow: hidden;
        }

        .settings-panel {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #444;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden; /* Keeps the overlay inside */
        }


    <div class="settings-panel">
        
        <div class="title-row">
            <h2>settings</h2>
            <div id="btn-admin-open" class="admin-toggle">+</div>
        </div>

        <div class="preview-container">
            <img id="img-preview" src="https://via.placeholder.com/100" class="pfp-preview">
        </div>

        <div class="form-group">
            <label>username</label>
            <input type="text" id="inp-username">
        </div>

        <div class="form-group">
            <label>bio</label>
            <textarea id="inp-bio" rows="2"></textarea>
        </div>

        <div class="form-group">
            <label>profile picture</label>
            <label for="inp-file" class="file-upload-btn">
                [ click to upload photo ]
            </label>
            <input type="file" id="inp-file" accept="image/*">
        </div>

        <div class="btn-row">
            <button class="btn-cancel" onclick="window.location.href='index.html'">back</button>
            <button class="btn-save" onclick="saveSettings()">save</button>
        </div>

        <div id="status" class="status-msg"></div>

        <div id="admin-panel" class="admin-panel">
            <h2 class="admin-title">ADMIN CONTROL</h2>
            <p style="color:#666; margin-bottom:10px;">Select user to ban:</p>
            
            <div id="user-list-container" class="user-list">
                <div style="text-align:center; color:#555">loading...</div>
            </div>

            <div class="btn-row">
                <button class="btn-cancel" id="btn-admin-close">close</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, remove, push, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const currentName = localStorage.getItem('username');
        if(!currentName) window.location.href = 'login.html';

        // --- 1. BAN ENFORCER ---
        // This listens to your OWN account. If an admin bans you, this triggers immediately.
        onValue(ref(db, 'users/' + currentName + '/banned'), (snapshot) => {
            if (snapshot.exists() && snapshot.val() === true) {
                document.getElementById('ban-screen').style.display = 'flex';
                // Optional: Force delete local storage so they can't easily re-log
                // localStorage.clear(); 
            }
        });

        // Variable for image
        let finalPfpString = "";

        // Load Settings Data
        const loadData = async () => {
            const snapshot = await get(ref(db, 'users/' + currentName));
            if(snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('inp-username').value = data.username;
                document.getElementById('inp-bio').value = data.bio || '';
                if (data.pfp) {
                    finalPfpString = data.pfp;
                    document.getElementById('img-preview').src = data.pfp;
                }
            }
        };
        loadData();

        // Handle Image Upload
        document.getElementById('inp-file').addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    finalPfpString = e.target.result;
                    document.getElementById('img-preview').src = finalPfpString;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- ADMIN PANEL LOGIC ---
        
        // Open
        document.getElementById('btn-admin-open').onclick = async () => {
            document.getElementById('admin-panel').classList.add('open');
            loadAllUsers();
        };

        // Close
        document.getElementById('btn-admin-close').onclick = () => {
            document.getElementById('admin-panel').classList.remove('open');
        };

        // Load List of Users
        async function loadAllUsers() {
            const listDiv = document.getElementById('user-list-container');
            listDiv.innerHTML = '<div style="text-align:center; color:#555">fetching souls...</div>';

            const snapshot = await get(ref(db, 'users'));
            listDiv.innerHTML = ''; // Clear loading msg

            if(snapshot.exists()) {
                const users = snapshot.val();
                
                Object.values(users).forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'user-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.innerText = user.username;
                    
                    // Check if already banned
                    if(user.banned) {
                        const badge = document.createElement('div');
                        badge.className = 'banned-badge';
                        badge.innerText = "BANNED";
                        div.appendChild(nameSpan);
                        div.appendChild(badge);
                    } else {
                        const banBtn = document.createElement('button');
                        banBtn.className = 'ban-btn';
                        banBtn.innerText = "BAN";
                        banBtn.onclick = () => banUser(user.username);
                        
                        div.appendChild(nameSpan);
                        div.appendChild(banBtn);
                    }
                    
                    listDiv.appendChild(div);
                });
            }
        }

        // Ban Function
        window.banUser = async (targetName) => {
            if(!confirm(`Are you sure you want to DESTROY ${targetName}?`)) return;
            
            try {
                // Set banned = true in Firebase
                await update(ref(db, 'users/' + targetName), {
                    banned: true
                });
                
                // Refresh list to show the ban
                loadAllUsers();
            } catch(e) {
                alert("Error banning user.");
            }
        };


        // --- SAVE SETTINGS LOGIC (Existing) ---
        window.saveSettings = async () => {
            const newName = document.getElementById('inp-username').value.trim();
            const newBio = document.getElementById('inp-bio').value;
            const newPfp = finalPfpString; 
            const status = document.getElementById('status');

            if(!newName) return;
            status.innerText = "PROCESSING...";
            status.className = "status-msg";

            try {
                if(newName === currentName) {
                    await update(ref(db, 'users/' + currentName), {
                        bio: newBio,
                        pfp: newPfp
                    });
                    status.innerText = "SAVED.";
                    status.className = "status-msg success";
                    setTimeout(() => window.location.href = 'index.html', 1000);
                    return;
                }

                // Name Change Logic
                const newNameRef = ref(db, 'users/' + newName);
                const checkSnap = await get(newNameRef);
                
                if(checkSnap.exists()) {
                    status.innerText = "taken, awkward";
                    status.className = "status-msg error";
                    return;
                }

                const oldUserRef = ref(db, 'users/' + currentName);
                const oldSnap = await get(oldUserRef);
                const oldData = oldSnap.val();

                await push(ref(db, 'logs'), {
                    type: "NAME_CHANGE",
                    oldName: currentName,
                    newName: newName,
                    timestamp: Date.now()
                });

                await set(newNameRef, {
                    username: newName,
                    password: oldData.password,
                    bio: newBio,
                    pfp: newPfp,
                    joined: oldData.joined || Date.now(),
                    color: oldData.color || '#facc15',
                    banned: oldData.banned || false 
                });

                await remove(oldUserRef);
                localStorage.setItem('username', newName);
                status.innerText = "changed. refreshing.";
                status.className = "status-msg success";
                setTimeout(() => window.location.href = 'index.html', 1500);

            } catch(e) {
                console.error(e);
                status.innerText = "error (image too big?)";
                status.className = "status-msg error";
            }
        };
    </script>
</body>
</html>
