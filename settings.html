<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(10, 10, 10, 0.95);
            --border-color: #333;
            --accent-color: #facc15; /* The Yellow */
            --text-main: #e5e5e5;
            --text-dim: #888;
            --danger: #ef4444;
        }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Using the background image with a heavy dark overlay */
            background: #000 url('IMG_4928.jpeg') no-repeat center center fixed; 
            background-size: cover;
            overflow: hidden;
            margin: 0;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: -1;
        }

        /* --- SETTINGS PANEL --- */
        .settings-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 460px;
            padding: 40px 30px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        .header-row {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h2 {
            font-size: 2rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sub-header {
            color: var(--text-dim);
            font-size: 1rem;
            margin-top: 5px;
        }

        /* --- PREVIEW IMAGE --- */
        .preview-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .pfp-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%; /* Circular */
            border: 2px solid var(--border-color);
            object-fit: cover;
            background: #111;
            transition: border-color 0.3s;
        }
        
        /* --- FORMS --- */
        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.25rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-color);
            background: #000;
        }

        /* Custom File Upload */
        input[type="file"] { display: none; }
        
        .file-upload-btn {
            display: block;
            width: 100%;
            text-align: center;
            border: 1px dashed var(--border-color);
            padding: 12px;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .file-upload-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(250, 204, 21, 0.05);
        }

        /* --- BUTTONS --- */
        .btn-row {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-dim);
        }
        .btn-cancel:hover {
            border-color: #fff;
            color: #fff;
            background: #111;
        }

        #btn-save {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }
        #btn-save:hover {
            background: #fff; /* High contrast hover */
            color: #000;
        }

        .status-msg {
            text-align: center;
            margin-top: 15px;
            font-size: 1.1rem;
            height: 1.5rem;
            color: var(--text-dim);
        }
        .status-msg.success { color: var(--accent-color); }
        .status-msg.error { color: var(--danger); }

        /* --- ADMIN BUTTON (Discreet) --- */
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: transparent;
            color: var(--border-color);
            font-size: 1rem;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            cursor: pointer;
            display: none; /* Hidden unless allowed */
            opacity: 0.5;
            transition: 0.3s;
        }
        .admin-toggle.visible { display: block; }
        .admin-toggle:hover {
            opacity: 1;
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* --- ADMIN PANEL SLIDER --- */
        .admin-panel {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 50;
            padding: 40px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }
        .admin-panel.open { transform: translateY(0); }

        .admin-header {
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title {
            color: var(--accent-color);
            font-size: 2rem;
            margin: 0;
        }

        .user-list {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            padding: 0;
            max-width: 800px;
            width: 100%;
            margin-left: auto; margin-right: auto;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #222;
        }
        .user-item:last-child { border-bottom: none; }
        .user-item:hover { background: #0a0a0a; }

        .action-btn {
            font-size: 1rem;
            padding: 5px 15px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-dim);
        }
        .btn-ban:hover { border-color: var(--danger); color: var(--danger); }
        .btn-unban:hover { border-color: #4ade80; color: #4ade80; }

        /* --- BAN SCREEN --- */
        #ban-screen {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .ban-msg { font-size: 3rem; color: var(--danger); letter-spacing: 5px; }
        .ban-sub { color: #666; margin-top: 10px; }

    </style>
</head>
<body>

    <div id="ban-screen">
        <div class="ban-msg">RESTRICTED</div>
        <div class="ban-sub">Access to this system has been revoked.</div>
    </div>

    <button id="btn-admin-open" class="admin-toggle">ADMIN_PANEL</button>

    <div id="admin-panel" class="admin-panel">
        <div class="admin-header">
            <h2 class="admin-title">USER MANAGEMENT</h2>
            <button class="btn-cancel" id="btn-admin-close" style="flex:0; padding: 5px 20px;">X</button>
        </div>
        
        <div id="user-list-container" class="user-list">
            <div style="padding:20px; text-align:center; color:#555">loading...</div>
        </div>
    </div>

    <div class="settings-panel">
        
        <div class="header-row">
            <h2>Settings</h2>
            <div class="sub-header">Profile Configuration</div>
        </div>

        <div class="preview-container">
            <img id="img-preview" src="https://via.placeholder.com/100/111111/333333?text=IMG" class="pfp-preview">
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="inp-username" maxlength="15" placeholder="Display name">
        </div>

        <div class="form-group">
            <label>Bio</label>
            <textarea id="inp-bio" rows="2" maxlength="100" placeholder="Brief description"></textarea>
        </div>

        <div class="form-group">
            <label>Profile Picture</label>
            <label for="inp-file" class="file-upload-btn">
                Click to upload image
            </label>
            <input type="file" id="inp-file" accept="image/*">
        </div>

        <div class="btn-row">
            <button class="btn-cancel" id="btn-back">Cancel</button>
            <button id="btn-save">Save Changes</button>
        </div>

        <div id="status" class="status-msg"></div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // --- DOM Elements ---
        const statusDiv = document.getElementById('status');
        const inpUsername = document.getElementById('inp-username');
        const inpBio = document.getElementById('inp-bio');
        const imgPreview = document.getElementById('img-preview');
        const inpFile = document.getElementById('inp-file');

        let currentName = localStorage.getItem('username');
        let finalPfpString = "";

        // --- THE ALLOWED LIST ---
        const allowedAdmins = ['root', 'futtbucker67', 'undefined'];
        
        if(!currentName) {
            currentName = "Guest"; 
            // window.location.href = 'login.html'; 
        }

        // --- 1. LOAD CURRENT USER ---
        statusDiv.innerText = "loading...";
        
        onValue(ref(db, 'users/' + currentName), (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                statusDiv.innerText = "new user detected";
                return;
            }

            // 1a. Check if *YOU* are banned
            if (data.banned === true) {
                document.getElementById('ban-screen').style.display = 'flex';
                return;
            }

            // 1b. Check if *YOU* are in the allowed list
            if (allowedAdmins.includes(currentName) || allowedAdmins.includes(data.username)) {
                document.getElementById('btn-admin-open').classList.add('visible');
            }

            // 1c. Populate Settings Form
            if(inpUsername.value === "") {
                inpUsername.value = data.username || currentName;
                inpBio.value = data.bio || "";
                if (data.pfp) {
                    finalPfpString = data.pfp;
                    imgPreview.src = data.pfp;
                }
            }
            statusDiv.innerText = "";
        }, (error) => {
            console.error(error);
            statusDiv.innerText = "connection error";
            statusDiv.className = "status-msg error";
        });

        // --- 2. SETTINGS BUTTON LISTENERS ---
        
        document.getElementById('btn-back').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        document.getElementById('btn-save').addEventListener('click', async () => {
            const newName = inpUsername.value.trim();
            const newBio = inpBio.value;
            const newPfp = finalPfpString;

            if(!newName) return;
            statusDiv.innerText = "saving...";
            statusDiv.className = "status-msg";

            try {
                // Name Update Logic
                if(newName === currentName) {
                    await update(ref(db, 'users/' + currentName), { bio: newBio, pfp: newPfp });
                    statusDiv.innerText = "saved successfully";
                    statusDiv.className = "status-msg success";
                    setTimeout(() => window.location.href = 'index.html', 1000);
                    return;
                }

                // Name Change Logic
                const newNameRef = ref(db, 'users/' + newName);
                if((await get(newNameRef)).exists()) {
                    statusDiv.innerText = "username taken";
                    statusDiv.className = "status-msg error";
                    return;
                }

                const oldSnap = await get(ref(db, 'users/' + currentName));
                const newData = { ...oldSnap.val(), username: newName, bio: newBio, pfp: newPfp };
                
                const updates = {};
                updates['users/' + newName] = newData;
                updates['users/' + currentName] = null;

                await update(ref(db), updates);
                localStorage.setItem('username', newName);
                
                statusDiv.innerText = "profile migrated";
                statusDiv.className = "status-msg success";
                setTimeout(() => window.location.href = 'index.html', 1500);

            } catch(e) {
                statusDiv.innerText = "error: " + e.message;
                statusDiv.className = "status-msg error";
            }
        });

        inpFile.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                if(file.size > 200000) { 
                    alert("Image too big (Max 200KB)"); 
                    return; 
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    finalPfpString = e.target.result;
                    imgPreview.src = finalPfpString;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- 3. ADMIN PANEL LOGIC (Ban/Unban) ---

        document.getElementById('btn-admin-open').addEventListener('click', () => {
            document.getElementById('admin-panel').classList.add('open');
            loadAllUsers();
        });

        document.getElementById('btn-admin-close').addEventListener('click', () => {
            document.getElementById('admin-panel').classList.remove('open');
        });

        async function loadAllUsers() {
            const listDiv = document.getElementById('user-list-container');
            listDiv.innerHTML = '<div style="text-align:center; color:#555; padding:20px;">fetching users...</div>';

            const snapshot = await get(ref(db, 'users'));
            listDiv.innerHTML = ''; 

            if(snapshot.exists()) {
                const users = snapshot.val();
                
                Object.values(users).forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'user-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.innerText = user.username;
                    // Highlight if they are in the allowed list
                    if(allowedAdmins.includes(user.username)) {
                         nameSpan.style.color = "#facc15"; // Yellow
                         nameSpan.innerHTML += " <span style='font-size:0.8em; opacity:0.7'>[ADMIN]</span>";
                    }

                    const actionBtn = document.createElement('button');
                    actionBtn.className = 'action-btn';

                    // Self-Protection
                    if(user.username === currentName) {
                        actionBtn.innerText = "YOU";
                        actionBtn.disabled = true;
                        actionBtn.style.opacity = "0.3";
                        actionBtn.style.border = "none";
                    } else {
                        // Check if they are ALREADY banned
                        if (user.banned === true) {
                            // SHOW UNBAN BUTTON
                            actionBtn.innerText = "UNBAN";
                            actionBtn.classList.add('btn-unban');
                            actionBtn.addEventListener('click', async () => {
                                if(confirm(`Restore access for ${user.username}?`)) {
                                    await update(ref(db, 'users/' + user.username), { banned: false });
                                    loadAllUsers(); // Refresh
                                }
                            });
                        } else {
                            // SHOW BAN BUTTON
                            actionBtn.innerText = "BAN";
                            actionBtn.classList.add('btn-ban');
                            actionBtn.addEventListener('click', async () => {
                                if(confirm(`Ban ${user.username}?`)) {
                                    await update(ref(db, 'users/' + user.username), { banned: true });
                                    loadAllUsers(); // Refresh
                                }
                            });
                        }
                    }

                    div.appendChild(nameSpan);
                    div.appendChild(actionBtn);
                    listDiv.appendChild(div);
                });
            }
        }
    </script>
</body>
</html>
