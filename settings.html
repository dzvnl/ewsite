<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #e5e5e5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('IMG_4928.jpeg'); /* Ensure this file exists */
            background-size: cover;
            overflow: hidden;
            margin: 0;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); /* Darkened slightly for readability */
            z-index: -1;
        }

        .settings-panel {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #444;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        h2 { font-size: 2rem; margin: 0; color: #facc15; text-shadow: 0 0 5px #facc15; }

        .admin-toggle {
            cursor: pointer; font-size: 1.5rem; color: #333; user-select: none;
            transition: color 0.3s;
            display: none; /* Hidden by default for security */
        }
        .admin-toggle.visible { display: block; }
        .admin-toggle:hover { color: #f87171; text-shadow: 0 0 5px red; }

        .preview-container { text-align: center; margin-bottom: 20px; }
        .pfp-preview {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid #444; object-fit: cover;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; color: #888; margin-bottom: 5px; font-size: 1.1rem; }
        
        input[type="text"], textarea {
            width: 100%; background: #000; border: 1px solid #333;
            color: #fff; padding: 8px; font-family: 'VT323', monospace;
            font-size: 1.2rem; outline: none;
        }
        input[type="text"]:focus, textarea:focus { border-color: #facc15; }

        input[type="file"] { display: none; }
        .file-upload-btn {
            display: block; width: 100%; text-align: center;
            border: 1px dashed #444; padding: 10px; cursor: pointer;
            color: #666; transition: 0.2s;
        }
        .file-upload-btn:hover { border-color: #888; color: #aaa; }

        .btn-row { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        button {
            flex: 1; padding: 10px; font-family: 'VT323', monospace;
            font-size: 1.3rem; border: none; cursor: pointer;
            text-transform: uppercase;
        }
        .btn-cancel { background: #222; color: #888; }
        .btn-cancel:hover { background: #333; color: #fff; }
        
        .btn-save { background: #facc15; color: #000; font-weight: bold; }
        .btn-save:hover { background: #eab308; box-shadow: 0 0 10px #eab308; }

        .status-msg { text-align: center; margin-top: 15px; font-size: 1.2rem; height: 1.5rem; }
        .status-msg.success { color: #4ade80; }
        .status-msg.error { color: #f87171; }

        /* --- ADMIN PANEL --- */
        .admin-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 50; padding: 30px;
            transform: translateY(100%); transition: transform 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        .admin-panel.open { transform: translateY(0); }
        
        .admin-title { color: #f87171; text-shadow: 0 0 5px red; margin-bottom: 10px; }
        
        .user-list {
            flex-grow: 1; overflow-y: auto; border: 1px solid #333;
            margin-bottom: 15px; padding: 5px;
        }
        .user-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; border-bottom: 1px solid #222;
        }
        .ban-btn {
            background: #440000; color: #f87171; border: 1px solid #660000;
            padding: 2px 8px; font-size: 1rem; flex: 0;
        }
        .ban-btn:hover { background: red; color: white; }
        .banned-badge { color: #666; font-style: italic; font-size: 0.9rem; }

        /* --- BAN SCREEN OVERLAY --- */
        #ban-screen {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: red;
        }
        .ban-glitch { font-size: 4rem; text-shadow: 2px 2px 0px white; animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="ban-screen">
        <h1 class="ban-glitch">CRITICAL ERROR</h1>
        <p>ACCESS PERMANENTLY REVOKED</p>
    </div>

    <div class="settings-panel">
        
        <div class="title-row">
            <h2>settings</h2>
            <div id="btn-admin-open" class="admin-toggle" title="Admin Control">+</div>
        </div>

        <div class="preview-container">
            <img id="img-preview" src="https://via.placeholder.com/100" class="pfp-preview">
        </div>

        <div class="form-group">
            <label>username</label>
            <input type="text" id="inp-username" maxlength="15">
        </div>

        <div class="form-group">
            <label>bio</label>
            <textarea id="inp-bio" rows="2" maxlength="100"></textarea>
        </div>

        <div class="form-group">
            <label>profile picture (max 150kb)</label>
            <label for="inp-file" class="file-upload-btn">
                [ click to upload photo ]
            </label>
            <input type="file" id="inp-file" accept="image/*">
        </div>

        <div class="btn-row">
            <button class="btn-cancel" onclick="window.location.href='index.html'">back</button>
            <button class="btn-save" onclick="saveSettings()">save</button>
        </div>

        <div id="status" class="status-msg"></div>

        <div id="admin-panel" class="admin-panel">
            <h2 class="admin-title">ADMIN CONTROL</h2>
            <p style="color:#666; margin-bottom:10px;">Select user to ban:</p>
            
            <div id="user-list-container" class="user-list">
                <div style="text-align:center; color:#555">loading...</div>
            </div>

            <div class="btn-row">
                <button class="btn-cancel" id="btn-admin-close">close</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, remove, push, onValue, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const currentName = localStorage.getItem('username');
        if(!currentName) window.location.href = 'login.html';

        let isCurrentUserAdmin = false;
        let finalPfpString = "";

        // --- 1. LOAD DATA & BAN CHECK ---
        onValue(ref(db, 'users/' + currentName), (snapshot) => {
            const data = snapshot.val();
            
            // Check if user exists or was deleted
            if (!data) {
                // If data is null, they might have been deleted/banned completely
                return;
            }

            // Check Ban
            if (data.banned === true) {
                document.getElementById('ban-screen').style.display = 'flex';
                return;
            }

            // Populate Form (Only if inputs are empty to avoid overwriting while typing)
            if(document.getElementById('inp-username').value === "") {
                document.getElementById('inp-username').value = data.username;
                document.getElementById('inp-bio').value = data.bio || '';
                if (data.pfp) {
                    finalPfpString = data.pfp;
                    document.getElementById('img-preview').src = data.pfp;
                }
            }

            // Check Admin Privileges
            if (data.isAdmin === true) {
                isCurrentUserAdmin = true;
                document.getElementById('btn-admin-open').classList.add('visible');
            }
        });

        // --- 2. IMAGE UPLOAD (With Size Limit) ---
        document.getElementById('inp-file').addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];

                // LIMIT: 150KB (approx)
                if(file.size > 150000) {
                    alert("File too big! Please keep it under 150KB for the database.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    finalPfpString = e.target.result;
                    document.getElementById('img-preview').src = finalPfpString;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- 3. SAVE SETTINGS (Atomic Update) ---
        window.saveSettings = async () => {
            const newName = document.getElementById('inp-username').value.trim();
            const newBio = document.getElementById('inp-bio').value;
            const newPfp = finalPfpString; 
            const status = document.getElementById('status');

            if(!newName) return;
            status.innerText = "PROCESSING...";
            status.className = "status-msg";

            try {
                // Scenario A: Name is the same, simple update
                if(newName === currentName) {
                    await update(ref(db, 'users/' + currentName), {
                        bio: newBio,
                        pfp: newPfp
                    });
                    status.innerText = "SAVED.";
                    status.className = "status-msg success";
                    setTimeout(() => window.location.href = 'index.html', 1000);
                    return;
                }

                // Scenario B: Name Change (Requires Atomic Transaction)
                const newNameRef = ref(db, 'users/' + newName);
                const checkSnap = await get(newNameRef);
                
                if(checkSnap.exists()) {
                    status.innerText = "taken, awkward";
                    status.className = "status-msg error";
                    return;
                }

                // Get old data
                const oldUserRef = ref(db, 'users/' + currentName);
                const oldSnap = await get(oldUserRef);
                const oldData = oldSnap.val();

                // Prepare new data object
                const newData = {
                    ...oldData,
                    username: newName,
                    bio: newBio,
                    pfp: newPfp
                };

                // Atomic update: Create new path AND delete old path simultaneously
                const updates = {};
                updates['users/' + newName] = newData;
                updates['users/' + currentName] = null;
                updates['logs/' + Date.now()] = {
                    type: "NAME_CHANGE",
                    oldName: currentName,
                    newName: newName
                };

                await update(ref(db), updates);

                localStorage.setItem('username', newName);
                status.innerText = "changed. refreshing.";
                status.className = "status-msg success";
                setTimeout(() => window.location.href = 'index.html', 1500);

            } catch(e) {
                console.error(e);
                status.innerText = "database error";
                status.className = "status-msg error";
            }
        };

        // --- 4. ADMIN PANEL LOGIC ---
        
        document.getElementById('btn-admin-open').onclick = () => {
            if(!isCurrentUserAdmin) return; // Security Check
            document.getElementById('admin-panel').classList.add('open');
            loadAllUsers();
        };

        document.getElementById('btn-admin-close').onclick = () => {
            document.getElementById('admin-panel').classList.remove('open');
        };

        async function loadAllUsers() {
            if(!isCurrentUserAdmin) return; // Security Check

            const listDiv = document.getElementById('user-list-container');
            listDiv.innerHTML = '<div style="text-align:center; color:#555">fetching souls...</div>';

            const snapshot = await get(ref(db, 'users'));
            listDiv.innerHTML = ''; 

            if(snapshot.exists()) {
                const users = snapshot.val();
                
                Object.values(users).forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'user-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.innerText = user.username;
                    if(user.isAdmin) nameSpan.style.color = "#facc15"; // Gold for admins
                    
                    if(user.banned) {
                        const badge = document.createElement('div');
                        badge.className = 'banned-badge';
                        badge.innerText = "BANNED";
                        div.appendChild(nameSpan);
                        div.appendChild(badge);
                    } else {
                        const banBtn = document.createElement('button');
                        banBtn.className = 'ban-btn';
                        banBtn.innerText = "BAN";
                        // Prevent self-ban
                        if(user.username === currentName) {
                            banBtn.disabled = true;
                            banBtn.style.opacity = 0.5;
                        } else {
                            banBtn.onclick = () => window.banUser(user.username);
                        }
                        
                        div.appendChild(nameSpan);
                        div.appendChild(banBtn);
                    }
                    
                    listDiv.appendChild(div);
                });
            }
        }

        window.banUser = async (targetName) => {
            if(!isCurrentUserAdmin) {
                alert("Nice try.");
                return;
            }

            if(!confirm(`Are you sure you want to DESTROY ${targetName}?`)) return;
            
            try {
                await update(ref(db, 'users/' + targetName), {
                    banned: true
                });
                loadAllUsers(); 
            } catch(e) {
                alert("Error banning user.");
            }
        };

    </script>
</body>
</html>
