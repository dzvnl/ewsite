<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            background-image: url('IMG_4928.jpeg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #444;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            text-align: center;
        }

        h1 { color: #facc15; font-size: 2.5rem; margin-bottom: 20px; border-bottom: 1px solid #333; }
        
        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            margin-bottom: 15px;
            text-align: center;
        }
        input:focus { border-color: #facc15; outline: none; }

        .btn {
            width: 100%;
            background: #facc15;
            color: #000;
            padding: 10px;
            font-size: 1.5rem;
            font-family: 'VT323', monospace;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        .btn:hover { background: #eab308; }

        .links { margin-top: 15px; font-size: 1.1rem; }
        .links a { color: #888; text-decoration: none; }
        .links a:hover { color: #fff; }

        .error-msg { color: #ef4444; margin-top: 10px; height: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>login</h1>
        
        <input type="text" id="username" placeholder="USERNAME" autocomplete="off">
        <input type="password" id="password" placeholder="PASSWORD">
        
        <button onclick="login()" id="btn-login" class="btn">login</button>

        <div id="status" class="error-msg"></div>

        <div class="links">
            <a href="register.html">create account</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b",
            measurementId: "G-GTN3TL1P2K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.login = async function() {
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('btn-login');

            if(!userInp || !passInp) {
                status.innerText = " required";
                return;
            }

            btn.innerText = "VERIFYING...";
            status.innerText = "";

            try {
                const usersRef = ref(db, 'users');
                const q = query(usersRef, orderByChild('username'), equalTo(userInp));
                const snapshot = await get(q);

                if (snapshot.exists()) {
                    let validUser = null;
                    let validId = null;

                    snapshot.forEach(childSnap => {
                        const data = childSnap.val();
                        // Ensure your database actually HAS a "password" field for "root"
                        if (data.password === passInp) {
                            validUser = data;
                            validId = childSnap.key;
                        }
                    });

                    if (validUser) {
                        localStorage.setItem('account_uuid', validId);
                        localStorage.setItem('username', validUser.username);
                        window.location.href = "settings.html";
                    } else {
                        status.innerText = "invalid password";
                        btn.innerText = "ACCESS";
                    }

                } else {
                    status.innerText = "user not found";
                    btn.innerText = "ACCESS";
                }

            } catch (error) {
                console.error(error);
                status.innerText = "database error";
                btn.innerText = "ACCESS";
            }
        }
    </script>
</body>
</html>
