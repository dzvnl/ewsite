<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas - account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            background-image: url('IMG_4928.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .account-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #969696;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        h1 {
            color: #facc15;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            color: #969696;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 0.75rem;
            font-family: 'VT323', monospace;
            font-size: 1.25rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #facc15;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #facc15;
            color: #000;
            border: 2px solid #facc15;
        }
        .btn-primary:hover {
            background-color: transparent;
            color: #facc15;
        }

        .btn-secondary {
            background-color: transparent;
            color: #969696;
            border: 1px solid #444;
            margin-top: 1rem;
            font-size: 1.2rem;
        }
        .btn-secondary:hover {
            border-color: #fff;
            color: #fff;
        }

        .nav-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
        }
        
        .nav-links a {
            color: #4ade80;
            text-decoration: none;
            font-size: 1.2rem;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="account-box">
        <h1>Identity</h1>
        
        <div class="input-group">
            <label for="username-input">Display Name:</label>
            <input type="text" id="username-input" placeholder="Enter name..." maxlength="15">
        </div>

        <button class="btn btn-primary" onclick="saveAccount()">[ SAVE CHANGE ]</button>
        
        <div class="nav-links">
            <a href="index.html"><< Home</a>
            <a href="chat.html">Global_Net >></a>
        </div>
        
        <button class="btn btn-secondary" onclick="logout()">Sign Out / Reset</button>
    </div>

    <script>
        const input = document.getElementById('username-input');

        // Load existing name
        const currentName = localStorage.getItem('username');
        if (currentName) {
            input.value = currentName;
        }

        function saveAccount() {
            const newName = input.value.trim();
            if (newName) {
                localStorage.setItem('username', newName);
                alert('Identity Updated.');
                // Optional: Redirect
                // window.location.href = 'index.html'; 
            } else {
                alert('Name cannot be empty.');
            }
        }

        function logout() {
            localStorage.removeItem('username');
            input.value = '';
            alert('Signed out.');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
