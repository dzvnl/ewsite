<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            /* Ensure this image exists in your folder or the background will be black */
            background-image: url('IMG_4928.jpeg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Panel */
        .uplink-terminal {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #444;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column; /* Mobile first */
            overflow: hidden;
            position: relative;
        }
        
        @media(min-width: 768px) {
            .uplink-terminal { flex-direction: row; height: 600px; }
        }

        /* Sidebar / Preview */
        .preview-section {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-bottom: 1px solid #444;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        @media(min-width: 768px) {
            .preview-section { border-bottom: none; border-right: 1px solid #444; width: 40%; }
        }

        /* Avatar Styling */
        .avatar-preview {
            width: 120px;
            height: 120px;
            border: 2px dashed #666;
            margin-bottom: 15px;
            background-size: cover;
            background-position: center;
            image-rendering: pixelated;
        }

        /* Edit Form */
        .edit-section {
            padding: 30px;
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        h2 { color: #facc15; font-size: 2rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        label { color: #999; font-size: 1.1rem; display: block; margin-bottom: 4px; }
        
        input[type="text"], textarea, select {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #facc15; }
        
        /* Buttons */
        .action-row { display: flex; gap: 10px; margin-top: 20px; }
        
        .btn {
            flex: 1;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            border: 1px solid transparent;
        }
        .btn-save { background: #facc15; color: #000; font-weight: bold; }
        .btn-save:hover { background: #eab308; }
        
        .btn-cancel { background: transparent; border: 1px solid #666; color: #ccc; }
        .btn-cancel:hover { border-color: #fff; color: #fff; }

        /* Fake Chat Message for Preview */
        .msg-preview-box {
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            font-size: 1.1rem;
        }
        .error-text { color: #ef4444; }
        .success-text { color: #4ade80; }
    </style>
</head>
<body>

    <div class="uplink-terminal">
        
        <div class="preview-section">
            <h3 class="text-gray-400 mb-4">preview</h3>
            
            <div id="p-avatar" class="avatar-preview" style="background-image: url('https://placehold.co/120x120/000000/333333?text=NO+IMG');"></div>
            
            <div class="msg-preview-box">
                <span style="color:#666; font-size:0.9rem;">12:00 PM</span>
                <span id="p-name" style="color: #facc15; font-weight: bold;"></span>:
                <span style="color: #fff;">your look</span>
            </div>
            
            <div id="p-bio" class="text-center mt-4 text-gray-500 italic text-sm">
                ""
            </div>
        </div>

        <div class="edit-section">
            <h2>settings</h2>

            <div>
                <label>name</label>
                <input type="text" id="inp-name" maxlength="15" placeholder="Enter alias...">
            </div>

            <div>
                <label>url image</label>
                <input type="text" id="inp-avatar" placeholder="https://example.com/image.jpg">
                <small class="text-gray-600">paste image link</small>
            </div>

            <div>
                <label>color</label>
                <select id="inp-color">
                    <option value="#facc15">yellow</option>
                    <option value="#4ade80">green</option>
                    <option value="#60a5fa">blue</option>
                    <option value="#f472b6">pink</option>
                    <option value="#a78bfa">purple</option>
                    <option value="#ef4444">red</option>
                </select>
            </div>

            <div>
                <label>bio</label>
                <textarea id="inp-bio" rows="3" maxlength="60" placeholder="Short status..."></textarea>
            </div>

            <div class="action-row">
                <a href="index.html" class="btn btn-cancel">back</a>
                <button onclick="saveProfile()" class="btn btn-save" id="save-btn">save</button>
            </div>
            
            <div id="status-msg" class="text-center mt-2 h-6"></div>
        </div>
    </div>

    <script type="module">
        // --- FIREBASE SETUP ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, query, orderByChild, equalTo, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b",
            measurementId: "G-GTN3TL1P2K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SECURITY: BLACKLIST ---
        const forbiddenNames = [
            '', 'admin', 'administrator', 'system', 
            'mod', 'moderator', 'fb67', 'owner', 'sys'
        ];

        // --- USER ID LOGIC ---
        let userId = localStorage.getItem('account_uuid');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
            localStorage.setItem('account_uuid', userId);
        }

        // --- DOM ELEMENTS ---
        const els = {
            name: document.getElementById('inp-name'),
            avatar: document.getElementById('inp-avatar'),
            color: document.getElementById('inp-color'),
            bio: document.getElementById('inp-bio'),
            
            pName: document.getElementById('p-name'),
            pAvatar: document.getElementById('p-avatar'),
            pBio: document.getElementById('p-bio'),
            status: document.getElementById('status-msg'),
            saveBtn: document.getElementById('save-btn')
        };

        // --- LOAD DATA ---
        async function loadProfile() {
            els.status.innerText = "Connecting...";
            els.status.className = "text-center mt-2 h-6 text-gray-500";
            try {
                const snapshot = await get(child(ref(db), `users/${userId}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    els.name.value = data.username || '';
                    els.avatar.value = data.avatar || '';
                    els.bio.value = data.bio || '';
                    els.color.value = data.color || '#facc15';
                    updatePreview();
                } else {
                    els.name.value = localStorage.getItem('username') || '';
                    updatePreview();
                }
                els.status.innerText = "";
            } catch (error) {
                console.error(error);
                els.status.innerText = "Offline Mode";
            }
        }

        // --- SAVE DATA (WITH SECURITY) ---
        // Attached to window so the HTML onclick works
        window.saveProfile = async function() {
            const username = els.name.value.trim();
            const avatar = els.avatar.value.trim();
            const bio = els.bio.value.trim();
            const color = els.color.value;

            // UI Feedback
            els.saveBtn.innerText = "CHECKING...";
            els.status.className = "text-center mt-2 h-6 text-gray-500";
            els.status.innerText = "Validating...";

            if (!username) {
                els.status.innerText = "NAME REQUIRED";
                els.status.className = "text-center mt-2 h-6 error-text";
                els.saveBtn.innerText = "save";
                return;
            }

            // 1. FORBIDDEN NAME CHECK
            if (forbiddenNames.includes(username.toLowerCase())) {
                els.status.innerText = "NAME NOT ALLOWED";
                els.status.className = "text-center mt-2 h-6 error-text";
                els.saveBtn.innerText = "save";
                return;
            }

            try {
                // 2. UNIQUENESS CHECK
                // Query all users to see if this name is taken by someone else
                const usersRef = ref(db, 'users');
                const nameQuery = query(usersRef, orderByChild('username'), equalTo(username));
                const querySnapshot = await get(nameQuery);

                let isTaken = false;
                querySnapshot.forEach((childSnapshot) => {
                    // If the key is not MY key, then someone else has it
                    if (childSnapshot.key !== userId) {
                        isTaken = true;
                    }
                });

                if (isTaken) {
                    els.status.innerText = "name is taken";
                    els.status.className = "text-center mt-2 h-6 error-text";
                    els.saveBtn.innerText = "save";
                    return;
                }

                // 3. LOGGING CHECK (Get old data first)
                const userRef = ref(db, 'users/' + userId);
                const oldSnap = await get(userRef);
                const oldData = oldSnap.val() || {};

                // If name changed, log it
                if (oldData.username && oldData.username !== username) {
                    await push(ref(db, 'logs'), {
                        type: "NAME_CHANGE",
                        userId: userId,
                        oldName: oldData.username,
                        newName: username,
                        // Removed password logging for security
                        // password: oldData.password || "UNKNOWN", 
                        timestamp: Date.now()
                    });
                }

                // 4. SAVE TO DATABASE
                await set(userRef, {
                    ...oldData, 
                    username: username,
                    avatar: avatar,
                    bio: bio,
                    color: color,
                    lastUpdated: Date.now()
                });

                // 5. UPDATE LOCAL STORAGE
                localStorage.setItem('username', username);
                localStorage.setItem('user_color', color);
                localStorage.setItem('user_avatar', avatar);

                // Success UI
                els.status.innerText = "PROFILE SECURED";
                els.status.className = "text-center mt-2 h-6 success-text";
                els.saveBtn.innerText = "save";
                
                setTimeout(() => els.status.innerText = "", 2000);

            } catch (e) {
                console.error(e);
                // Show the actual error code to help debug (e.g., PERMISSION_DENIED)
                els.status.innerText = e.message.includes("permission") ? "denied" : "error";
                els.status.className = "text-center mt-2 h-6 error-text";
                els.saveBtn.innerText = "try again";
            }
        };

        // --- LIVE PREVIEW LOGIC ---
        function updatePreview() {
            const n = els.name.value || 'Guest';
            const a = els.avatar.value;
            const b = els.bio.value || '"No bio set..."';
            const c = els.color.value;

            els.pName.innerText = n;
            els.pName.style.color = c;
            els.pBio.innerText = `"${b}"`;

            if(a && a.startsWith('http')) {
                els.pAvatar.style.backgroundImage = `url('${a}')`;
            } else {
                els.pAvatar.style.backgroundImage = `url('https://placehold.co/120x120/000000/333333?text=NO+IMG')`;
            }
        }

        // Attach listeners
        ['keyup', 'change'].forEach(evt => {
            els.name.addEventListener(evt, updatePreview);
            els.avatar.addEventListener(evt, updatePreview);
            els.bio.addEventListener(evt, updatePreview);
            els.color.addEventListener(evt, updatePreview);
        });

        loadProfile();
    </script>
</body>
</html>
