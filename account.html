<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            background-image: url('IMG_4928.jpeg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #444;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            text-align: center;
        }

        /* HIDE LOGIN BOX IF VIEWING A USER */
        .hidden { display: none; }

        h1 { color: #facc15; font-size: 2.5rem; margin-bottom: 20px; border-bottom: 1px solid #333; }
        
        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            margin-bottom: 15px;
            text-align: center;
        }
        input:focus { border-color: #facc15; outline: none; }

        .btn {
            width: 100%;
            background: #facc15;
            color: #000;
            padding: 10px;
            font-size: 1.5rem;
            font-family: 'VT323', monospace;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        .btn:hover { background: #eab308; }

        .links { margin-top: 15px; font-size: 1.1rem; }
        .links a { color: #888; text-decoration: none; }
        .links a:hover { color: #fff; }

        .error-msg { color: #ef4444; margin-top: 10px; height: 20px; }
        .bio-text { color: #aaa; margin: 20px 0; font-size: 1.2rem; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="login-container" class="login-box">
        <h1>access</h1>
        <input type="text" id="username" placeholder="USERNAME" autocomplete="off">
        <button onclick="login()" id="btn-login" class="btn">enter</button>
        <div id="status" class="error-msg"></div>
        <div class="links">
            <a href="register.html">create account</a>
        </div>
    </div>

    <div id="profile-container" class="login-box hidden">
        <h1 id="profile-name">User Profile</h1>
        <div id="profile-status" class="error-msg"></div>
        <p id="profile-bio" class="bio-text">Loading profile data...</p>
        <button onclick="window.location.href='/'" class="btn" style="margin-top:20px;">BACK TO HOME</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b",
            measurementId: "G-GTN3TL1P2K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // 1. Check URL for "?user=NAME"
        const params = new URLSearchParams(window.location.search);
        const targetUser = params.get('user');

        if (targetUser) {
            // ===========================
            //      PROFILE VIEW MODE
            // ===========================
            
            // Switch UI
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('profile-container').classList.remove('hidden');
            document.getElementById('profile-name').innerText = targetUser;
            
            // Fetch real data from Firebase
            const loadProfile = async () => {
                const bioEl = document.getElementById('profile-bio');
                try {
                    const usersRef = ref(db, 'users');
                    const q = query(usersRef, orderByChild('username'), equalTo(targetUser));
                    const snapshot = await get(q);

                    if (snapshot.exists()) {
                        const key = Object.keys(snapshot.val())[0];
                        const data = snapshot.val()[key];
                        // Display Bio if it exists, otherwise default text
                        bioEl.innerText = data.bio ? data.bio : "This user has not written a bio yet.";
                    } else {
                        document.getElementById('profile-name').innerText = "404";
                        bioEl.innerText = "User does not exist.";
                        bioEl.style.color = "#ef4444";
                    }
                } catch (error) {
                    console.error(error);
                    bioEl.innerText = "Error loading profile.";
                }
            };
            
            loadProfile();

        } else {
            // ===========================
            //       LOGIN MODE
            // ===========================

            // Auto-redirect if already logged in
            if (localStorage.getItem('account_uuid')) {
                 window.location.href = "settings.html";
            }

            // Define the login function globally so the HTML button can see it
            window.login = async function() {
                const userInp = document.getElementById('username').value.trim();
                const status = document.getElementById('status');
                const btn = document.getElementById('btn-login');

                if(!userInp) {
                    status.innerText = "username required";
                    return;
                }

                btn.innerText = "SEARCHING...";
                status.innerText = "";

                try {
                    const usersRef = ref(db, 'users');
                    const q = query(usersRef, orderByChild('username'), equalTo(userInp));
                    const snapshot = await get(q);

                    if (snapshot.exists()) {
                        const key = Object.keys(snapshot.val())[0];
                        const data = snapshot.val()[key];

                        localStorage.setItem('account_uuid', key);
                        localStorage.setItem('username', data.username);
                        
                        window.location.href = "settings.html";

                    } else {
                        status.innerText = "user not found";
                        btn.innerText = "ENTER";
                    }

                } catch (error) {
                    console.error(error);
                    status.innerText = "database error";
                    btn.innerText = "ENTER";
                }
            }
        }
    </script>
</body>
</html>
