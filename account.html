<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            color: #e5e5e5;
            background-color: #000;
            background-image: url('IMG_4928.jpeg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #444;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            text-align: center;
        }

        h1 { color: #facc15; font-size: 2.5rem; margin-bottom: 20px; border-bottom: 1px solid #333; }
        
        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            margin-bottom: 15px;
            text-align: center;
        }
        input:focus { border-color: #facc15; outline: none; }

        .btn {
            width: 100%;
            background: #facc15;
            color: #000;
            padding: 10px;
            font-size: 1.5rem;
            font-family: 'VT323', monospace;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        .btn:hover { background: #eab308; }

        .links { margin-top: 15px; font-size: 1.1rem; }
        .links a { color: #888; text-decoration: none; }
        .links a:hover { color: #fff; }

        .error-msg { color: #ef4444; margin-top: 10px; height: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>access</h1>
        
        <input type="text" id="username" placeholder="USERNAME" autocomplete="off">
        
        <button onclick="login()" id="btn-login" class="btn">enter</button>

        <div id="status" class="error-msg"></div>

        <div class="links">
            <a href="register.html">create account</a>
        </div>
    </div>

    <script>
        // 1. PREVENT REDIRECT LOOP:
        // If the URL contains "?user=", we assume the user is trying to view a profile.
        // We do NOT want to run any auto-login or redirect logic here.
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('user')) {
            console.log("Viewing user profile: " + urlParams.get('user'));
            // If this file is supposed to show the profile, logic would go here.
            // If this file is strictly the login page, we might want to redirect:
            // window.location.href = "account.html" + window.location.search;
        }

        // 2. SIMPLIFIED LOGIN (No Database Check)
        window.login = function() {
            const userInp = document.getElementById('username').value.trim();
            const status = document.getElementById('status');

            if(!userInp) {
                status.innerText = "username required";
                return;
            }

            // Set the session immediately without checking Firebase
            localStorage.setItem('username', userInp);
            
            // Note: Since we aren't checking the DB, we don't have a real UUID.
            // We'll use the username as the UUID for now.
            localStorage.setItem('account_uuid', userInp);

            window.location.href = "settings.html";
        }
    </script>
</body>
</html>
