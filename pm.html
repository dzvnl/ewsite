<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Message</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; }
        body {
            background-color: #020205; /* Very dark blue/black */
            color: #ccc;
            font-family: 'VT323', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- PM CONTAINER --- */
        .pm-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #050510;
            border-left: 1px solid #1e3a8a;
            border-right: 1px solid #1e3a8a;
            box-shadow: 0 0 30px rgba(30, 58, 138, 0.2);
        }

        /* --- HEADER --- */
        .pm-header {
            background: #0f172a;
            padding: 15px;
            border-bottom: 2px solid #1e3a8a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        .header-title {
            color: #60a5fa; /* Light Blue */
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-dot {
            height: 10px; width: 10px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px #4ade80;
            margin-right: 10px;
        }

        .btn-close {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 5px 15px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .btn-close:hover { background: #ef4444; color: #fff; }

        /* --- CHAT AREA --- */
        .pm-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: 
                linear-gradient(rgba(5, 5, 16, 0.95), rgba(5, 5, 16, 0.95)),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        /* --- BUBBLES --- */
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .msg-wrapper.incoming { align-self: flex-start; }
        .msg-wrapper.outgoing { align-self: flex-end; align-items: flex-end; }

        .bubble {
            padding: 10px 15px;
            font-size: 1.2rem;
            position: relative;
            word-wrap: break-word;
            border: 1px solid;
        }

        /* Incoming Styles */
        .incoming .bubble {
            background: #1e293b;
            border-color: #334155;
            color: #e2e8f0;
            border-radius: 0 10px 10px 10px;
        }
        .incoming .sender-name {
            font-size: 0.9rem; color: #64748b; margin-bottom: 2px;
        }

        /* Outgoing Styles (You) */
        .outgoing .bubble {
            background: #172554; /* Deep Blue */
            border-color: #1e40af;
            color: #93c5fd;
            border-radius: 10px 0 10px 10px;
            text-align: right;
        }

        .timestamp {
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: 4px;
        }

        /* --- MEDIA IN PM --- */
        .pm-media {
            max-width: 100%;
            border: 1px solid #1e40af;
            margin-top: 5px;
        }

        /* --- INPUT --- */
        .pm-input-area {
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #1e3a8a;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #020617;
            border: 1px solid #1e3a8a;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            font-size: 1.2rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: #60a5fa; }

        .btn-send {
            background: #1e40af;
            color: #fff;
            border: none;
            padding: 0 20px;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-send:hover { background: #2563eb; }

        .btn-attach {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            width: 40px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; }

    </style>
</head>
<body>

    <div class="pm-container">
        
        <div class="pm-header">
            <div>
                <span class="status-dot"></span>
                <span class="header-title" id="header-username">Target User</span>
            </div>
            <button class="btn-close" onclick="window.location.href='index.html'">EXIT CHANNEL</button>
        </div>

        <div class="pm-log" id="pm-log">
            <div style="text-align:center; color:#555; margin-top:20px;">
                --- ENCRYPTED CONNECTION ESTABLISHED ---
            </div>
        </div>

        <div class="pm-input-area">
            <input type="file" id="media-input" accept="image/*,video/*" style="display: none;">
            <button class="btn-attach" id="btn-upload" title="Send Media">+</button>
            
            <input type="text" id="msg-input" placeholder="Enter secure message..." autocomplete="off">
            <button class="btn-send" id="btn-send">SEND</button>
        </div>

    </div>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. User & Room Logic
        const params = new URLSearchParams(window.location.search);
        const targetUser = params.get('with');
        const myUsername = localStorage.getItem('username');

        // Safety Redirects
        if (!myUsername) window.location.href = "settings.html";
        if (!targetUser) window.location.href = "index.html";
        if (myUsername === targetUser) {
            alert("Cannot PM yourself.");
            window.location.href = "index.html";
        }

        // Set Header
        document.getElementById('header-username').innerText = targetUser;

        // Generate Unique Room ID (Alphabetical Sort)
        // Ensure "Alice_Bob" is same room as "Bob_Alice"
        const roomID = [myUsername, targetUser].sort().join('_');
        const pmRef = db.ref('private_messages/' + roomID);

        // 3. UI Elements
        const log = document.getElementById('pm-log');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('btn-send');
        const mediaInput = document.getElementById('media-input');
        const uploadBtn = document.getElementById('btn-upload');

        // 4. Send Logic
        function sendMessage(text = "", mediaType = null, mediaData = null) {
            if (!text && !mediaData) return;

            const payload = {
                from: myUsername,
                text: text,
                mediaType: mediaType,
                mediaData: mediaData,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            // A. Send to Chat History
            pmRef.push(payload);

            // B. Send Notification to Target (so they get the popup)
            db.ref('notifications/' + targetUser).push({
                type: 'pm',
                from: myUsername,
                timestamp: Date.now()
            });

            input.value = "";
        }

        sendBtn.onclick = () => sendMessage(input.value.trim());
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(input.value.trim());
        });

        // 5. Media Logic
        uploadBtn.onclick = () => mediaInput.click();
        mediaInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2097152) { // 2MB Limit
                alert("File too large (Max 2MB)"); 
                return;
            }

            const reader = new FileReader();
            reader.onload = (evt) => {
                const type = file.type.startsWith('image') ? 'image' : 'video';
                sendMessage("", type, evt.target.result);
            };
            reader.readAsDataURL(file);
            mediaInput.value = ""; // Reset
        }

        // 6. Receive Logic
        pmRef.limitToLast(50).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const isMe = (data.from === myUsername);
            
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${isMe ? 'outgoing' : 'incoming'}`;

            let content = "";
            
            // Sender Name (Only for incoming)
            if(!isMe) content += `<div class="sender-name">${data.from}</div>`;

            // Text/Media
            content += `<div class="bubble">`;
            
            if (data.mediaType === 'image') {
                content += `<img src="${data.mediaData}" class="pm-media">`;
            } else if (data.mediaType === 'video') {
                content += `<video src="${data.mediaData}" class="pm-media" controls></video>`;
            }
            
            if (data.text) content += `<div>${data.text}</div>`;
            
            // Time
            const date = new Date(data.timestamp);
            const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            content += `<div class="timestamp">${timeStr}</div>`;
            
            content += `</div>`; // Close bubble

            wrapper.innerHTML = content;
            log.appendChild(wrapper);
            log.scrollTop = log.scrollHeight;
        });

    </script>
</body>
</html>
