<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secure_line_active</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #050505;
            color: #22c55e;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- STAGE (Active Speaker) --- */
        #stage-area {
            flex-grow: 1; /* Takes up available space */
            background: #000;
            position: relative;
            border-bottom: 2px solid #22c55e;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #stage-video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keep aspect ratio */
        }
        
        .stage-label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #22c55e;
            padding: 5px 10px;
            font-size: 1.5rem;
            z-index: 10;
        }

        /* --- FILMSTRIP (Bottom Row) --- */
        #filmstrip {
            height: 150px;
            background: #111;
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .strip-card {
            width: 200px;
            height: 100%;
            background: #000;
            border: 1px solid #333;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }
        .strip-card:hover { border-color: #facc15; }

        .strip-card video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        .strip-label {
            position: absolute; bottom: 2px; left: 2px;
            background: rgba(0,0,0,0.7);
            color: #fff; font-size: 1rem; padding: 0 4px;
        }

        /* --- CONTROLS --- */
        .controls { position: absolute; top: 10px; right: 10px; z-index: 50; }
        .btn-end { background: #ef4444; color: white; border: none; padding: 5px 15px; font-family: 'VT323'; font-size: 1.2rem; cursor: pointer; }

    </style>
</head>
<body>

    <div id="stage-area">
        <div class="stage-label" id="stage-name">WAITING FOR SPEAKER...</div>
        <video id="stage-video" autoplay playsinline></video>
        <div class="controls">
            <button class="btn-end" onclick="leaveRoom()">DISCONNECT</button>
        </div>
    </div>

    <div id="filmstrip">
        <div class="strip-card" id="local-card">
            <video id="localVideo" autoplay playsinline muted style="transform: scaleX(-1);"></video>
            <div class="strip-label">YOU</div>
        </div>
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, remove, onDisconnect } 
        from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // --- PASTE KEYS HERE ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State
        const peers = {}; // { username: { pc, stream, analyser, dataArray } }
        let localStream = null;
        let activeSpeaker = null;
        let audioContext = null;

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const username = localStorage.getItem('username') || 'Anon';

        if (!roomId) window.location.href = 'folk.html';

        // --- 1. SETUP AUDIO CONTEXT FOR DETECTION ---
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') audioContext.resume();
        }
        document.body.addEventListener('click', initAudioContext); // Resume on interaction

        // --- 2. INIT CALL ---
        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                // Setup DB Presence
                const partRef = ref(db, `folk_calls/${roomId}/participants/${username}`);
                set(partRef, { online: true });
                onDisconnect(partRef).remove();

                // Listen for peers
                onChildAdded(ref(db, `folk_calls/${roomId}/participants`), snap => {
                    const peerName = snap.key;
                    if (peerName !== username) {
                        if (username > peerName) createPeer(peerName, true);
                        else createPeer(peerName, false);
                    }
                });

                // Listen for signals
                onChildAdded(ref(db, `folk_calls/${roomId}/signals/${username}`), async snap => {
                    const data = snap.val();
                    const sender = data.from;
                    if (!peers[sender]) createPeer(sender, false);
                    const pc = peers[sender].pc;

                    if (data.type === 'offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        push(ref(db, `folk_calls/${roomId}/signals/${sender}`), { type: 'answer', from: username, answer });
                    } else if (data.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                    } else if (data.type === 'candidate') {
                        try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
                    }
                    remove(snap.ref);
                });

                // Start Speaker Detection Loop
                setInterval(checkActiveSpeaker, 500);

            } catch(e) { console.error(e); alert("Mic/Cam Error"); }
        }

        // --- 3. PEER LOGIC & AUDIO ANALYSIS ---
        function createPeer(peerName, isInitiator) {
            if (peers[peerName]) return;

            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun1.l.google.com:19302' }] });
            
            // Prepare Object
            peers[peerName] = { pc: pc, stream: new MediaStream(), analyser: null };

            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            pc.onicecandidate = e => {
                if (e.candidate) push(ref(db, `folk_calls/${roomId}/signals/${peerName}`), { type: 'candidate', from: username, candidate: e.candidate.toJSON() });
            };

            pc.ontrack = e => {
                const stream = peers[peerName].stream;
                stream.addTrack(e.track);

                // Setup Audio Analysis
                if (e.track.kind === 'audio') {
                    initAudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    const analyser = audioContext.createAnalyser();
                    analyser.fftSize = 64;
                    source.connect(analyser);
                    peers[peerName].analyser = analyser;
                    peers[peerName].dataArray = new Uint8Array(analyser.frequencyBinCount);
                }

                // Create Video Element in Filmstrip
                addVideoToStrip(peerName, stream);
            };

            if (isInitiator) {
                pc.onnegotiationneeded = async () => {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    push(ref(db, `folk_calls/${roomId}/signals/${peerName}`), { type: 'offer', from: username, offer });
                };
            }
        }

        // --- 4. UI FUNCTIONS ---
        function addVideoToStrip(name, stream) {
            if (document.getElementById(`card-${name}`)) return;

            const div = document.createElement('div');
            div.className = 'strip-card';
            div.id = `card-${name}`;
            div.onclick = () => promoteToStage(name); // Manual override

            const vid = document.createElement('video');
            vid.autoplay = true; vid.playsInline = true;
            vid.srcObject = stream;

            const label = document.createElement('div');
            label.className = 'strip-label';
            label.innerText = name;

            div.appendChild(vid);
            div.appendChild(label);
            document.getElementById('filmstrip').appendChild(div);
            
            // If nobody on stage, put this person there
            if (!activeSpeaker) promoteToStage(name);
        }

        function promoteToStage(name) {
            if (activeSpeaker === name) return;
            activeSpeaker = name;

            document.getElementById('stage-name').innerText = name;
            const stageVid = document.getElementById('stage-video');
            
            // Get stream from peers object
            if (peers[name] && peers[name].stream) {
                stageVid.srcObject = peers[name].stream;
            }
        }

        // --- 5. SPEAKER DETECTION ---
        function checkActiveSpeaker() {
            if (!audioContext) return;
            
            let maxVol = 0;
            let loudestPeer = null;

            for (const name in peers) {
                const p = peers[name];
                if (p.analyser && p.dataArray) {
                    p.analyser.getByteFrequencyData(p.dataArray);
                    // Calculate average volume
                    let sum = 0;
                    for (let i = 0; i < p.dataArray.length; i++) sum += p.dataArray[i];
                    const avg = sum / p.dataArray.length;

                    if (avg > maxVol) {
                        maxVol = avg;
                        loudestPeer = name;
                    }
                }
            }

            // Threshold to switch (prevent jitter) - e.g. volume > 10
            if (loudestPeer && maxVol > 10 && loudestPeer !== activeSpeaker) {
                promoteToStage(loudestPeer);
            }
        }

        window.leaveRoom = function() {
            remove(ref(db, `folk_calls/${roomId}/participants/${username}`));
            window.location.href = 'folk.html';
        };

        init();
    </script>
</body>
</html>
