<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secure_line_active</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #050505;
            color: #22c55e;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- STAGE (Active Speaker) --- */
        #stage-area {
            flex-grow: 1; 
            background: #000;
            position: relative;
            border-bottom: 2px solid #22c55e;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #stage-video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
        
        .stage-label {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #22c55e;
            padding: 5px 10px;
            font-size: 1.5rem;
            z-index: 10;
        }

        /* --- FILMSTRIP (Bottom Row) --- */
        #filmstrip {
            height: 150px;
            background: #111;
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .strip-card {
            width: 200px;
            height: 100%;
            background: #000;
            border: 1px solid #333;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }
        .strip-card:hover { border-color: #facc15; }

        .strip-card video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        .strip-label {
            position: absolute; bottom: 2px; left: 2px;
            background: rgba(0,0,0,0.7);
            color: #fff; font-size: 1rem; padding: 0 4px;
        }

        .connection-status {
            position: absolute; top: 2px; right: 2px;
            font-size: 0.8rem; background: rgba(0,0,0,0.8);
            padding: 2px; color: #facc15;
        }

        /* --- CONTROLS --- */
        .controls { position: absolute; top: 10px; right: 10px; z-index: 50; }
        .btn-end { background: #ef4444; color: white; border: none; padding: 5px 15px; font-family: 'VT323'; font-size: 1.2rem; cursor: pointer; }
        
        /* Debug Log Overlay */
        #status-log {
            position: absolute; bottom: 160px; left: 10px; 
            color: #666; font-size: 14px; pointer-events: none;
            text-shadow: 1px 1px 0 #000;
            max-height: 200px; overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="stage-area">
        <div class="stage-label" id="stage-name">WAITING FOR SIGNAL...</div>
        <div id="status-log">System Initializing...</div>
        <video id="stage-video" autoplay playsinline></video>
        <div class="controls">
            <button class="btn-end" onclick="leaveRoom()">DISCONNECT</button>
        </div>
    </div>

    <div id="filmstrip">
        <div class="strip-card" id="local-card">
            <video id="localVideo" autoplay playsinline muted style="transform: scaleX(-1);"></video>
            <div class="strip-label">YOU</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, remove, onDisconnect } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


// --- PASTE YOUR API KEYS HERE ---
     const firebaseConfig = {
     apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
    authDomain: "ewsitechat.firebaseapp.com",
    databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
    projectId: "ewsitechat",
    storageBucket: "ewsitechat.firebasestorage.app",
    messagingSenderId: "282495574514",
    appId: "1:282495574514:web:e2781da630d93fc1ce8b6b",
    measurementId: "G-GTN3TL1P2K"
    };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State
        const peers = {}; 
        let localStream = null;
        let activeSpeaker = null;
        let audioContext = null;

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const username = localStorage.getItem('username') || 'Anon_' + Math.floor(Math.random()*1000);

        if (!roomId) window.location.href = 'folk.html';

        function log(msg) {
            console.log(`[LOG] ${msg}`);
            document.getElementById('status-log').innerText = msg + "\n" + document.getElementById('status-log').innerText;
        }

        // --- 1. SETUP AUDIO ---
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') audioContext.resume();
        }
        document.body.addEventListener('click', initAudioContext);

        // --- 2. INIT CALL ---
        async function init() {
            try {
                // CLEANUP: Remove any old signals for me before starting
                await remove(ref(db, `folk_calls/${roomId}/signals/${username}`));
                
                log("Requesting Camera/Mic...");
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                log("Camera Active.");

                // Join the room
                const partRef = ref(db, `folk_calls/${roomId}/participants/${username}`);
                set(partRef, { online: true });
                onDisconnect(partRef).remove();
                onDisconnect(ref(db, `folk_calls/${roomId}/signals/${username}`)).remove();

                // Listen for other participants
                onChildAdded(ref(db, `folk_calls/${roomId}/participants`), snap => {
                    const peerName = snap.key;
                    if (peerName !== username) {
                        log(`Discovered peer: ${peerName}`);
                        // Alphabetical sort decides who calls whom to prevent collisions
                        if (username > peerName) createPeer(peerName, true);
                        else createPeer(peerName, false);
                    }
                });

                // Listen for signals sent TO me
                onChildAdded(ref(db, `folk_calls/${roomId}/signals/${username}`), async snap => {
                    const data = snap.val();
                    const sender = data.from;
                    
                    if (!peers[sender]) createPeer(sender, false);
                    const pc = peers[sender].pc;

                    try {
                        if (data.type === 'offer') {
                            log(`Received OFFER from ${sender}`);
                            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                            processCandidateQueue(sender);

                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);
                            
                            push(ref(db, `folk_calls/${roomId}/signals/${sender}`), { 
                                type: 'answer', from: username, answer 
                            });
                        } 
                        else if (data.type === 'answer') {
                            log(`Received ANSWER from ${sender}`);
                            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                            processCandidateQueue(sender);
                        } 
                        else if (data.type === 'candidate') {
                            if (pc.remoteDescription) {
                                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                            } else {
                                peers[sender].candidateQueue.push(data.candidate);
                            }
                        }
                    } catch (err) {
                        log(`Signal Error with ${sender}: ${err.message}`);
                    }
                    remove(snap.ref); // Delete signal after reading
                });

                // Start Speaker Detection
                setInterval(checkActiveSpeaker, 500);

            } catch(e) { 
                log("FATAL ERROR: " + e.message); 
                alert("Could not start call: " + e.message);
            }
        }

        // --- 3. PEER LOGIC ---
        function createPeer(peerName, isInitiator) {
            if (peers[peerName]) return;
            log(`Connecting to ${peerName}... (Initiator: ${isInitiator})`);

            const pc = new RTCPeerConnection({ 
                iceServers: [
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ] 
            });
            
            peers[peerName] = { 
                pc: pc, 
                stream: new MediaStream(), 
                analyser: null,
                candidateQueue: [] 
            };

            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            // Connection State Monitoring
            pc.onconnectionstatechange = () => {
                log(`Connection ${peerName}: ${pc.connectionState}`);
                updateStatus(peerName, pc.connectionState);
                if (pc.connectionState === 'failed') {
                    // Optional: retry logic could go here
                }
            };

            pc.onicecandidate = e => {
                if (e.candidate) {
                    push(ref(db, `folk_calls/${roomId}/signals/${peerName}`), { 
                        type: 'candidate', from: username, candidate: e.candidate.toJSON() 
                    });
                }
            };

            pc.ontrack = e => {
                log(`Got Stream Track from ${peerName}`);
                const stream = peers[peerName].stream;
                stream.addTrack(e.track);

                if (e.track.kind === 'audio') {
                    initAudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    const analyser = audioContext.createAnalyser();
                    analyser.fftSize = 64;
                    source.connect(analyser);
                    peers[peerName].analyser = analyser;
                    peers[peerName].dataArray = new Uint8Array(analyser.frequencyBinCount);
                }

                addVideoToStrip(peerName, stream);
            };

            if (isInitiator) {
                pc.onnegotiationneeded = async () => {
                    try {
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        push(ref(db, `folk_calls/${roomId}/signals/${peerName}`), { 
                            type: 'offer', from: username, offer 
                        });
                    } catch (e) { log("Negotation Error: " + e.message); }
                };
            }
        }

        async function processCandidateQueue(peerName) {
            const p = peers[peerName];
            while (p.candidateQueue.length > 0) {
                const cand = p.candidateQueue.shift();
                try { await p.pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
            }
        }

        // --- 4. UI FUNCTIONS ---
        function addVideoToStrip(name, stream) {
            if (document.getElementById(`card-${name}`)) return;

            const div = document.createElement('div');
            div.className = 'strip-card';
            div.id = `card-${name}`;
            div.onclick = () => promoteToStage(name); 

            const vid = document.createElement('video');
            vid.autoplay = true; vid.playsInline = true;
            vid.srcObject = stream;

            const label = document.createElement('div');
            label.className = 'strip-label';
            label.innerText = name;

            const status = document.createElement('div');
            status.className = 'connection-status';
            status.id = `status-${name}`;
            status.innerText = 'Connecting...';

            div.appendChild(vid);
            div.appendChild(label);
            div.appendChild(status);
            document.getElementById('filmstrip').appendChild(div);
            
            if (!activeSpeaker) promoteToStage(name);
        }

        function updateStatus(name, state) {
            const el = document.getElementById(`status-${name}`);
            if (el) el.innerText = state;
        }

        function promoteToStage(name) {
            if (activeSpeaker === name) return;
            activeSpeaker = name;
            document.getElementById('stage-name').innerText = name;
            const stageVid = document.getElementById('stage-video');
            if (peers[name] && peers[name].stream) stageVid.srcObject = peers[name].stream;
        }

        function checkActiveSpeaker() {
            if (!audioContext) return;
            let maxVol = 0;
            let loudestPeer = null;

            for (const name in peers) {
                const p = peers[name];
                if (p.analyser && p.dataArray) {
                    p.analyser.getByteFrequencyData(p.dataArray);
                    let sum = 0;
                    for (let i = 0; i < p.dataArray.length; i++) sum += p.dataArray[i];
                    const avg = sum / p.dataArray.length;
                    if (avg > maxVol) { maxVol = avg; loudestPeer = name; }
                }
            }

            if (loudestPeer && maxVol > 15 && loudestPeer !== activeSpeaker) {
                promoteToStage(loudestPeer);
            }
        }

        window.leaveRoom = function() {
            remove(ref(db, `folk_calls/${roomId}/participants/${username}`));
            window.location.href = 'folk.html';
        };

        init();
    </script>
</body>
</html>
