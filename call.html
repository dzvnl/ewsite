<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #000; --control-bg: rgba(20, 20, 20, 0.9); --accent: #22c55e; --danger: #ef4444; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-color); overflow: hidden; font-family: monospace; }
        
        #videos-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
        
        #local-video-wrapper { position: absolute; bottom: 20px; right: 20px; width: 280px; height: 157px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.8); border: 1px solid #333; background: #111; z-index: 10; }
        
        /* Local video is mirrored by default (for webcam), but un-mirrored for screen share */
        #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); transition: transform 0.3s; }
        #localVideo.screen-sharing { transform: scaleX(1); }
        
        #controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: var(--control-bg); padding: 15px 30px; border-radius: 50px; border: 1px solid #333; z-index: 20; }
        .btn { background: #333; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; transition: all 0.2s; }
        .btn:hover { background: #444; transform: scale(1.1); }
        .btn.active { background: var(--accent); color: black; }

        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #start-btn { padding: 20px 40px; font-size: 2rem; background: var(--accent); color: black; border: none; cursor: pointer; font-family: 'Courier New'; font-weight: bold; margin-top: 20px; }

        #status-log { position: absolute; top: 20px; left: 20px; color: #0f0; font-size: 14px; z-index: 100; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 4px; pointer-events: none; font-family: 'Courier New'; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div style="font-size: 1.5rem; text-align:center;">SECURE LINK READY</div>
        <button id="start-btn">CONNECT</button>
    </div>

    <div id="status-log">Initializing...</div>

    <div id="videos-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="local-video-wrapper">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div id="controls">
            <button class="btn" id="btn-mic"><i class="fas fa-microphone"></i></button>
            <button class="btn" id="btn-cam"><i class="fas fa-video"></i></button>
            <button class="btn" id="btn-screen" title="Share Screen"><i class="fas fa-desktop"></i></button>
            <button class="btn" id="btn-hangup" style="background-color: #ef4444;"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const servers = {
            iceServers: [
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        const pc = new RTCPeerConnection(servers);
        let localStream = null;
        let candidatesQueue = [];
        
        // Screen Share Variables
        let isScreenSharing = false;
        let localCamTrack = null; 

        const statusLog = document.getElementById('status-log');
        function log(msg) {
            console.log(msg);
            statusLog.innerText = msg + "\n" + statusLog.innerText.split('\n').slice(0, 4).join('\n');
        }

        document.getElementById('start-btn').onclick = async () => {
            document.getElementById('start-overlay').style.display = 'none';
            await init();
        };

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            const recipient = urlParams.get('recipient');
            const myIdentity = localStorage.getItem('chat_identity');

            if (!roomId) return log("Error: No Room ID");

            const isCaller = (recipient !== myIdentity);
            log(`Role: ${isCaller ? 'CALLER' : 'RECEIVER'}`);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                
                // Store the camera track so we can switch back to it later
                localCamTrack = localStream.getVideoTracks()[0];

                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // --- Remote Stream Handling ---
                pc.ontrack = event => {
                    const remoteVid = document.getElementById('remoteVideo');
                    // Prevent double loading interruption
                    if (remoteVid.srcObject !== event.streams[0]) {
                        log("Remote Stream Active");
                        remoteVid.srcObject = event.streams[0];
                        remoteVid.onloadedmetadata = () => {
                            remoteVid.play().catch(e => log("Play Error: " + e.message));
                        };
                    }
                };

                startSignaling(roomId, isCaller);

            } catch (err) {
                log("Error: " + err.message);
            }
        }

        async function startSignaling(roomId, isCaller) {
            const roomRef = ref(db, `rooms/${roomId}`);

            pc.onicecandidate = event => {
                if (event.candidate) {
                    const target = isCaller ? 'callerCandidates' : 'calleeCandidates';
                    push(ref(db, `rooms/${roomId}/${target}`), event.candidate.toJSON());
                }
            };

            if (isCaller) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await set(roomRef, { offer: { type: offer.type, sdp: offer.sdp } });
                log("Offer Sent.");

                onValue(ref(db, `rooms/${roomId}/answer`), async (snap) => {
                    const answer = snap.val();
                    if (answer && !pc.currentRemoteDescription) {
                        log("Answer Received.");
                        await pc.setRemoteDescription(new RTCSessionDescription(answer));
                        processCandidateQueue(); 
                    }
                });

                onChildAdded(ref(db, `rooms/${roomId}/calleeCandidates`), (snap) => handleCandidate(snap.val()));

            } else {
                log("Waiting for Offer...");
                onValue(ref(db, `rooms/${roomId}/offer`), async (snap) => {
                    const offer = snap.val();
                    if (offer && !pc.currentRemoteDescription) {
                        log("Offer Received.");
                        await pc.setRemoteDescription(new RTCSessionDescription(offer));
                        processCandidateQueue(); 
                        
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        await set(ref(db, `rooms/${roomId}/answer`), { type: answer.type, sdp: answer.sdp });
                        log("Answer Sent.");
                    }
                });

                onChildAdded(ref(db, `rooms/${roomId}/callerCandidates`), (snap) => handleCandidate(snap.val()));
            }
        }

        function handleCandidate(candidateVal) {
            const candidate = new RTCIceCandidate(candidateVal);
            if (pc.remoteDescription) {
                pc.addIceCandidate(candidate).catch(e => console.error("ICE Error", e));
            } else {
                candidatesQueue.push(candidate);
            }
        }

        function processCandidateQueue() {
            if (candidatesQueue.length > 0) {
                candidatesQueue.forEach(cand => {
                    pc.addIceCandidate(cand).catch(e => console.error("ICE Error", e));
                });
                candidatesQueue = [];
            }
        }

        // --- Screen Sharing Logic ---
        const btnScreen = document.getElementById('btn-screen');
        const localVideo = document.getElementById('localVideo');

        btnScreen.onclick = async () => {
            if (!isScreenSharing) {
                try {
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = displayStream.getVideoTracks()[0];

                    // Replace the video track being sent to the peer
                    const sender = pc.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(screenTrack);

                    // Show screen on local view (and un-mirror it so text is readable)
                    localVideo.srcObject = displayStream;
                    localVideo.classList.add('screen-sharing');
                    
                    isScreenSharing = true;
                    btnScreen.classList.add('active');

                    // Handle if user clicks "Stop Sharing" on the browser popup
                    screenTrack.onended = () => stopScreenSharing();

                } catch (err) {
                    console.error("Screen Share cancelled or failed:", err);
                }
            } else {
                stopScreenSharing();
            }
        };

        function stopScreenSharing() {
            if (!isScreenSharing) return;
            
            // Switch back to camera track
            const sender = pc.getSenders().find(s => s.track.kind === 'video');
            if (sender && localCamTrack) sender.replaceTrack(localCamTrack);

            // Reset local view
            localVideo.srcObject = localStream;
            localVideo.classList.remove('screen-sharing');
            
            isScreenSharing = false;
            btnScreen.classList.remove('active');
        }

        document.getElementById('btn-hangup').onclick = () => window.location.href = "users.html";
        
        // Mic/Cam Toggles
        document.getElementById('btn-mic').onclick = function() {
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            this.querySelector('i').className = track.enabled ? 'fas fa-microphone' : 'fas fa-microphone-slash';
        }
        document.getElementById('btn-cam').onclick = function() {
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            this.querySelector('i').className = track.enabled ? 'fas fa-video' : 'fas fa-video-slash';
        }

    </script>
</body>
</html>
