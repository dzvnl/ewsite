<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000;
            --control-bg: rgba(20, 20, 20, 0.9);
            --accent: #22c55e;
            --danger: #ef4444;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: monospace;
        }

        /* --- Layout --- */
        #videos-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* Remote Video (Full Screen) */
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Local Video (Bottom Right, PIP) */
        #local-video-wrapper {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 280px;
            height: 157px; /* 16:9 aspect ratio */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #333;
            background: #111;
            z-index: 10;
            transition: all 0.3s ease;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror local view */
        }
        
        #localVideo.screen-sharing {
            transform: scaleX(1); /* Don't mirror text when sharing screen */
        }

        /* --- Indicators --- */
        .status-indicator {
            position: absolute;
            top: 10px; left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: flex; gap: 8px;
            pointer-events: none;
        }

        .icon-off { color: var(--danger); }

        /* --- Controls --- */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: var(--control-bg);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid #333;
            z-index: 20;
        }

        .btn {
            background: #333;
            border: none;
            width: 55px; height: 55px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px;
            transition: all 0.2s;
        }

        .btn:hover { background: #444; transform: scale(1.1); }
        .btn.active { background: var(--accent); color: #000; }
        .btn.disabled-state { background: var(--danger); color: white; }

        #room-info {
            position: absolute;
            top: 20px; left: 20px;
            color: #666;
            font-size: 0.9rem;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="room-info">Initializing Secure Link...</div>

    <div id="videos-container">
        <video id="remoteVideo" autoplay playsinline></video>
        
        <div id="local-video-wrapper">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="status-indicator" id="local-indicators"></div>
        </div>

        <div id="controls">
            <button class="btn" id="btn-mic" title="Toggle Mic">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="btn" id="btn-cam" title="Toggle Camera">
                <i class="fas fa-video"></i>
            </button>
            <button class="btn" id="btn-screen" title="Share Screen">
                <i class="fas fa-desktop"></i>
            </button>
            <button class="btn" id="btn-hangup" title="Hangup" style="background-color: #ef4444;">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script type="module">
        // Using the exact same version as your users.html for compatibility
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // Your Config
        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- WebRTC Configuration ---
        const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
            ]
        };

        const pc = new RTCPeerConnection(servers);
        let localStream = null;
        let remoteStream = null;
        let isScreenSharing = false;
        let localCamTrack = null; 

        // HTML Elements
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const btnMic = document.getElementById('btn-mic');
        const btnCam = document.getElementById('btn-cam');
        const btnScreen = document.getElementById('btn-screen');
        const btnHangup = document.getElementById('btn-hangup');
        const roomInfo = document.getElementById('room-info');
        const localIndicators = document.getElementById('local-indicators');

        async function init() {
            // 1. Get Room ID from URL (passed by users.html)
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');

            if (!roomId) {
                alert("Invalid Call ID.");
                window.location.href = "users.html";
                return;
            }

            roomInfo.innerText = `Connected: ${roomId}`;

            // 2. Setup Local Media
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                localCamTrack = localStream.getVideoTracks()[0];

                // Add tracks to PeerConnection
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });

                // Prepare to receive remote stream
                remoteStream = new MediaStream();
                remoteVideo.srcObject = remoteStream;

                pc.ontrack = event => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                };

                // 3. Start Signaling (Handshake)
                await startSignaling(roomId);

            } catch (err) {
                console.error("Media Error:", err);
                alert("Could not access Camera/Mic. Please allow permissions.");
            }
        }

        // --- Signaling Logic (REALTIME DATABASE) ---
        async function startSignaling(roomId) {
            // We use 'rooms' path for the heavy WebRTC SDP data to keep 'calls' light
            const roomRef = ref(db, `rooms/${roomId}`);
            
            // Check if there is already an offer
            // Note: Since we use onValue, this runs once immediately
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val();

                // Logic: If NO data exists yet, I am the CALLER.
                // If data DOES exist (an offer), I am the CALLEE.
                
                // This check ensures we only run the setup once per page load
                if (pc.signalingState !== "stable") return; 

                if (!data) {
                    // --- I AM THE CALLER ---
                    console.log("Creating Offer...");
                    
                    // 1. Create Offer
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);

                    // 2. Send Offer to DB
                    await set(roomRef, {
                        offer: {
                            type: offer.type,
                            sdp: offer.sdp
                        }
                    });

                    // 3. Listen for Answer
                    onValue(ref(db, `rooms/${roomId}/answer`), (snap) => {
                        const answer = snap.val();
                        if (answer && !pc.currentRemoteDescription) {
                            const rtcAnswer = new RTCSessionDescription(answer);
                            pc.setRemoteDescription(rtcAnswer);
                        }
                    });

                    // 4. Send my ICE candidates
                    pc.onicecandidate = event => {
                        if (event.candidate) {
                            push(ref(db, `rooms/${roomId}/callerCandidates`), event.candidate.toJSON());
                        }
                    };

                    // 5. Listen for Callee ICE candidates
                    onChildAdded(ref(db, `rooms/${roomId}/calleeCandidates`), (snap) => {
                        const candidate = new RTCIceCandidate(snap.val());
                        pc.addIceCandidate(candidate);
                    });

                } else if (data.offer && !data.answer) {
                    // --- I AM THE CALLEE ---
                    console.log("Answering Call...");

                    // 1. Set Remote Description (the offer)
                    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

                    // 2. Create Answer
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);

                    // 3. Send Answer to DB
                    await set(ref(db, `rooms/${roomId}/answer`), {
                        type: answer.type,
                        sdp: answer.sdp
                    });

                    // 4. Send my ICE candidates
                    pc.onicecandidate = event => {
                        if (event.candidate) {
                            push(ref(db, `rooms/${roomId}/calleeCandidates`), event.candidate.toJSON());
                        }
                    };

                    // 5. Listen for Caller ICE candidates
                    onChildAdded(ref(db, `rooms/${roomId}/callerCandidates`), (snap) => {
                        const candidate = new RTCIceCandidate(snap.val());
                        pc.addIceCandidate(candidate);
                    });
                }
            }, { onlyOnce: true });
        }

        // --- UI Controls ---

        // 1. Mic
        btnMic.onclick = () => {
            const track = localStream.getAudioTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                toggleBtn(btnMic, track.enabled);
                updateIndicators();
            }
        };

        // 2. Cam
        btnCam.onclick = () => {
            const track = localStream.getVideoTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                toggleBtn(btnCam, track.enabled);
                updateIndicators();
            }
        };

        // 3. Screen Share
        btnScreen.onclick = async () => {
            if (!isScreenSharing) {
                try {
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = displayStream.getVideoTracks()[0];

                    const sender = pc.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(screenTrack);

                    localVideo.srcObject = displayStream;
                    localVideo.classList.add('screen-sharing');
                    
                    isScreenSharing = true;
                    btnScreen.classList.add('active');

                    // If user clicks "Stop Sharing" on browser banner
                    screenTrack.onended = () => stopScreenSharing();
                } catch (e) { console.error(e); }
            } else {
                stopScreenSharing();
            }
        };

        function stopScreenSharing() {
            if (!isScreenSharing) return;
            const sender = pc.getSenders().find(s => s.track.kind === 'video');
            if (sender && localCamTrack) sender.replaceTrack(localCamTrack);

            localVideo.srcObject = localStream;
            localVideo.classList.remove('screen-sharing');
            isScreenSharing = false;
            btnScreen.classList.remove('active');
        }

        // 4. Hangup
        btnHangup.onclick = () => {
            pc.close();
            window.location.href = "users.html";
        };

        // Helper: Styles
        function toggleBtn(btn, isActive) {
            if (isActive) {
                btn.classList.remove('disabled-state');
                const i = btn.querySelector('i');
                if(i.classList.contains('fa-microphone-slash')) i.className = 'fas fa-microphone';
                if(i.classList.contains('fa-video-slash')) i.className = 'fas fa-video';
            } else {
                btn.classList.add('disabled-state');
                const i = btn.querySelector('i');
                if(i.classList.contains('fa-microphone')) i.className = 'fas fa-microphone-slash';
                if(i.classList.contains('fa-video')) i.className = 'fas fa-video-slash';
            }
        }

        function updateIndicators() {
            const audio = localStream.getAudioTracks()[0]?.enabled;
            const video = localStream.getVideoTracks()[0]?.enabled;
            let html = '';
            if (!audio) html += '<i class="fas fa-microphone-slash icon-off"></i>';
            if (!video) html += '<i class="fas fa-video-slash icon-off"></i>';
            localIndicators.innerHTML = html;
        }

        // Start
        init();

    </script>
</body>
</html>
