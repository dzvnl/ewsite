<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE_LINE | TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #22c55e;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
        }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #localVideo {
            position: absolute; bottom: 20px; right: 20px;
            width: 180px; height: 130px;
            border: 2px solid #22c55e; object-fit: cover;
            z-index: 10; transform: scaleX(-1);
        }
        .status-overlay {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.8); padding: 12px;
            border: 1px solid #22c55e; z-index: 20; font-size: 1.4rem;
        }
        .btn-end { 
            position: absolute; bottom: 20px; left: 20px;
            background: #ef4444; color: #fff; padding: 10px 20px;
            font-family: 'VT323'; font-size: 1.5rem; border: none; cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div id="statusText" class="status-overlay">SIGNAL: INITIALIZING...</div>
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <button class="btn-end" id="terminateBtn">TERMINATE</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, push, onChildAdded, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const servers = {
            iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }],
            iceCandidatePoolSize: 10,
        };

        const pc = new RTCPeerConnection(servers);
        let localStream = null;
        let remoteStream = new MediaStream();

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const statusText = document.getElementById('statusText');

        async function startCall() {
            document.getElementById('remoteVideo').srcObject = remoteStream;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                pc.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
                    statusText.innerText = "SIGNAL: ENCRYPTED LINK ACTIVE";
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        const type = pc.localDescription.type === 'offer' ? 'offerCandidates' : 'answerCandidates';
                        push(ref(db, `calls/${roomId}/${type}`), event.candidate.toJSON());
                    }
                };

                const callRef = ref(db, `calls/${roomId}`);
                const snapshot = await get(callRef);
                const data = snapshot.val();

                if (!data || !data.offer) {
                    // CALLER
                    const offerDescription = await pc.createOffer();
                    await pc.setLocalDescription(offerDescription);
                    await set(callRef, { offer: { type: offerDescription.type, sdp: offerDescription.sdp } });

                    onValue(callRef, (snap) => {
                        const d = snap.val();
                        if (!pc.remoteDescription && d?.answer) {
                            pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                        }
                    });

                    onChildAdded(ref(db, `calls/${roomId}/answerCandidates`), (snap) => {
                        pc.addIceCandidate(new RTCIceCandidate(snap.val()));
                    });
                } else {
                    // RECEIVER
                    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answerDescription = await pc.createAnswer();
                    await pc.setLocalDescription(answerDescription);
                    await update(callRef, { answer: { type: answerDescription.type, sdp: answerDescription.sdp } });

                    onChildAdded(ref(db, `calls/${roomId}/offerCandidates`), (snap) => {
                        pc.addIceCandidate(new RTCIceCandidate(snap.val()));
                    });
                }
            } catch (e) {
                statusText.innerText = "ERROR: CAMERA DENIED";
            }
        }

        // Handle the disconnect button inside the module
        document.getElementById('terminateBtn').onclick = () => {
            pc.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            window.location.href = 'users.html';
        };

        if (!roomId) {
            alert("NO ROOM ID FOUND");
            window.location.href = "users.html";
        } else {
            startCall();
        }
    </script>
</body>
</html>
