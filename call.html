<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, push, onChildAdded, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
        authDomain: "ewsitechat.firebaseapp.com",
        databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
        projectId: "ewsitechat",
        storageBucket: "ewsitechat.firebasestorage.app",
        messagingSenderId: "282495574514",
        appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const servers = {
        iceServers: [
            { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
        ]
    };

    const pc = new RTCPeerConnection(servers);
    let localStream = null;

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    const statusText = document.getElementById('statusText');

    // 1. Setup Local Media
    async function start() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                statusText.innerText = "STATUS: SECURE CONNECTION ESTABLISHED";
            };

            // Logic to handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    // We store candidates in two separate paths so we don't trigger our own listeners
                    const type = pc.localDescription.type; // 'offer' or 'answer'
                    push(ref(db, `calls/${roomId}/${type}Candidates`), event.candidate.toJSON());
                }
            };

            initSignaling();
        } catch (e) {
            statusText.innerText = "ERROR: CAMERA BLOCKED";
            console.error(e);
        }
    }

    // 2. Signaling Logic
    async function initSignaling() {
        const callRef = ref(db, `calls/${roomId}`);
        const snapshot = await get(callRef);
        const data = snapshot.val();

        if (!data || !data.offer) {
            // I AM THE CALLER
            statusText.innerText = "STATUS: DIALING...";
            const offerDescription = await pc.createOffer();
            await pc.setLocalDescription(offerDescription);
            await update(callRef, { offer: { type: offerDescription.type, sdp: offerDescription.sdp } });

            // Listen for the Answer
            onValue(callRef, (snapshot) => {
                const data = snapshot.val();
                if (!pc.remoteDescription && data?.answer) {
                    pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
            });

            // Listen for Answerer's ICE candidates
            onChildAdded(ref(db, `calls/${roomId}/answerCandidates`), (snapshot) => {
                pc.addIceCandidate(new RTCIceCandidate(snapshot.val()));
            });

        } else {
            // I AM THE RECEIVER
            statusText.innerText = "STATUS: CONNECTING...";
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            
            const answerDescription = await pc.createAnswer();
            await pc.setLocalDescription(answerDescription);
            await update(callRef, { answer: { type: answerDescription.type, sdp: answerDescription.sdp } });

            // Listen for Caller's ICE candidates
            onChildAdded(ref(db, `calls/${roomId}/offerCandidates`), (snapshot) => {
                pc.addIceCandidate(new RTCIceCandidate(snapshot.val()));
            });
        }
    }

    window.endCall = () => {
        pc.close();
        window.location.href = 'users.html';
    };

    start();
</script>
