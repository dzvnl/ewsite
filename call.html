<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calling...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: #e5e5e5;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        .call-header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #333;
            background: #111;
        }

        .status-text {
            font-size: 1.5rem;
            color: #facc15;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Split screen */
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            align-items: center;
        }

        /* --- VIDEO BOXES --- */
        .video-box {
            background: #111;
            border: 2px solid #444;
            height: 100%;
            max-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect for self */
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            font-size: 1.2rem;
            border: 1px solid #555;
        }

        /* --- CONTROLS --- */
        .controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: #111;
            border-top: 2px solid #333;
        }

        .btn {
            border: 2px solid;
            background: transparent;
            color: #fff;
            font-family: 'VT323';
            font-size: 1.5rem;
            padding: 10px 30px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-end { border-color: #ef4444; color: #ef4444; }
        .btn-end:hover { background: #ef4444; color: #000; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Responsive: Stack videos on mobile */
        @media (max-width: 768px) {
            .video-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="call-header">
        <div id="status" class="status-text">CONNECTING...</div>
        <div id="room-id" style="font-size: 1rem; color: #666; margin-top: 5px;"></div>
    </div>

    <div class="video-grid">
        <div class="video-box">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="video-label">YOU</div>
        </div>

        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-label" id="remoteLabel">WAITING...</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-end" onclick="endCall()">END CALL</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Get URL Params
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const recipientName = urlParams.get('recipient');

        const localVideo = document.getElementById('localVideo');
        const remoteLabel = document.getElementById('remoteLabel');
        const statusText = document.getElementById('status');
        const roomIdDisplay = document.getElementById('room-id');

        // Validation
        if (!roomId) {
            alert("No Call ID found.");
            window.location.href = 'users.html';
        }

        roomIdDisplay.innerText = `ID: ${roomId}`;
        if(recipientName) remoteLabel.innerText = recipientName;

        // --- 1. SETUP MEDIA (CAMERA/MIC) ---
        async function startMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
                statusText.innerText = `DIALING ${recipientName || 'USER'}...`;
                
                // NOTE: Here is where you would normally attach this stream to a WebRTC PeerConnection
            } catch (error) {
                console.error("Error accessing media:", error);
                alert("Could not access camera/microphone.");
                statusText.innerText = "MEDIA ERROR";
                statusText.style.color = "#ef4444";
            }
        }

        // --- 2. LISTEN TO CALL STATUS ---
        // This ensures if one person hangs up, the other person knows.
        const callRef = ref(db, `calls/${roomId}`);
        
        onValue(callRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                // Call entry deleted (ended)
                alert("Call ended.");
                window.location.href = 'users.html';
                return;
            }

            if (data.status === 'active') {
                statusText.innerText = "CONNECTED";
                statusText.style.color = "#22c55e";
                statusText.style.animation = "none";
            }
        });

        // --- 3. END CALL FUNCTION ---
        window.endCall = () => {
            // Stop tracks (turn off camera light)
            if (localVideo.srcObject) {
                localVideo.srcObject.getTracks().forEach(track => track.stop());
            }

            // Remove call from database (signals end to other user)
            remove(callRef).then(() => {
                window.location.href = 'users.html';
            });
        };

        // --- AUTH CHECK & START ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                startMedia();
                
                // If we are the recipient joining, update status to active
                // (Logic: If I am not the caller listed in DB, I must be the answerer)
                // For simplicity in this structure, we just ensure media runs.
            } else {
                window.location.href = 'index.html';
            }
        });

    </script>
</body>
</html>
