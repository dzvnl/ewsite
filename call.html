<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #000; --control-bg: rgba(20, 20, 20, 0.9); --accent: #22c55e; --danger: #ef4444; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-color); overflow: hidden; font-family: monospace; }
        
        #videos-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; }
        
        /* Remote Video */
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
        
        /* Local Video */
        #local-video-wrapper { position: absolute; bottom: 20px; right: 20px; width: 280px; height: 157px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.8); border: 1px solid #333; background: #111; z-index: 10; }
        #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #localVideo.screen-sharing { transform: scaleX(1); }

        /* Controls */
        #controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: var(--control-bg); padding: 15px 30px; border-radius: 50px; border: 1px solid #333; z-index: 20; }
        .btn { background: #333; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; transition: all 0.2s; }
        .btn:hover { background: #444; transform: scale(1.1); }
        .btn.disabled-state { background: var(--danger); color: white; }

        /* Overlay */
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #start-btn { padding: 20px 40px; font-size: 2rem; background: var(--accent); color: black; border: none; cursor: pointer; font-family: 'Courier New'; font-weight: bold; margin-top: 20px; }

        /* Debug Log */
        #status-log { position: absolute; top: 20px; left: 20px; color: #0f0; font-size: 14px; z-index: 100; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 4px; pointer-events: none; font-family: 'Courier New'; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div id="overlay-msg" style="font-size: 1.5rem; text-align:center;">
            SECURE CONNECTION READY<br>
            <span style="font-size: 1rem; color:#888;">Click to Initialize Media Stream</span>
        </div>
        <button id="start-btn">ESTABLISH LINK</button>
    </div>

    <div id="status-log">Waiting for user...</div>

    <div id="videos-container">
        <video id="remoteVideo" autoplay playsinline></video>
        
        <div id="local-video-wrapper">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div id="controls">
            <button class="btn" id="btn-mic"><i class="fas fa-microphone"></i></button>
            <button class="btn" id="btn-cam"><i class="fas fa-video"></i></button>
            <button class="btn" id="btn-hangup" style="background-color: #ef4444;"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- IMPROVED SERVER LIST ---
        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ]
        };

        const pc = new RTCPeerConnection(servers);
        let localStream = null;

        // Elements
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusLog = document.getElementById('status-log');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');

        function log(msg) {
            console.log(msg);
            statusLog.innerText = msg + "\n" + statusLog.innerText.split('\n').slice(0, 4).join('\n');
        }

        // --- 1. USER START ---
        startBtn.onclick = async () => {
            startOverlay.style.display = 'none';
            await init();
        };

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            const recipient = urlParams.get('recipient');
            const myIdentity = localStorage.getItem('chat_identity');

            if (!roomId) return log("Error: Missing Room ID");

            const isCaller = (recipient !== myIdentity);
            log(`Role: ${isCaller ? 'CALLER' : 'RECEIVER'} | Room: ${roomId}`);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // --- TRACK HANDLER ---
                pc.ontrack = (event) => {
                    log("Stream Tracks Received!");
                    const [remoteStream] = event.streams;
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.play().catch(e => log("Play Error: " + e.message));
                };

                // --- CONNECTION STATE DEBUGGER ---
                pc.oniceconnectionstatechange = () => {
                    log(`ICE State: ${pc.iceConnectionState}`);
                    if (pc.iceConnectionState === 'failed') {
                        log("CRITICAL: Network blocked connection.");
                    }
                };

                startSignaling(roomId, isCaller);

            } catch (err) {
                log("Media Error: " + err.message);
            }
        }

        async function startSignaling(roomId, isCaller) {
            const roomRef = ref(db, `rooms/${roomId}`);

            if (isCaller) {
                // I AM CALLER
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                // Send Offer
                await set(roomRef, { offer: { type: offer.type, sdp: offer.sdp } });
                log("Offer sent.");

                // Wait for Answer
                onValue(ref(db, `rooms/${roomId}/answer`), (snap) => {
                    const answer = snap.val();
                    if (answer && !pc.currentRemoteDescription) {
                        log("Answer received!");
                        pc.setRemoteDescription(new RTCSessionDescription(answer));
                    }
                });

                // ICE Candidates
                pc.onicecandidate = event => {
                    if (event.candidate) push(ref(db, `rooms/${roomId}/callerCandidates`), event.candidate.toJSON());
                };
                onChildAdded(ref(db, `rooms/${roomId}/calleeCandidates`), (snap) => {
                    pc.addIceCandidate(new RTCIceCandidate(snap.val()));
                });

            } else {
                // I AM RECEIVER
                log("Waiting for offer...");
                onValue(ref(db, `rooms/${roomId}/offer`), async (snap) => {
                    const offer = snap.val();
                    if (offer && !pc.currentRemoteDescription) {
                        log("Offer found. Sending Answer...");
                        await pc.setRemoteDescription(new RTCSessionDescription(offer));
                        
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);

                        await set(ref(db, `rooms/${roomId}/answer`), { type: answer.type, sdp: answer.sdp });

                        pc.onicecandidate = event => {
                            if (event.candidate) push(ref(db, `rooms/${roomId}/calleeCandidates`), event.candidate.toJSON());
                        };
                        onChildAdded(ref(db, `rooms/${roomId}/callerCandidates`), (snap) => {
                            pc.addIceCandidate(new RTCIceCandidate(snap.val()));
                        });
                    }
                });
            }
        }

        // Controls
        document.getElementById('btn-mic').onclick = function() {
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            this.classList.toggle('disabled-state');
        }
        document.getElementById('btn-cam').onclick = function() {
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            this.classList.toggle('disabled-state');
        }
        document.getElementById('btn-hangup').onclick = () => window.location.href = "users.html";

    </script>
</body>
</html>
