<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE_LINE | GLOBAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'VT323', monospace; background: #000; color: #22c55e; height: 100vh; overflow: hidden; margin: 0; }
        .wrapper { position: relative; width: 100vw; height: 100vh; background: #050505; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #localVideo { 
            position: absolute; bottom: 20px; right: 20px; 
            width: 180px; height: 130px; border: 2px solid #22c55e; 
            z-index: 100; transform: scaleX(-1); background: #111;
        }
        .overlay { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,0,0,0.9); border: 1px solid #22c55e; 
            padding: 15px; z-index: 200; width: 280px;
        }
        #debugLog { font-size: 0.8rem; color: #666; height: 100px; overflow-y: auto; border-top: 1px solid #22c55e; margin-top: 10px; padding-top: 5px; }
        .btn { border: 1px solid #22c55e; padding: 8px; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px; background: transparent; color: #22c55e; }
        .btn-red { background: #ef4444; color: white; border: none; }
        .btn-call { background: #22c55e; color: black; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="overlay">
            <div id="statusText" class="text-xl">SYSTEM: STANDBY</div>
            <div id="netStatus" class="text-xs text-yellow-500">ICE: IDLE</div>
            <div id="debugLog">Initializing...</div>
            
            <button id="activateBtn" class="btn btn-call hidden" onclick="startAudio()">ACTIVATE FEED</button>
            <button class="btn btn-red" onclick="location.href='users.html'">TERMINATE</button>
        </div>

        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, push, onChildAdded, get, off } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const servers = {
            iceServers: [
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ],
            iceCandidatePoolSize: 10,
        };

        let pc = new RTCPeerConnection(servers);
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const log = (msg) => { 
            const d = document.getElementById('debugLog');
            d.innerHTML += `<div>> ${msg}</div>`;
            d.scrollTop = d.scrollHeight;
        };

        window.startAudio = () => {
            document.getElementById('remoteVideo').play();
            document.getElementById('activateBtn').classList.add('hidden');
        };

        async function init() {
            if (!roomId) return log("Error: No Room ID");
            
            const localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            pc.oniceconnectionstatechange = () => {
                document.getElementById('netStatus').innerText = `ICE: ${pc.iceConnectionState.toUpperCase()}`;
                if(pc.iceConnectionState === 'failed') log("Connection failed. NAT/Firewall block.");
            };

            pc.ontrack = (event) => {
                log("Signal received!");
                const rv = document.getElementById('remoteVideo');
                if (!rv.srcObject) rv.srcObject = event.streams[0];
                document.getElementById('statusText').innerText = "STATUS: ONLINE";
                document.getElementById('activateBtn').classList.remove('hidden');
            };

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    const type = pc.localDescription.type === 'offer' ? 'offerCandidates' : 'answerCandidates';
                    push(ref(db, `calls/${roomId}/${type}`), e.candidate.toJSON());
                }
            };

            const callRef = ref(db, `calls/${roomId}`);
            const snap = await get(callRef);
            const data = snap.val();

            // --- CALLER LOGIC ---
            if (!data || !data.offer) {
                log("Starting new uplink...");
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await set(callRef, { offer: { type: offer.type, sdp: offer.sdp } });

                onValue(callRef, (s) => {
                    const d = s.val();
                    // State Guard: Only set answer if we have sent an offer and aren't connected yet
                    if (pc.signalingState === "have-local-offer" && d?.answer) {
                        log("Answer detected. Syncing...");
                        pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                    }
                });

                onChildAdded(ref(db, `calls/${roomId}/answerCandidates`), (s) => {
                    if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(s.val()));
                });
            } 
            // --- RECEIVER LOGIC ---
            else {
                log("Intercepting uplink...");
                // State Guard: Only set offer if we are in stable state
                if (pc.signalingState === "stable") {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await update(callRef, { answer: { type: answer.type, sdp: answer.sdp } });
                }

                onChildAdded(ref(db, `calls/${roomId}/offerCandidates`), (s) => {
                    if (pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(s.val()));
                });
            }
        }

        init().catch(e => log("System Error: " + e.message));
    </script>
</body>
</html>
