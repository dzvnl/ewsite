<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE_LINE | INTER-CITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'VT323', monospace; background: #000; color: #22c55e; height: 100vh; overflow: hidden; margin: 0; }
        .wrapper { position: relative; width: 100vw; height: 100vh; background: #050505; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #localVideo { 
            position: absolute; bottom: 20px; right: 20px; 
            width: 180px; height: 130px; border: 2px solid #22c55e; 
            z-index: 100; transform: scaleX(-1); background: #111;
        }
        .overlay { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,0,0,0.9); border: 1px solid #22c55e; 
            padding: 15px; z-index: 200; width: 280px;
        }
        #debugLog { font-size: 0.8rem; color: #666; height: 80px; overflow-y: auto; border-top: 1px solid #22c55e; margin-top: 10px; padding-top: 5px; }
        .btn { border: 1px solid #22c55e; padding: 8px; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px; }
        .btn-red { background: #ef4444; color: white; border: none; }
        .btn-call { background: #22c55e; color: black; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="overlay">
            <div id="statusText" class="text-xl">STATUS: CONNECTING...</div>
            <div id="netStatus" class="text-xs text-yellow-500">ICE: INITIALIZING</div>
            <div id="debugLog">Waiting for peer...</div>
            
            <button id="activateBtn" class="btn btn-call hidden" onclick="startAudio()">ACTIVATE ENCRYPTED FEED</button>
            <button class="btn btn-red" onclick="location.href='users.html'">TERMINATE</button>
        </div>

        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, push, onChildAdded, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Using multiple STUN servers for better cross-house connectivity
        const pc = new RTCPeerConnection({ 
            iceServers: [
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun.l.google.com:19302' }
            ] 
        });

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const log = (msg) => { document.getElementById('debugLog').innerHTML += `<div>> ${msg}</div>`; };

        window.startAudio = () => {
            const rv = document.getElementById('remoteVideo');
            rv.play().then(() => {
                document.getElementById('activateBtn').classList.add('hidden');
                log("Media playback started.");
            }).catch(e => log("Playback failed: " + e.message));
        };

        async function init() {
            if (!roomId) return;
            
            const localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            // Monitor the actual network connection state
            pc.oniceconnectionstatechange = () => {
                document.getElementById('netStatus').innerText = `ICE: ${pc.iceConnectionState.toUpperCase()}`;
                log(`Net State: ${pc.iceConnectionState}`);
            };

            pc.ontrack = (event) => {
                log("Remote track detected!");
                const rv = document.getElementById('remoteVideo');
                if (!rv.srcObject) rv.srcObject = event.streams[0];
                document.getElementById('statusText').innerText = "STATUS: LINK ESTABLISHED";
                document.getElementById('activateBtn').classList.remove('hidden');
            };

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    const type = pc.localDescription.type === 'offer' ? 'offerCandidates' : 'answerCandidates';
                    push(ref(db, `calls/${roomId}/${type}`), e.candidate.toJSON());
                }
            };

            const callRef = ref(db, `calls/${roomId}`);
            const snap = await get(callRef);
            const data = snap.val();

            if (!data || !data.offer) {
                log("Acting as Caller.");
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await set(callRef, { offer: { type: offer.type, sdp: offer.sdp } });
                onValue(callRef, (s) => {
                    const d = s.val();
                    if (!pc.remoteDescription && d?.answer) pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                });
                onChildAdded(ref(db, `calls/${roomId}/answerCandidates`), (s) => pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(e => {}));
            } else {
                log("Acting as Receiver.");
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await update(callRef, { answer: { type: answer.type, sdp: answer.sdp } });
                onChildAdded(ref(db, `calls/${roomId}/offerCandidates`), (s) => pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(e => {}));
            }
        }

        init();
    </script>
</body>
</html>
