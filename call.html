<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE_LINE | TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'VT323', monospace; background: #000; color: #22c55e; height: 100vh; overflow: hidden; margin: 0; }
        
        .video-wrapper { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050505; display: block;
        }

        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #111; }

        #localVideo { 
            position: absolute; bottom: 20px; right: 20px; 
            width: 200px; height: 150px; border: 2px solid #22c55e; 
            z-index: 100; transform: scaleX(-1); background: #000;
        }

        .overlay { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,0,0,0.85); border: 1px solid #22c55e; 
            padding: 15px; z-index: 200; min-width: 250px;
        }

        #debugLog { font-size: 0.85rem; color: #888; margin-top: 10px; height: 100px; overflow-y: auto; border-top: 1px solid #333; }
        .btn { padding: 5px 15px; cursor: pointer; border: 1px solid #22c55e; background: transparent; color: #22c55e; text-transform: uppercase; margin-top: 10px; }
        .btn-red { background: #ef4444; color: white; border: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div class="overlay">
            <div id="statusText" class="text-xl">SYSTEM: STANDBY</div>
            <div id="debugLog">Initializing...</div>
            <div class="flex gap-2">
                <button class="btn btn-red" onclick="location.href='users.html'">LEAVE</button>
                <button id="playBtn" class="btn hidden" onclick="forcePlay()">ACTIVATE VIDEO</button>
            </div>
        </div>

        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, push, onChildAdded, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] });
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const log = (msg) => { 
            const d = document.getElementById('debugLog');
            d.innerHTML += `<div>> ${msg}</div>`;
            d.scrollTop = d.scrollHeight;
        };

        window.forcePlay = () => {
            document.getElementById('remoteVideo').play();
            document.getElementById('playBtn').classList.add('hidden');
        };

        async function start() {
            if (!roomId) return;
            log("Opening camera...");
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = stream;
                stream.getTracks().forEach(track => pc.addTrack(track, stream));
            } catch (e) { log("CAMERA ERROR: " + e.message); }

            pc.ontrack = (event) => {
                log("Remote track received!");
                const remoteVid = document.getElementById('remoteVideo');
                if (!remoteVid.srcObject) remoteVid.srcObject = event.streams[0];
                document.getElementById('statusText').innerText = "STATUS: LINK ACTIVE";
                document.getElementById('playBtn').classList.remove('hidden');
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const path = pc.localDescription.type === 'offer' ? 'offerCandidates' : 'answerCandidates';
                    push(ref(db, `calls/${roomId}/${path}`), event.candidate.toJSON());
                }
            };

            const callRef = ref(db, `calls/${roomId}`);
            const snapshot = await get(callRef);
            const data = snapshot.val();

            if (!data || !data.offer) {
                log("Starting new call...");
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await set(callRef, { offer: { type: offer.type, sdp: offer.sdp } });
                onValue(callRef, (snap) => {
                    const d = snap.val();
                    if (!pc.remoteDescription && d?.answer) pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                });
                onChildAdded(ref(db, `calls/${roomId}/answerCandidates`), (s) => pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(() => {}));
            } else {
                log("Joining call...");
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await update(callRef, { answer: { type: answer.type, sdp: answer.sdp } });
                onChildAdded(ref(db, `calls/${roomId}/offerCandidates`), (s) => pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(() => {}));
            }
        }
        start();
    </script>
</body>
</html>
