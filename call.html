<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'VT323', monospace; background: #000; color: #22c55e; height: 100vh; overflow: hidden; margin: 0; }
        .video-grid { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #050505; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; bottom: 20px; right: 20px; width: 180px; border: 2px solid #22c55e; z-index: 30; transform: scaleX(-1); }
        .overlay { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); border: 1px solid #22c55e; padding: 15px; z-index: 40; }
        #debugLog { font-size: 0.8rem; color: #888; margin-top: 10px; border-top: 1px solid #333; padding-top: 5px; }
        .btn-red { background: #ef4444; color: white; padding: 10px 20px; margin-top: 10px; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <div class="video-grid">
        <div class="overlay">
            <div id="statusText">standby</div>
            <div id="debugLog">initializing</div>
            <button class="btn-red" onclick="location.href='users.html'">leave</button>
        </div>

        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, push, onChildAdded, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlUyqTb9onQ0PyOxLfZkDddeSnYdB2PlQ",
            authDomain: "ewsitechat.firebaseapp.com",
            databaseURL: "https://ewsitechat-default-rtdb.firebaseio.com",
            projectId: "ewsitechat",
            storageBucket: "ewsitechat.firebasestorage.app",
            messagingSenderId: "282495574514",
            appId: "1:282495574514:web:e2781da630d93fc1ce8b6b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] });
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const log = (msg) => { document.getElementById('debugLog').innerText += "\n> " + msg; console.log(msg); };

        async function start() {
            if (!roomId) return alert("Missing Room ID");
            log("Accessing camera...");
            
            const localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.ontrack = (event) => {
                log("Remote track received!");
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('statusText').innerText = "STATUS: ENCRYPTED LINK ACTIVE";
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const path = pc.localDescription.type === 'offer' ? 'offerCandidates' : 'answerCandidates';
                    push(ref(db, `calls/${roomId}/${path}`), event.candidate.toJSON());
                }
            };

            const callRef = ref(db, `calls/${roomId}`);
            const snapshot = await get(callRef);
            const data = snapshot.val();

            if (!data || !data.offer) {
                log("No offer found. Acting as Caller.");
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await set(callRef, { offer: { type: offer.type, sdp: offer.sdp } });

                onValue(callRef, (snap) => {
                    const d = snap.val();
                    if (!pc.remoteDescription && d?.answer) {
                        log("Answer detected. Connecting...");
                        pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                    }
                });
                onChildAdded(ref(db, `calls/${roomId}/answerCandidates`), (s) => pc.addIceCandidate(new RTCIceCandidate(s.val())));
            } else {
                log("Offer found. Acting as Receiver.");
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await update(callRef, { answer: { type: answer.type, sdp: answer.sdp } });
                onChildAdded(ref(db, `calls/${roomId}/offerCandidates`), (s) => pc.addIceCandidate(new RTCIceCandidate(s.val())));
            }
        }

        start().catch(e => log("CRITICAL ERROR: " + e.message));
    </script>
</body>
</html>
